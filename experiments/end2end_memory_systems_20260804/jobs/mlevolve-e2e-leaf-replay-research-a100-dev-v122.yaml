apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-replay-research-a100-dev-v122
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v122
    mlevolve.ai/workload: leaf-replay-research-v122
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: leaf-top5-replay-research-alignment-gate-six-hour-smoke-pod32
    mlevolve.ai/source-git-head: ea3b8ffe66f1a3208ff72cd00293a307688aa175
    mlevolve.ai/source-release-sha256: c318e99e61db79d0ceef7d19921af7f1b6eea8a22e912589630959d7ab75fe64
    mlevolve.ai/runtime-transport-sha256: a062cb1c914b4e8ad6eb33dff5f5da711200d7bc49265e827a855437a7f8fa00
    mlevolve.ai/replay-targets-sha256: 69019b0b3c62d8fa890a74614635c46373dd80a112543a358746eb4da822b3d4
    mlevolve.ai/source-role-policy: coldstart-replay-novel-then-bounded-replay-research
    mlevolve.ai/replay-research: score-top5-plus-diverse-frontier-top5
    mlevolve.ai/replay-exact-budget: "2"
    mlevolve.ai/required-memory-bundle: end2end-leaf-atomic-recipe-runforest-v8
    mlevolve.ai/required-formal-debug-clauses: "296"
    mlevolve.ai/transition-capsule-sha256: ae8a06a6a4ef896e09516ad2d953462a601c1ea5871bf9707fdd20ff7dea8559
    mlevolve.ai/compatibility-preflight: disabled
    mlevolve.ai/v122-defect-repair: modified-replay-submission-alignment-fail-closed
    mlevolve.ai/v122-deadline-contract: pod-28800s-for-solver-21600s
    mlevolve.ai/excluded-unhealthy-nodes: node-1-3.sdsc.optiputer.net,node-2-3.sdsc.optiputer.net
spec:
  activeDeadlineSeconds: 28800
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - node-1-3.sdsc.optiputer.net
                  - node-2-3.sdsc.optiputer.net
  initContainers:
    - name: assemble-runtime
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - |
          set -euo pipefail
          archive=/tmp/leaf-v122-runtime-transport.tar.gz
          find /transport -type f -name 'chunk-*' -print0 | sort -z | xargs -0 cat > "${archive}"
          echo 'a062cb1c914b4e8ad6eb33dff5f5da711200d7bc49265e827a855437a7f8fa00  /tmp/leaf-v122-runtime-transport.tar.gz' | sha256sum -c -
          tar -xzf "${archive}" -C /runtime
          test "$(sha256sum /runtime/experiments/end2end_memory_systems_20260804/manifests_v122/leaf_official_replay_targets.json | awk '{print $1}')" = '69019b0b3c62d8fa890a74614635c46373dd80a112543a358746eb4da822b3d4'
          test "$(sha256sum /runtime/experiments/end2end_memory_systems_20260804/systems_v122/dynamic_hybrid.yaml | awk '{print $1}')" = '4542381ffe9a797946dca02eac17fdcb64ba3ee9814d6705cb4e181308e280e0'
          test "$(sha256sum /runtime/mlevolve/agents/memory/run_forest_replay.py | awk '{print $1}')" = 'c01034227b53e4f7a865a07d45e37b8fba087c0917740f7d24ec558b41d86c3f'
          test "$(sha256sum /runtime/mlevolve/engine/agent_search.py | awk '{print $1}')" = '976d41462bae69dd40710782c707cd96414695d1010fc4e973b5f2fac6e0b012'
          test "$(sha256sum /runtime/mlevolve/agents/result_log_facts.py | awk '{print $1}')" = 'b543cd13ed28e6b276ff897fdf554cc73ca027f4d8101523e6246860e93878fe'
          test "$(sha256sum /runtime/mlevolve/agents/result_parse_agent.py | awk '{print $1}')" = '1f5a2cc25fe9e2b372aee9e0a91a6a4420595e50b330570d750252d13925328a'
          cd /runtime
          python3 -m py_compile \
            mlevolve/agents/result_log_facts.py \
            mlevolve/agents/result_parse_agent.py \
            mlevolve/agents/memory/run_forest_replay.py \
            mlevolve/agents/replay_research_agent.py \
            mlevolve/agents/memory_strategy_agent.py \
            mlevolve/engine/agent_search.py
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: runtime
          mountPath: /runtime
        - name: transport-chunks
          mountPath: /transport
          readOnly: true
  containers:
    - name: leaf-replay-research
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      envFrom:
        - secretRef:
            name: prevalence-audit-deepseek-r1
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: runtime
          mountPath: /tmp/nautilus-exp-end2end-agent-v122-runtime
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: runtime
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: transport-chunks
