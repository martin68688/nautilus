apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-atomic-memory-publish-v79
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v79
    mlevolve.ai/workload: mlevolve-e2e-leaf-atomic-memory-publish-v79
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: immutable-source-and-memory-publication-v79
spec:
  restartPolicy: Never
  containers:
    - name: publisher
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
