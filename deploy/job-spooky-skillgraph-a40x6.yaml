# NRP batch Job - spooky-author-identification, standard SkillGraph external memory.
# Resources: 6x A40, 7 CPU, 32Gi memory.
#
# Default priority: omit priorityClassName.
# A40 nodes expose nvidia.com/a40; select A40 by product label.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-spooky-skillgraph-a40x6
  namespace: ecepxie
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A40
      containers:
      - name: mlevolve
        image: haomingwang22/mlevolve:v1
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          RUN_REPO=/workspace/nautilus-skillgraph-a40x6
          if [ ! -d "$RUN_REPO/.git" ]; then
            if [ -d /workspace/nautilus/.git ]; then
              git clone --no-hardlinks /workspace/nautilus "$RUN_REPO"
            else
              git clone --branch beta2-skillgraph --depth=1 git@github.com:martin68688/nautilus.git "$RUN_REPO"
            fi
          fi

          cd "$RUN_REPO"
          git config --global --add safe.directory "$RUN_REPO"
          rm -f .git/shallow.lock .git/index.lock 2>/dev/null || true
          git fetch origin beta2-skillgraph --depth=1
          git checkout -B beta2-skillgraph origin/beta2-skillgraph
          git reset --hard origin/beta2-skillgraph

          if [ -f /workspace/nautilus/mlevolve/.env ]; then
            cp /workspace/nautilus/mlevolve/.env "$RUN_REPO/mlevolve/.env"
          elif [ -f /workspace/trace2skill-baseline/mlevolve/.env ]; then
            cp /workspace/trace2skill-baseline/mlevolve/.env "$RUN_REPO/mlevolve/.env"
          fi

          cd "$RUN_REPO/mlevolve"
          set -a; . ./.env; set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL

          python run.py \
            exp_id=spooky-author-identification \
            exp_name=spooky-skillgraph-a40x6 \
            dataset_dir=./data \
            data_dir=./data/spooky-author-identification/prepared/public \
            desc_file=./data/spooky-author-identification/prepared/public/description.md \
            agent.use_global_memory=True \
            agent.search.num_gpus=6 \
            agent.search.parallel_search_num=6 \
            cpu_number=7 \
            external_skill_memory.enable=True \
            external_skill_memory.source_name=skillgraph \
            external_skill_memory.graph_path="../paper-skills/distillation/graph_build/graph_optimized_skillgraph.json" \
            adoption_tracking.enable=True \
            adoption_tracking.enable_analysis=True \
            adoption_tracking.judge_mode=keyword
        resources:
          limits:
            nvidia.com/a40: 6
            cpu: "7"
            memory: "32Gi"
          requests:
            nvidia.com/a40: 6
            cpu: "7"
            memory: "32Gi"
        volumeMounts:
        - name: my-storage
          mountPath: /workspace
      volumes:
      - name: my-storage
        persistentVolumeClaim:
          claimName: haoming-storage
