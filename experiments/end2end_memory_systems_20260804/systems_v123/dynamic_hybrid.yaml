# v123 keeps v122 Replay Research behavior but switches Leaf candidate outputs
# from the 99-row fixed holdout contract to the complete 594-row official test.
extends: ../systems_v122/dynamic_hybrid.yaml

fixed_holdout:
  enabled: false
  train_manifest_path: ""
  bypass_protocol_gates: false
  preflight_validate_train_view: false
  internal_metric_disposition: search_only

official_submission:
  enabled: true
  provider: kaggle
  competition: leaf-classification
  metric: log_loss
  maximize: false
  sample_submission_path: sample_submission.csv
  id_column: id
  prediction_kind: multiclass_probability
  probability_row_sum_tolerance: 0.0001
  submission_subdir: submission

run_identity:
  memory_version: leaf_replay_research_top10_v123_official_test
