# =============================================================================
# NRP batch Job — mlevolve baseline, 3x L40/L40S (48GB).
#   namespace : ecepxie ; image : haomingwang22/mlevolve:v1
#   storage   : PVC haoming-storage -> /workspace  (repo + .env persist here)
#
# Pure training Job. Push run logs to GitHub ON DEMAND via the `pod-push-runs`
# skill after the Job finishes (not baked in here).
#
# HARD RULE: run.py is foreground and EXITS (no sleep). CONFIG LAYERING: run.py
# overrides ONLY num_gpus + cpu_number; steps/time_limit/exec.timeout/
# use_grading_server come from config.yaml defaults (80 steps / 6h).
#
# Coupled trio (change together): resources GPU/cpu  +  agent.search.num_gpus
#                                          + cpu_number
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-spooky-t2s          # trace2skill-baseline clean baseline (change per run)
  namespace: ecepxie
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      tolerations:
        # Tolerate the GPU taint on Nautilus L40 nodes (nvidia.com/gpu=Exists).
      - key: nvidia.com/gpu
        operator: Exists
      affinity:
        # Pin to L40 / L40S. Resource key is generic nvidia.com/gpu (pinned via
        # product label). L40 is NOT under ecepxie's a100 quota -> runs alongside
        # the A100 job. Availability: kubectl get nodes -L nvidia.com/gpu.product | grep -i l40
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-L40S
                - NVIDIA-L40
      containers:
      - name: mlevolve
        image: haomingwang22/mlevolve:v1
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            # Run from the ISOLATED working copy /workspace/trace2skill-baseline (pre-cloned,
            # branch trace2skill-baseline). Does NOT touch shared /workspace/nautilus (the beta1
            # job uses that). Optional tolerant code update (isolated .git, no stale lock).
            cd /workspace/trace2skill-baseline
            rm -f .git/shallow.lock 2>/dev/null
            timeout 90 git fetch origin trace2skill-baseline --depth=1 2>/dev/null && \
              git checkout origin/trace2skill-baseline -- mlevolve/engine/ mlevolve/agents/ paper-skills/experience_kb/ 2>/dev/null || \
              echo "update skipped, using pre-cloned copy"
            cd /workspace/trace2skill-baseline/mlevolve
            set -a; . ./.env; set +a
            export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL
            # num_gpus + parallel_search_num + cpu_number -- match resources below.
            python run.py \
              exp_id=spooky-author-identification \
              dataset_dir=./data \
              data_dir=./data/spooky-author-identification/prepared/public \
              desc_file=./data/spooky-author-identification/prepared/public/description.md \
              agent.search.num_gpus=3 \
              agent.search.parallel_search_num=3 \
              cpu_number=8
            # <- run.py returns -> PID 1 exits -> pod Completes. NEVER append sleep/bash.
        resources:
          limits:
            nvidia.com/gpu: 3
            cpu: "8"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: 3
            cpu: "8"
            memory: "32Gi"
        volumeMounts:
        - name: my-storage
          mountPath: /workspace
      volumes:
      - name: my-storage
        persistentVolumeClaim:
          claimName: haoming-storage
