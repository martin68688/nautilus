{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "annotations": {
      "mlevolve.ai/manifest-sha256": "c92f0140b93e07a6b5e638e1c3326d1a5d0ebcfd1fcdd12b0f014632ae54afae",
      "mlevolve.ai/purpose": "three-role-dynamic-smoke",
      "mlevolve.ai/runtime-source-lock-sha256": "bb65b1c9d2e4fb40e4c06adfa9c61af1902b8e0373f9ab436a66c6a91cd6fa8b"
    },
    "labels": {
      "app": "mlevolve-end2end-dev",
      "app.kubernetes.io/managed-by": "codex-nrp-training",
      "ecepxie.nrp/owner": "haoming",
      "experiment": "experiment-end2end-memory-agent-v138-smoke-r2",
      "mlevolve.ai/release-mode": "smoke",
      "mlevolve.ai/system": "dynamic_hybrid"
    },
    "name": "mlevolve-leaf-gpt56sol-v138-smoke-r2-dev",
    "namespace": "ecepxie"
  },
  "spec": {
    "containers": [
      {
        "args": [
          "exec sleep infinity"
        ],
        "command": [
          "/bin/bash",
          "-lc"
        ],
        "env": [
          {
            "name": "PYTHONUNBUFFERED",
            "value": "1"
          },
          {
            "name": "PYTHONDONTWRITEBYTECODE",
            "value": "1"
          },
          {
            "name": "PYTHONPATH",
            "value": "/workspace/nautilus-exp-end2end-agent-v138-smoke-r2/mlevolve:/workspace/nautilus-exp-end2end-agent-v138-smoke-r2"
          }
        ],
        "envFrom": [
          {
            "secretRef": {
              "name": "mlevolve-openai-gpt56sol-v1"
            }
          }
        ],
        "image": "docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc",
        "imagePullPolicy": "IfNotPresent",
        "name": "dev",
        "resources": {
          "limits": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/a100": "1"
          },
          "requests": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/a100": "1"
          }
        },
        "volumeMounts": [
          {
            "mountPath": "/workspace",
            "name": "workspace"
          },
          {
            "mountPath": "/dev/shm",
            "name": "shm"
          }
        ]
      }
    ],
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 180,
    "tolerations": [
      {
        "key": "nvidia.com/gpu",
        "operator": "Exists"
      }
    ],
    "volumes": [
      {
        "name": "workspace",
        "persistentVolumeClaim": {
          "claimName": "haoming-storage"
        }
      },
      {
        "emptyDir": {
          "medium": "Memory",
          "sizeLimit": "16Gi"
        },
        "name": "shm"
      }
    ]
  }
}
