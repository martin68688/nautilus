apiVersion: v1
kind: Pod
metadata:
  name: mlebench-memory-debug-l40sx1-r2
  namespace: ecepxie
  labels:
    app: mlebench-memory-debug
    role: dev-pod
spec:
  restartPolicy: Always
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-L40S
  containers:
    - name: dev
      image: haomingwang22/mlevolve:v1
      command:
        - /bin/bash
        - -lc
      args:
        - exec tail -f /dev/null
      resources:
        requests:
          cpu: "7"
          memory: 16Gi
          ephemeral-storage: "0"
          nvidia.com/gpu: "1"
        limits:
          cpu: "7"
          memory: 16Gi
          ephemeral-storage: 50Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
