# Dev pod for hybrid-vs-llm-all adoption judge testing (2x RTX A6000, 8 CPU, 16Gi).
# Interactive (sleep). Code goes to /tmp (NOT PVC) to avoid polluting running jobs.
# PVC mounted read-only-by-convention: we only READ journals/.env from it.
apiVersion: v1
kind: Pod
metadata:
  name: tmp-read-gpu
  namespace: ecepxie
spec:
  restartPolicy: Always
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-RTX-A6000
  containers:
  - name: dev
    image: haomingwang22/mlevolve:v1
    command: ["/bin/bash", "-c"]
    args:
    - "sleep infinity"
    resources:
      limits:
        nvidia.com/rtxa6000: 1
        cpu: "8"
        memory: "16Gi"
      requests:
        nvidia.com/rtxa6000: 1
        cpu: "8"
        memory: "16Gi"
    volumeMounts:
    - name: my-storage
      mountPath: /workspace
  volumes:
  - name: my-storage
    persistentVolumeClaim:
      claimName: haoming-storage
