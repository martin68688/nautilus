{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "annotations": {
      "mlevolve.ai/manifest-sha256": "0403856379e832ba052bb60ed5cb35a520af4665dbb7d580ba9b8bdc5ca16d37",
      "mlevolve.ai/purpose": "sixteen-step-three-role-dynamic-smoke",
      "mlevolve.ai/runtime-source-lock-sha256": "b9a71403a1af761f46d2d75a095112c7a69a6d22a936f5258bc9431322f38f79"
    },
    "labels": {
      "app": "mlevolve-end2end-dev",
      "app.kubernetes.io/managed-by": "codex-nrp-training",
      "ecepxie.nrp/owner": "haoming",
      "experiment": "experiment-end2end-memory-agent-v141-smoke16-r5",
      "mlevolve.ai/release-mode": "smoke",
      "mlevolve.ai/system": "dynamic_hybrid"
    },
    "name": "mlevolve-leaf-gpt56sol-v141-smoke16-r5-dev",
    "namespace": "ecepxie"
  },
  "spec": {
    "affinity": {
      "nodeAffinity": {
        "requiredDuringSchedulingIgnoredDuringExecution": {
          "nodeSelectorTerms": [
            {
              "matchExpressions": [
                {
                  "key": "nvidia.com/gpu.product",
                  "operator": "In",
                  "values": [
                    "NVIDIA-A10"
                  ]
                }
              ]
            }
          ]
        }
      }
    },
    "containers": [
      {
        "args": [
          "exec sleep infinity"
        ],
        "command": [
          "/bin/bash",
          "-lc"
        ],
        "env": [
          {
            "name": "PYTHONUNBUFFERED",
            "value": "1"
          },
          {
            "name": "PYTHONDONTWRITEBYTECODE",
            "value": "1"
          },
          {
            "name": "PYTHONPATH",
            "value": "/workspace/nautilus-exp-end2end-agent-v141-smoke16-r5/mlevolve:/workspace/nautilus-exp-end2end-agent-v141-smoke16-r5"
          }
        ],
        "envFrom": [
          {
            "secretRef": {
              "name": "mlevolve-openai-gpt56sol-v1"
            }
          }
        ],
        "image": "docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc",
        "imagePullPolicy": "IfNotPresent",
        "name": "dev",
        "resources": {
          "limits": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/gpu": "1"
          },
          "requests": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/gpu": "1"
          }
        },
        "volumeMounts": [
          {
            "mountPath": "/workspace",
            "name": "workspace"
          },
          {
            "mountPath": "/dev/shm",
            "name": "shm"
          }
        ]
      }
    ],
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 180,
    "tolerations": [
      {
        "key": "nvidia.com/gpu",
        "operator": "Exists"
      }
    ],
    "volumes": [
      {
        "name": "workspace",
        "persistentVolumeClaim": {
          "claimName": "haoming-storage"
        }
      },
      {
        "emptyDir": {
          "medium": "Memory",
          "sizeLimit": "16Gi"
        },
        "name": "shm"
      }
    ]
  }
}
