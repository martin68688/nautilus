# Leaf official-test profile.  Keep the project-wide config provider-neutral;
# future Leaf releases explicitly extend or merge this profile.
fixed_holdout:
  enabled: false
  evaluation_mode: terminal_only
  train_manifest_path: ""
  bypass_protocol_gates: false
  preflight_validate_train_view: false
  internal_metric_disposition: search_only

official_submission:
  enabled: true
  provider: kaggle
  competition: leaf-classification
  metric: log_loss
  maximize: false
  sample_submission_path: sample_submission.csv
  id_column: id
  prediction_kind: multiclass_probability
  probability_row_sum_tolerance: 0.0001
  submission_subdir: submission
