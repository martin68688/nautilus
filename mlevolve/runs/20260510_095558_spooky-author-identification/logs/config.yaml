coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: bert-base-cased\n\nDescription:BERT-base-cased is the standard\
    \ BERT model for authorship attribution tasks. CRITICAL: Use 'cased' version (not\
    \ uncased) because case information is important for author style. Train for 10\
    \ epochs (vs 2-4 for typical NLP) as authorship needs more training. No text preprocessing\
    \ needed. Achieves 14.3% relative accuracy gain over TF-IDF baseline. Best for:\
    \ 20+ texts per author, moderate number of authors (<100), balanced data. Evidence:\
    \ BertAA paper shows accuracy improved from 88.7% (1 epoch) to 93.0% (10 epochs)\
    \ on IMDb62 dataset.\n\nCode template (MUST copy exactly — do NOT change model\
    \ variant names or file paths):\n```python\nfrom transformers import AutoTokenizer,\
    \ AutoModelForSequenceClassification, AdamW\nimport torch\n\n# Load BERT-base-cased\
    \ for authorship attribution\nmodel_name = 'bert-base-cased'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
    model = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=num_authors)\n\
    \ndevice = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel.to(device)\n\
    \n# Tokenize texts (no preprocessing needed for authorship attribution)\ntrain_encodings\
    \ = tokenizer(train_texts, truncation=True, padding=True, max_length=512, return_tensors='pt')\n\
    train_dataset = torch.utils.data.TensorDataset(\n    train_encodings['input_ids'],\
    \ \n    train_encodings['attention_mask'], \n    torch.tensor(train_labels)\n\
    )\ntrain_loader = torch.utils.data.DataLoader(train_dataset, batch_size=16, shuffle=True)\n\
    \n# Training configuration\noptimizer = AdamW(model.parameters(), lr=2e-5)\n\n\
    # Train for 10 epochs (more than typical NLP tasks)\nfor epoch in range(10):\n\
    \    model.train()\n    for batch in train_loader:\n        input_ids, attention_mask,\
    \ labels = [b.to(device) for b in batch]\n        outputs = model(input_ids=input_ids,\
    \ attention_mask=attention_mask, labels=labels)\n        loss = outputs.loss\n\
    \        loss.backward()\n        optimizer.step()\n        optimizer.zero_grad()\n\
    \n# Inference\nmodel.eval()\nwith torch.no_grad():\n    test_encodings = tokenizer(test_texts,\
    \ truncation=True, padding=True, max_length=512, return_tensors='pt')\n    outputs\
    \ = model(input_ids=test_encodings['input_ids'].to(device), attention_mask=test_encodings['attention_mask'].to(device))\n\
    \    probs = torch.softmax(outputs.logits, dim=1).cpu().numpy()\n```\n\nModel2:\
    \ microsoft/deberta-v3-large\n\nDescription:DeBERTa-v3-large (435M parameters)\
    \ is a large-scale pretrained language model with disentangled attention mechanisms.\
    \ Superior to BERT for authorship attribution. Use for better performance than\
    \ BERT, especially with longer texts. Train for 20-40 epochs. No preprocessing\
    \ needed. Architecture: 24 layers, hidden size 1024, 40 attention heads. Best\
    \ for: text classification, authorship attribution, sentiment analysis, NLI. Outperforms\
    \ BERT and RoBERTa on most benchmarks.\n\nCode template (MUST copy exactly — do\
    \ NOT change model variant names or file paths):\n```python\nfrom transformers\
    \ import AutoTokenizer, AutoModelForSequenceClassification, AdamW\nimport torch\n\
    \n# Load DeBERTa-v3-large for authorship attribution\nmodel_name = 'microsoft/deberta-v3-large'\n\
    tokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForSequenceClassification.from_pretrained(model_name,\
    \ num_labels=num_authors)\n\ndevice = torch.device('cuda' if torch.cuda.is_available()\
    \ else 'cpu')\nmodel.to(device)\n\n# Tokenize (DeBERTa handles longer sequences\
    \ well)\ntrain_encodings = tokenizer(train_texts, truncation=True, padding=True,\
    \ max_length=512, return_tensors='pt')\n\n# Training configuration\noptimizer\
    \ = AdamW(model.parameters(), lr=2e-5, weight_decay=0.01)\n\n# Train for 20-40\
    \ epochs for authorship attribution\nfor epoch in range(20):\n    model.train()\n\
    \    for batch in train_loader:\n        input_ids, attention_mask, labels = [b.to(device)\
    \ for b in batch]\n        outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ labels=labels)\n        loss = outputs.loss\n        loss.backward()\n     \
    \   optimizer.step()\n        optimizer.zero_grad()\n\n# Prediction\nmodel.eval()\n\
    with torch.no_grad():\n    test_encodings = tokenizer(test_texts, truncation=True,\
    \ padding=True, max_length=512, return_tensors='pt')\n    outputs = model(**test_encodings.to(device))\n\
    \    probs = torch.softmax(outputs.logits, dim=1).cpu().numpy()\n```\n\nModel3:\
    \ roberta-base\n\nDescription:RoBERTa-base (125M parameters) is an optimized BERT\
    \ variant with improved pretraining. Good alternative to BERT for authorship attribution.\
    \ Trained with dynamic masking and larger batches. Use for: text classification,\
    \ authorship attribution. Train for 10 epochs. No preprocessing needed. Slightly\
    \ better than BERT on many tasks.\n\nCode template (MUST copy exactly — do NOT\
    \ change model variant names or file paths):\n```python\nfrom transformers import\
    \ AutoTokenizer, AutoModelForSequenceClassification, AdamW\nimport torch\n\n#\
    \ Load RoBERTa-base for authorship attribution\nmodel_name = 'roberta-base'\n\
    tokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForSequenceClassification.from_pretrained(model_name,\
    \ num_labels=num_authors)\n\ndevice = torch.device('cuda' if torch.cuda.is_available()\
    \ else 'cpu')\nmodel.to(device)\n\n# Tokenize\ntrain_encodings = tokenizer(train_texts,\
    \ truncation=True, padding=True, max_length=512, return_tensors='pt')\n\n# Training\n\
    optimizer = AdamW(model.parameters(), lr=2e-5)\nfor epoch in range(10):\n    model.train()\n\
    \    for batch in train_loader:\n        input_ids, attention_mask, labels = [b.to(device)\
    \ for b in batch]\n        outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ labels=labels)\n        loss = outputs.loss\n        loss.backward()\n     \
    \   optimizer.step()\n        optimizer.zero_grad()\n\n# Inference\nmodel.eval()\n\
    with torch.no_grad():\n    outputs = model(**test_encodings.to(device))\n    probs\
    \ = torch.softmax(outputs.logits, dim=1).cpu().numpy()\n```\n\nModel4: distilbert-base-uncased\n\
    \nDescription:DistilBERT-base-uncased (66M parameters) is a distilled version\
    \ of BERT, 40% smaller and 60% faster while retaining 97% of BERT's performance.\
    \ Use for: faster training and inference when resources are limited. Good for\
    \ quick experiments. Note: uncased version loses case information which may hurt\
    \ authorship attribution performance. Consider using cased version if available.\n\
    \nCode template (MUST copy exactly — do NOT change model variant names or file\
    \ paths):\n```python\nfrom transformers import AutoTokenizer, AutoModelForSequenceClassification,\
    \ AdamW\nimport torch\n\n# Load DistilBERT for faster authorship attribution\n\
    model_name = 'distilbert-base-uncased'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
    model = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=num_authors)\n\
    \ndevice = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel.to(device)\n\
    \n# Tokenize\ntrain_encodings = tokenizer(train_texts, truncation=True, padding=True,\
    \ max_length=512, return_tensors='pt')\n\n# Training (faster than BERT)\noptimizer\
    \ = AdamW(model.parameters(), lr=2e-5)\nfor epoch in range(10):\n    model.train()\n\
    \    for batch in train_loader:\n        input_ids, attention_mask, labels = [b.to(device)\
    \ for b in batch]\n        outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ labels=labels)\n        loss = outputs.loss\n        loss.backward()\n     \
    \   optimizer.step()\n        optimizer.zero_grad()\n\n# Inference\nmodel.eval()\n\
    with torch.no_grad():\n    outputs = model(**test_encodings.to(device))\n    probs\
    \ = torch.softmax(outputs.logits, dim=1).cpu().numpy()\n```\n\nModel5: cl-tohoku/bert-large-japanese-v2\n\
    \nDescription:Japanese BERT (cl-tohoku/bert-large-japanese-v2) pretrained on Japanese\
    \ literary works (Aozora Bunko). CRITICAL: Use this for Japanese text authorship\
    \ attribution, not multilingual or English BERT. Achieves 84% accuracy for 5 authors,\
    \ 82% for 80 authors. Use text-only (do NOT add stylometric features - they hurt\
    \ performance for Japanese). Best for: Japanese native speaker texts, fewer authors\
    \ perform better. Evidence: Japanese BERT paper shows text-only outperforms text+stylometric\
    \ features.\n\nCode template (MUST copy exactly — do NOT change model variant\
    \ names or file paths):\n```python\nfrom transformers import AutoTokenizer, AutoModelForSequenceClassification,\
    \ AdamW\nimport torch\n\n# Load Japanese BERT for Japanese authorship attribution\n\
    model_name = 'cl-tohoku/bert-large-japanese-v2'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
    model = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=num_authors)\n\
    \ndevice = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel.to(device)\n\
    \n# Tokenize Japanese texts\ntrain_encodings = tokenizer(train_texts, truncation=True,\
    \ padding=True, max_length=512, return_tensors='pt')\n\n# Training\noptimizer\
    \ = AdamW(model.parameters(), lr=2e-5)\nfor epoch in range(10):\n    model.train()\n\
    \    for batch in train_loader:\n        input_ids, attention_mask, labels = [b.to(device)\
    \ for b in batch]\n        outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ labels=labels)\n        loss = outputs.loss\n        loss.backward()\n     \
    \   optimizer.step()\n        optimizer.zero_grad()\n\n# Inference\nmodel.eval()\n\
    with torch.no_grad():\n    outputs = model(**test_encodings.to(device))\n    probs\
    \ = torch.softmax(outputs.logits, dim=1).cpu().numpy()\n```"
