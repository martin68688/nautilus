    \n# PRewrite improves prompt effectiveness via reinforcement learning\n\nPRewrite\
    \ leverages reinforcement learning (RL) to rewrite under-optimized prompts into\
    \ more effective ones, achieving consistent improvements over initial prompts.\
    \ The approach utilizes a rewriter model (PaLM 2-S) trained with RL (using Proximal\
    \ Policy Optimization with KL-divergence penalty) to generate interpretable prompts.\
    \ Performance metrics (e.g., accuracy, F1) are used as task-specific rewards during\
    \ RL training.\n\n## Papers & Evidence\n- `2024acl-short54` (PRewrite): \"PRewrite\
    \ consistently improves over the initial prompts, demonstrating the effectiveness\
    \ of the proposed method.\" — Introduces RL-based prompt rewriting for improved\
    \ task performance.\n\n## Actionable Guidance\n**Model**: PaLM 2-S trained with\
    \ PPO and KL-divergence penalty.\n**Condition**: Requires task-specific rewards\
    \ (e.g., accuracy, F1) for RL fine-tuning.\n**Confidence**: HIGH — Supported by\
    \ direct evidence of consistent improvements over baseline prompts.\n\n#### Combining\
    \ perplexity and F1 as RL rewards yields best performance on NQ\n---\ntitle: Combining\
    \ perplexity and F1 as RL rewards yields best performance on NQ\nconfidence: HIGH\n\
    papers: [2024acl-short54]\n---\n\n# Combining perplexity and F1 as RL rewards\
    \ yields best performance on NQ\n\nUsing a combination of perplexity and F1 as\
    \ the reward signal for RL fine-tuning achieves the best performance on the Natural\
    \ Questions (NQ) benchmark. This approach balances fluency (perplexity) and task-specific\
    \ accuracy (F1), leading to superior results compared to single-metric rewards.\n\
    \n## Papers & Evidence\n- `2024acl-short54` (PRewrite): \"Combining perplexity\
    \ with F1 gives the best performance on NQ.\" — Demonstrates the effectiveness\
    \ of multi-metric rewards for RL training.\n\n## Actionable Guidance\n**Model**:\
    \ PaLM 2-S with combined perplexity and F1 rewards.\n**Condition**: Effective\
    \ for benchmarks requiring both fluency and accuracy (e.g., NQ).\n**Confidence**:\
    \ HIGH — Direct evidence supports the claim with specific performance improvements.\n\
    \n#### KL-divergence penalty in PPO ensures interpretable prompts\n---\ntitle:\
    \ KL-divergence penalty in PPO ensures interpretable prompts\nconfidence: HIGH\n\
    papers: [2024acl-short54]\n---\n\n# KL-divergence penalty in PPO ensures interpretable\
    \ prompts\n\nThe inclusion of a KL-divergence penalty in Proximal Policy Optimization\
    \ (PPO) during RL training ensures that the generated prompts remain interpretable.\
    \ This penalty prevents the model from deviating too far from the initial prompt\
    \ distribution, avoiding uninterpretable outputs.\n\n## Papers & Evidence\n- `2024acl-short54`\
    \ (PRewrite): \"This can be also attributed to the KL penalty in PPO.\" — Highlights\
    \ the role of KL-divergence in maintaining prompt interpretability.\n\n## Actionable\
    \ Guidance\n**Model**: PPO with KL-divergence penalty.\n**Condition**: Necessary\
    \ for generating interpretable prompts during RL training.\n**Confidence**: HIGH\
    \ — Supported by direct evidence in the paper.\n\n#### PRewrite-S outperforms\
    \ PRewrite-I by searching multiple prompts\n---\ntitle: PRewrite-S outperforms\
    \ PRewrite-I by searching multiple prompts\nconfidence: HIGH\npapers: [2024acl-short54]\n\
    ---\n\n# PRewrite-S outperforms PRewrite-I by searching multiple prompts\n\nPRewrite-S\
    \ employs a search strategy by generating multiple rewritten prompts (temperature=1)\
    \ and selecting the best-performing one, outperforming PRewrite-I (greedy decoding).\
    \ This approach leverages the variability in prompt generation to identify higher-quality\
    \ prompts for the downstream task.\n\n## Papers & Evidence\n- `2024acl-short54`\
    \ (PRewrite): \"PRewrite-S consistently shows improvement over PRewrite-I, suggesting\
    \ that search strategy can be more helpful.\" — Validates the superiority of search-based\
    \ prompt rewriting.\n\n## Actionable Guidance\n**Model**: PaLM 2-S with temperature=1\
    \ for prompt generation.\n**Condition**: Effective when computational resources\
    \ allow for multiple prompt generations.\n**Confidence**: HIGH — Direct evidence\
    \ supports the claim with consistent improvements.\n\n---\n\n### [acl-2024/probing-word-embeddings-cross-lingual-alignment-se]\n\
