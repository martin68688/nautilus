apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-plant-v167-rollover-stage-cpu-r1-dev
  namespace: ecepxie
  annotations:
    mlevolve.ai/purpose: build-and-test-work-conserving-transfer-tournament-runtime
    mlevolve.ai/source-commit: 1dc7a92c
    mlevolve.ai/llm-endpoint: private-cluster-local-cliproxyapi
    mlevolve.ai/preserves: all-v167-training-pods-and-runtimes
  labels:
    app: mlevolve-end2end-dev
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: plant-v167-rollover-stage-cpu-r1
    mlevolve.ai/system: four-seat-transfer-tournament-rollover
spec:
  activeDeadlineSeconds: 7200
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  containers:
    - name: mlevolve
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test "${OPENAI_BASE_URL:-}" = "http://cliproxyapi-haoming.ecepxie.svc.cluster.local:8317/v1"
          test "${OPENAI_MODEL:-}" = "gpt-5.6-sol"
          test -z "${RUNFOREST_DEV_EXECUTION_ROLE:-}"
          exec sleep infinity
      envFrom:
        - secretRef:
            name: cliproxyapi-haoming-client
      env:
        - name: OPENAI_MODEL
          value: gpt-5.6-sol
        - name: OPENAI_REASONING_EFFORT
          value: low
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 32Gi
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 32Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
