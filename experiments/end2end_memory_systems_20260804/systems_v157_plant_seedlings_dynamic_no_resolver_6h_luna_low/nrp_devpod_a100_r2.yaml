apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-plant-seedlings-v157-luna-low-6h-a100-r2-dev
  namespace: ecepxie
  labels:
    app: mlevolve-end2end-dev
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-plant-seedlings-v157-luna-low-6h-a100-r2
    mlevolve.ai/release-mode: six-hour-rerun
    mlevolve.ai/system: dynamic-cross-task-transfer-no-resolver
spec:
  activeDeadlineSeconds: 36000
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
      effect: PreferNoSchedule
  containers:
    - name: mlevolve
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - exec sleep infinity
      envFrom:
        - secretRef:
            name: cliproxyapi-haoming-client
      env:
        - name: OPENAI_MODEL
          value: gpt-5.6-luna
        - name: OPENAI_REASONING_EFFORT
          value: low
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONPATH
          value: /workspace/nautilus-exp-end2end-agent-v157-plant-seedlings-luna-low-6h/mlevolve:/workspace/nautilus-exp-end2end-agent-v157-plant-seedlings-luna-low-6h
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
