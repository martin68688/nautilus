    \ normalize = transforms.Normalize(\n        mean=(0.485, 0.456, 0.406),\n   \
    \     std=(0.229, 0.224, 0.225),\n    )\n #The models can accept larger images\
    \ provided the image shapes are multiples of the patch size (16) e.g., 256*256\
    \ 384*384 512*512, defult to use 256*256 for classifcation task(If the dataset\
    \ is not too large, you can try other resolutions too).\n```\n\nModel2: Siglip2\n\
