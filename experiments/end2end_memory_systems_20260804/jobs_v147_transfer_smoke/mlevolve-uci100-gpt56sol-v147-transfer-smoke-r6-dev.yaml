{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "annotations": {
      "mlevolve.ai/purpose": "same-type-cross-task-transfer-eight-step-smoke",
      "mlevolve.ai/runtime-source-lock-sha256": "f052ddd1958242702173a14e78147df77a5146d29b61a62c5523d4eb080e0354",
      "mlevolve.ai/source-task": "leaf-classification",
      "mlevolve.ai/target-task": "uci-one-hundred-leaves"
    },
    "labels": {
      "app": "mlevolve-end2end-dev",
      "app.kubernetes.io/managed-by": "codex-nrp-training",
      "ecepxie.nrp/owner": "haoming",
      "experiment": "experiment-end2end-uci100-transfer-v147-smoke-r6",
      "mlevolve.ai/release-mode": "smoke",
      "mlevolve.ai/system": "dynamic_cross_task_transfer"
    },
    "name": "mlevolve-uci100-gpt56sol-v147-transfer-smoke-r6-dev",
    "namespace": "ecepxie"
  },
  "spec": {
    "containers": [
      {
        "args": [
          "exec sleep infinity"
        ],
        "command": [
          "/bin/bash",
          "-lc"
        ],
        "env": [
          {
            "name": "PYTHONUNBUFFERED",
            "value": "1"
          },
          {
            "name": "PYTHONDONTWRITEBYTECODE",
            "value": "1"
          },
          {
            "name": "PYTHONPATH",
            "value": "/workspace/nautilus-exp-end2end-agent-v147-transfer-smoke-r6/mlevolve:/workspace/nautilus-exp-end2end-agent-v147-transfer-smoke-r6"
          }
        ],
        "envFrom": [
          {
            "secretRef": {
              "name": "mlevolve-openai-gpt56sol-v1"
            }
          }
        ],
        "image": "docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc",
        "imagePullPolicy": "IfNotPresent",
        "name": "dev",
        "resources": {
          "limits": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/a100": "1"
          },
          "requests": {
            "cpu": "16",
            "ephemeral-storage": "64Gi",
            "memory": "32Gi",
            "nvidia.com/a100": "1"
          }
        },
        "volumeMounts": [
          {
            "mountPath": "/workspace",
            "name": "workspace"
          },
          {
            "mountPath": "/dev/shm",
            "name": "shm"
          }
        ]
      }
    ],
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 180,
    "tolerations": [
      {
        "key": "nvidia.com/gpu",
        "operator": "Exists"
      }
    ],
    "volumes": [
      {
        "name": "workspace",
        "persistentVolumeClaim": {
          "claimName": "haoming-storage"
        }
      },
      {
        "emptyDir": {
          "medium": "Memory",
          "sizeLimit": "16Gi"
        },
        "name": "shm"
      }
    ]
  }
}
