apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-routerfix-dev-v30
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-agent-v30
    mlevolve.ai/workload: mlevolve-e2e-routerfix-dev-v30
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
  - name: dev
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc", "sleep infinity"]
    envFrom:
    - secretRef:
        name: prevalence-audit-deepseek-r1
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
        ephemeral-storage: 16Gi
      limits:
        cpu: "4"
        memory: 16Gi
        ephemeral-storage: 16Gi
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: haoming-storage
