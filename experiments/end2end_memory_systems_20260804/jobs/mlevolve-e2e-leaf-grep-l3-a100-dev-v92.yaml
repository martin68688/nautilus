    mlevolve.ai/source-lock-sha256: 32eb05a474ea292dca5a2da18854088dea6a79ab09bfdcc4b1865f597b10f635
    mlevolve.ai/smoke-manifest-sha256: f8b31a7ff6efe7e1ef3087434875255e5f0420d5d4b3c432af59367bc50b0494
