apiVersion: v1
kind: Pod
metadata:
  name: nautilus-runforest-sync
  namespace: ecepxie
  labels:
    app: nautilus-runforest-sync
spec:
  restartPolicy: Never
  containers:
  - name: sync
    image: haomingwang22/mlevolve:v1
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc"]
    args:
    - |
      set -euo pipefail
      mkdir -p /workspace
      echo "sync pod ready"
      sleep infinity
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: haoming-storage
