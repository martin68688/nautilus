apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-uci100-v155-no-resolver-3h-a40-r1-dev
  namespace: ecepxie
  labels:
    app: mlevolve-end2end-dev
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-uci100-v155-no-resolver-3h-a40-r1
    mlevolve.ai/release-mode: three-hour-rerun
    mlevolve.ai/system: dynamic-cross-task-transfer-no-resolver
spec:
  activeDeadlineSeconds: 21600
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A40
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
      effect: PreferNoSchedule
  containers:
    - name: mlevolve
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - exec sleep infinity
      envFrom:
        - secretRef:
            name: cliproxyapi-haoming-client
      env:
        - name: OPENAI_MODEL
          value: gpt-5.6-sol
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONPATH
          value: /workspace/nautilus-exp-end2end-agent-v155-dynamic-no-resolver-3h/mlevolve:/workspace/nautilus-exp-end2end-agent-v155-dynamic-no-resolver-3h
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 64Gi
          nvidia.com/a40: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 64Gi
          nvidia.com/a40: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
