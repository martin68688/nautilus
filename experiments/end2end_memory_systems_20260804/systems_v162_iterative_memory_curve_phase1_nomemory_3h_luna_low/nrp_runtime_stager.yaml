apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-v162-memory-curve-runtime-stager
  namespace: ecepxie
  labels:
    app: mlevolve-runtime-stager
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: v162-memory-curve-runtime-stager
spec:
  activeDeadlineSeconds: 3600
  restartPolicy: Never
  containers:
    - name: stager
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: [/bin/bash, -lc]
      args: ["exec sleep infinity"]
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
