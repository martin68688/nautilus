extends: config.yaml

methodology_kb_path: ""
methodology_dynamic: False

agent:
  initial_drafts: 3
  search:
    num_drafts: 3
  draft_role_policy:
    enabled: True
    roles:
      - coldstart_baseline
      - memory_reproduction
      - novel_exploration
    replay_targets_path: "../paper-skills/eval_skill_memory/clean_replay_targets.json"
  protocol_repair:
    enabled: True
    per_stage_attempt_limit: 2
    stage_generation_attempt_limit: 2
    stage_attempt_limits:
      data_scope: 3
      validation_provenance: 3
      cross_fit: 7
      selection_freeze: 6
      final_holdout: 10
    stage_generation_attempt_limits:
      data_scope: 3
      validation_provenance: 3
      cross_fit: 7
      selection_freeze: 6
      final_holdout: 10
    final_runtime_attempt_limit: 6
    stage_generation_timeout_seconds: 300
    stage_generation_backend_retries: 2
    require_runtime_provenance: True

adoption_tracking:
  enable: True
  enable_analysis: True
  judge_mode: llm-all

external_skill_memory:
  enable: True
  graph_path: "../paper-skills/hyper_memory/run_forest_graph.json"
  index_path: "../paper-skills/hyper_memory/run_forest_index.npz"
  text_model_path: ""
  source_name: "run_forest_stage_hybrid_memory"
  mode: "run_forest_stage_hybrid"
  # Flat-Twin keeps the same RunForest coordinates and Tree/SOP routing while
  # removing Poincare distance. Keep poincare available as an explicit ablation.
  scoring_mode: "flat_twin"
  enable_agentic: True
  navigator_max_steps: 3
  navigator_reference_budget: 1200
  top_k: 6
  max_chars: 6500
  include_draft: True
  include_improve: True
  include_evolution: True
  include_debug: True
  include_fusion: True
  retrieval_control: "layered_strategy"
  strategy_candidate_limit: 12
  strategy_route_count: 3
  l2_tactic_limit: 4
  visibility_token_budget: 4096
  stage_quotas:
    draft: {sop_candidates: 6, sop_gateways: 3, tree_candidates: 2}
    improve: {sop_candidates: 4, sop_gateways: 2, tree_candidates: 6}
    debug: {sop_candidates: 2, sop_gateways: 1, tree_candidates: 8}
    evolution: {sop_candidates: 6, sop_gateways: 3, tree_candidates: 3}
    fusion: {sop_candidates: 4, sop_gateways: 2, tree_candidates: 4}
  rrf_weights:
    draft: {sop: 0.70, tree: 0.30}
    improve: {sop: 0.40, tree: 0.60}
    debug: {sop: 0.25, tree: 0.75}
    evolution: {sop: 0.70, tree: 0.30}
    fusion: {sop: 0.50, tree: 0.50}

run_identity:
  experiment_group: "stage_hybrid_v2_all_clean_history"
  baseline_reference_group: "baseline_no_external_memory"
  memory_enabled: True
  memory_system: "run_forest_stage_hybrid"
  memory_version: "stage_hybrid_v2"
  identity_source: "declared_at_runtime"
