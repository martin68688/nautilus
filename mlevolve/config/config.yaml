# ============================================================
#  Data & paths
# ============================================================
data_dir: "./data"
dataset_dir: "./data"  # path to mle-bench dataset root
desc_file: "data/spooky-author-identification/prepared/public/description.md"
goal: null
eval: null
exp_name: null
exp_id: "spooky-author-identification"

log_dir: ./runs
log_level: INFO
workspace_dir: ./runs
preprocess_data: True
copy_data: False

# Resource
start_cpu_id: 0
cpu_number: 16

# Model paths
torch_hub_dir: ""       # path to torch hub cache, e.g. /data/pretrain_models/torch_models
pretrain_model_dir: ""  # path to pretrained model weights, e.g. /data/pretrain_models
methodology_kb_path: "../paper-skills/experience_kb"  # path to methodology knowledge base
# methodology_kb_path: ""
methodology_dynamic: True   # True=LLM dynamic search, False=static methodology_map.json

# ============================================================
#  Code execution
# ============================================================
exec:
  timeout: 21600
  agent_file_name: runfile.py

# ============================================================
#  Agent config
# ============================================================
agent:

  # --- Basic run params ---
  steps: 80
  time_limit: 21600          # 6h
  initial_drafts: 3
  seed: 42
  data_preview: True

  # --- LLM models ---
  code:
    model: "${oc.env:DEEPSEEK_MODEL, deepseek-chat}"
    temp: 1
    base_url: "${oc.env:DEEPSEEK_BASE_URL, https://api.deepseek.com}"
    api_key: "${oc.env:DEEPSEEK_API_KEY}"
  feedback:
    model: "${oc.env:DEEPSEEK_MODEL, deepseek-chat}"
    temp: 1
    base_url: "${oc.env:DEEPSEEK_BASE_URL, https://api.deepseek.com}"
    api_key: "${oc.env:DEEPSEEK_API_KEY}"

  # --- Submission check ---
  check_data_leakage: True

  # --- Code gen mode ---
  use_diff_mode: True                # SEARCH/REPLACE patch

  # --- Branch strategy ---
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2

  # --- Global memory ---
  use_global_memory: True
  memory_similarity_threshold: 0.7
  memory_embedding_device: cuda
  memory_embedding_model_path: "BAAI/bge-base-en-v1.5"  # HuggingFace model name or local path

  # --------------------------------------------------------
  #  Search tree params
  # --------------------------------------------------------
  search:
    # Parallel & resources
    parallel_search_num: 6
    num_gpus: 3
  

  

    # Node expansion limits
    num_drafts: 5
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10

    # Debug depth
    max_debug_depth: 20
    back_debug_depth: 3
    debug_prob: 1

    # Improvement criteria
    metric_improvement_threshold: 0.0001
    max_improve_failure: 3

    # Stagnation detection
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20

    # Explore-exploit soft switch
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2

    # Top-K node selection
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2

    # Force backprop
    force_backprop_late_threshold: 0.80
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4

    # Multi-branch fusion conditions
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2

  # --------------------------------------------------------
  #  Exploration constant decay
  # --------------------------------------------------------
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios: [0.3, 0.7]

# ============================================================
#  Cold-start knowledge
# ============================================================
coldstart:
  use_coldstart: True
  task_json_path: "engine/coldstart/competition_tag_classified.json"
  model_json_path: "engine/coldstart/models_guidance_classified.json"
  description: ""

# ============================================================
#  Adoption tracking
# ============================================================
adoption_tracking:
  enable: False
  enable_analysis: True
  judge_mode: keyword    # keyword | llm | llm-all | hybrid

# ============================================================
#  External persistent skill memory
# ============================================================
external_skill_memory:
  enable: False
  graph_path: "../paper-skills/distillation/graph_build/graph_optimized_skillgraph.json"
  index_path: ""
  text_model_path: ""
  source_name: "skillgraph"   # e.g. skillgraph | hyperbolic_agentic_memory | flat_twin_agentic_memory | euclidean_agentic_memory
  mode: "skillgraph"          # skillgraph | agentic_hyperbolic | flat_twin_agentic | agentic_euclidean
  scoring_mode: "lexical"     # lexical | poincare | flat_twin | euclidean
  geometry_distance_weight: 0.30
  geometry_semantic_weight: 0.20
  geometry_constraint_weight: 0.05
  geometry_condition_weight: 0.18
  geometry_failure_weight: 0.14
  geometry_evidence_weight: 0.08
  geometry_reliability_weight: 0.08
  geometry_conflict_weight: 0.10
  geometry_distance_norm: "none"  # none | minmax | zscore
  geometry_query_radius_quantile: 0.5
  geometry_query_radius_mode: "predicted_distribution"  # quantile | predicted_distribution
  geometry_query_radius_bands: ["core", "middle", "edge"]
  geometry_query_radius_top_bands: 2
  geometry_radius_fusion: "weighted_max"  # weighted_max | weighted_mean
  enable_agentic: False
  navigator_max_steps: 3
  navigator_reference_budget: 1200
  top_k: 8
  depth: 2
  beam_width: 3
  general_cap: 2
  task_seed_limit: 6
  max_chars: 5000
  include_draft: True
  include_improve: True
  include_evolution: True
  include_debug: True
  include_fusion: True
