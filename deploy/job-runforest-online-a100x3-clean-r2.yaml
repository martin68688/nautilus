apiVersion: batch/v1
kind: Job
metadata:
  name: runforest-online-a100x3-clean-r2
  namespace: ecepxie
  labels:
    app: runforest-online-memory
    memory-system: run-forest-clean
    gpu-profile: a100x3
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: runforest-online-memory
        memory-system: run-forest-clean
        gpu-profile: a100x3
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-80GB-PCIe
      containers:
      - name: runforest-online-clean
        image: haomingwang22/mlevolve:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          export OPENAI_COMPAT_TIMEOUT="${OPENAI_COMPAT_TIMEOUT:-1200}"

          BRANCH="${RUNFOREST_BRANCH:-codex/hyperbolic-structural-memory}"
          RUN_TAG="${RUNFOREST_ONLINE_TAG:-runforest_online_a100x3_clean_r2_$(date +%Y%m%d_%H%M%S)}"
          SRC_BASE="/workspace/nautilus"
          WORKDIR="/workspace/nautilus_runforest_online_${RUN_TAG}"
          RUNS_DIR="/workspace/nautilus/mlevolve/runs"
          MATRIX_LOG_DIR="${RUNS_DIR}/${RUN_TAG}_job_logs"
          mkdir -p "${MATRIX_LOG_DIR}"
          exec > >(tee -a "${MATRIX_LOG_DIR}/job.log") 2>&1

          checkout_from_seed_archive() {
            local seed commit
            for seed in "${SRC_BASE}" /workspace/nautilus_runforest_online_runforest_online_a100x3_r3_*; do
              if [ ! -d "${seed}/.git" ]; then
                continue
              fi
              echo "checkout_mode=seed_archive seed=${seed}"
              git -C "${seed}" fetch --depth=1 origin "${BRANCH}"
              commit="$(git -C "${seed}" rev-parse FETCH_HEAD)"
              rm -rf "${WORKDIR}"
              mkdir -p "${WORKDIR}"
              git -C "${seed}" archive --format=tar "${commit}" | tar -x -C "${WORKDIR}"
              printf '%s\n' "${commit}" > "${WORKDIR}/.source_commit"
              return 0
            done
            return 1
          }

          checkout_from_remote() {
            local attempt
            for attempt in 1 2 3; do
              echo "clone_attempt=${attempt} mode=remote_shallow"
              rm -rf "${WORKDIR}"
              if git -c http.version=HTTP/1.1 \
                clone --depth=1 --single-branch --branch "${BRANCH}" "${REMOTE}" "${WORKDIR}"; then
                return 0
              fi
              echo "remote shallow clone failed on attempt ${attempt}"
            done
            return 1
          }

          echo "=== Run-Forest clean-source online memory job ==="
          echo "date=$(date)"
          echo "branch=${BRANCH}"
          echo "run_tag=${RUN_TAG}"
          echo "workdir=${WORKDIR}"
          echo "runs_dir=${RUNS_DIR}"
          echo "resources=3x A100, 6 CPU, 64Gi"

          test -d "${SRC_BASE}/.git" || { echo "ERROR: missing source repo at ${SRC_BASE}"; exit 2; }
          REMOTE="$(git -C "${SRC_BASE}" remote get-url origin)"
          checkout_from_seed_archive || checkout_from_remote
          cd "${WORKDIR}"
          if [ -d "${WORKDIR}/.git" ]; then
            git config --global --add safe.directory "${WORKDIR}" || true
            echo "checked_out_commit=$(git rev-parse HEAD)"
          else
            echo "checked_out_commit=$(cat "${WORKDIR}/.source_commit")"
          fi
          ln -sf "${SRC_BASE}/mlevolve/.env" "${WORKDIR}/mlevolve/.env"

          cd "${WORKDIR}/mlevolve"
          set -a
          . ./.env
          set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL
          export RUNFOREST_ONLINE_TAG="${RUN_TAG}"
          export RUNFOREST_NUM_GPUS=3
          export RUNFOREST_CPU_NUMBER=6
          export RUNFOREST_RUNS_DIR="${RUNS_DIR}"

          echo "=== Preflight compile ==="
          python -m py_compile \
            ../paper-skills/hyper_memory/build_run_forest_memory.py \
            ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            agents/memory/external_skill_memory.py \
            engine/coldstart/knowledge.py \
            engine/agent_search.py \
            agents/draft_agent.py

          echo "=== Build clean Run-Forest graph from allowlist ==="
          python ../paper-skills/hyper_memory/build_run_forest_memory.py \
            --runs-dir "${RUNS_DIR}" \
            --sop-graph "${WORKDIR}/paper-skills/hyper_memory/hyper_graph.json" \
            --out-dir "${WORKDIR}/paper-skills/hyper_memory" \
            --allowlist "${WORKDIR}/paper-skills/eval_skill_memory/clean_run_allowlist.json" \
            --require-clean-provenance

          echo "=== Clean graph preflight check ==="
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd().parents[0]
          graph = json.loads((root / "paper-skills/hyper_memory/run_forest_graph.json").read_text())
          allowlist = json.loads((root / "paper-skills/eval_skill_memory/clean_run_allowlist.json").read_text())
          allowed = {entry["run_id"] for entry in allowlist["entries"] if entry.get("allowed")}
          source_runs = set(graph["meta"].get("source_runs", []))
          assert graph["meta"].get("leak_verified") is True
          assert graph["meta"].get("paper_grade") is True
          assert graph["meta"].get("provenance_status") == "clean_certified"
          assert source_runs == allowed, (sorted(source_runs ^ allowed))
          assert not any(run.startswith("20260512") for run in source_runs)
          print("clean_graph_ok", len(source_runs), "runs", len(graph.get("nodes", [])), "nodes")
          PY

          echo "=== Evaluate and test clean Run-Forest artifacts ==="
          python ../paper-skills/hyper_memory/evaluate_run_forest_memory.py \
            --graph "${WORKDIR}/paper-skills/hyper_memory/run_forest_graph.json" \
            --index "${WORKDIR}/paper-skills/hyper_memory/run_forest_index.npz" \
            --output "${WORKDIR}/paper-skills/eval_skill_memory/reports/run_forest_memory_evaluation.json" \
            --report "${WORKDIR}/coordination/run_forest_memory_experiment_report.md"
          pytest -q ../tests/test_run_forest_memory.py

          echo "=== Running multi-task clean memory matrix ==="
          python ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            --tag "${RUN_TAG}" \
            --num-gpus 3 \
            --cpu-number 6 \
            --runs-dir "${RUNS_DIR}"

          echo "=== Summarizing matrix ==="
          python ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            --runs-dir "${RUNS_DIR}" \
            --manifest "${RUNS_DIR}/${RUN_TAG}_matrix/runforest_online_manifest.jsonl"
          echo "=== Job complete ==="
        env:
        - name: RUNFOREST_BRANCH
          value: "codex/hyperbolic-structural-memory"
        resources:
          requests:
            cpu: "6"
            memory: "64Gi"
            nvidia.com/a100: "3"
          limits:
            cpu: "6"
            memory: "64Gi"
            nvidia.com/a100: "3"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: haoming-storage
