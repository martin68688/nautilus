# DevPod scheduling/runtime probes without PVC.
# Each pod requests 1 GPU, 4 CPU, 8Gi memory and sleeps indefinitely.
apiVersion: v1
kind: Pod
metadata:
  name: devnopvc-rtx3090x1
  namespace: ecepxie
  labels:
    app: mlevolve-devnopvc-probe
    gpu-probe: rtx3090
spec:
  restartPolicy: Always
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-GeForce-RTX-3090
  containers:
  - name: dev
    image: haomingwang22/mlevolve:v1
    command: ["/bin/bash", "-c"]
    args: ["sleep infinity"]
    resources:
      limits:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: "8Gi"
      requests:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: "8Gi"
---
