    \ backbone for various vision tasks like classification, segmentation and detection.etc.\
    \ support rgb images.\nCode template (MUST copy exactly — do NOT change model\
    \ variant names or file paths):\n```python\nmodel = torch.hub.load(\"{TORCH_HUB_DIR}/dinov3-main/\"\
    , 'dinov3_vitl16', source='local', weights=\"{TORCH_HUB_DIR}/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth\"\
    )\noutput = model.forward_features(input)\nfeatures = output[\"x_norm_patchtokens\"\
    ] #[b,l,1024]\nclstoken = output[\"x_norm_clstoken\"][b,1024]\n #for normalize\
    \ normalize = transforms.Normalize(\n        mean=(0.485, 0.456, 0.406),\n   \
    \     std=(0.229, 0.224, 0.225),\n    )\n #The models can accept larger images\
    \ provided the image shapes are multiples of the patch size (16) e.g., 256*256\
    \ 384*384 512*512, defult to use 256*256 for classifcation task(If the dataset\
    \ is not too large, you can try other resolutions too).\n```\n\nModel2: Siglip2\n\
    Description:Siglip2 is an extended family of vision as well as multimodel foundation\
    \ model, has superior image classification, image-text retrieval, and downstream\
    \ vison transfer performance across all model scales.\nCode template (MUST copy\
    \ exactly — do NOT change model variant names or file paths):\n```python\nfrom\
    \ transformers import AutoProcessor, AutoModel\nmodel = AutoModel.from_pretrained(\"\
    google/siglip2-so400m-patch16-256\")\npooled_feat = model.get_image_features(pixel_values=inputs)\
    \ # [b,1152]\n \n #for normalize normalize = transforms.Normalize(\n        mean=(0.5,\
    \ 0.5, 0.5),\n        std=(0.5, 0.5, 0.5),\n    )\n #\n```"
