coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: microsoft/deberta-v3-large\n\nDescription:DeBERTa-v3-large\
    \ (435M params) with partial unfreezing (last 8 of 24 layers) + simple Linear\
    \ head + CosineAnnealingWarmRestarts scheduler + label_smoothing=0.1. Proven best\
    \ strategy: Log Loss 0.0725 on Spooky Author Identification (~19K samples). CRITICAL\
    \ RULES: (1) Partial unfreeze last 6-8 layers, NOT full finetuning (full finetuning\
    \ hits ceiling at ~0.26). (2) Use simple Linear head, NOT complex attention/MLP\
    \ heads (complex heads cause gradient noise and overfitting). (3) Use CosineAnnealingWarmRestarts\
    \ + 10% Linear Warmup, NOT no scheduler or simple linear decay. (4) Differentiated\
    \ LR: backbone 2e-5, head 5e-5. (5) Label smoothing 0.1 for small datasets. (6)\
    \ Do NOT use ModernBERT (0.34-0.35), DeBERTa-small/base (0.37), or full freezing\
    \ (0.38). (7) For features: use small feature_proj (150->64), NOT large projection\
    \ layers. (8) For ensemble: use heterogeneous (DeBERTa+XGBoost+LightGBM), NOT\
    \ homogeneous (multiple Transformers). (9) Gradient clipping max_norm=1.0 + AMP\
    \ mixed precision. (10) Probability clip(1e-15,1-1e-15) then row-normalize before\
    \ scoring.\n\nCode template (MUST copy exactly — do NOT change model variant names\
    \ or file paths):\n```python\nfrom transformers import AutoTokenizer, AutoModelForSequenceClassification,\
    \ AdamW\nfrom torch import nn\nfrom torch.cuda.amp import autocast, GradScaler\n\
    from torch.optim.lr_scheduler import CosineAnnealingWarmRestarts\nfrom sklearn.model_selection\
    \ import StratifiedKFold\nfrom sklearn.metrics import log_loss\nimport torch\n\
    import numpy as np\n\nclass SpookyClassifier(nn.Module):\n    def __init__(self,\
    \ num_authors=3, num_features=150, dropout_rate=0.3):\n        super().__init__()\n\
    \        self.backbone = AutoModelForSequenceClassification.from_pretrained(\n\
    \            'microsoft/deberta-v3-large', num_labels=num_authors,\n         \
    \   output_hidden_states=True, hidden_dropout_prob=dropout_rate,\n           \
    \ attention_probs_dropout_prob=dropout_rate,\n        )\n        # CRITICAL: Partial\
    \ unfreezing - freeze first 16 layers, unfreeze last 8\n        for param in self.backbone.deberta.parameters():\n\
    \            param.requires_grad = False\n        for layer in self.backbone.deberta.encoder.layer[-8:]:\n\
    \            for param in layer.parameters():\n                param.requires_grad\
    \ = True\n        hidden_size = self.backbone.config.hidden_size  # 1024\n   \
    \     # Optional: stylometric feature projection (keep small to avoid overfitting)\n\
    \        if num_features > 0:\n            self.feature_proj = nn.Sequential(\n\
    \                nn.Linear(num_features, 64), nn.LayerNorm(64), nn.GELU(), nn.Dropout(dropout_rate),\n\
    \            )\n            self.head = nn.Linear(hidden_size + 64, num_authors)\n\
    \        else:\n            self.feature_proj = None\n            self.head =\
    \ nn.Linear(hidden_size, num_authors)\n    def forward(self, input_ids, attention_mask,\
    \ features=None):\n        outputs = self.backbone.deberta(input_ids=input_ids,\
    \ attention_mask=attention_mask)\n        cls_pool = outputs.last_hidden_state[:,\
    \ 0, :]\n        if self.feature_proj is not None and features is not None:\n\
    \            feat_embed = self.feature_proj(features)\n            combined =\
    \ torch.cat([cls_pool, feat_embed], dim=1)\n        else:\n            combined\
    \ = cls_pool\n        logits = self.head(combined)\n        return logits\n\n\
    device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel =\
    \ SpookyClassifier(num_authors=3, num_features=150, dropout_rate=0.3)\nmodel.to(device)\n\
    \n# CRITICAL: Differentiated learning rates - backbone smaller, head larger\n\
    backbone_params = [p for layer in model.backbone.deberta.encoder.layer[-8:] for\
    \ n, p in layer.named_parameters() if 'bias' not in n and 'LayerNorm' not in n]\n\
    head_params = list(model.head.parameters()) + (list(model.feature_proj.parameters())\
    \ if model.feature_proj else [])\noptimizer = AdamW([\n    {'params': backbone_params,\
    \ 'lr': 2e-5, 'weight_decay': 0.01, 'betas': (0.9, 0.999)},\n    {'params': head_params,\
    \ 'lr': 5e-5, 'weight_decay': 0.01, 'betas': (0.9, 0.98)},\n])\n\n# CRITICAL:\
    \ CosineAnnealingWarmRestarts + Linear Warmup scheduler\nnum_epochs = 30\npatience\
    \ = 5\ntotal_steps = len(train_loader) * num_epochs\nwarmup_steps = int(0.1 *\
    \ total_steps)\nscheduler = CosineAnnealingWarmRestarts(optimizer, T_0=total_steps\
    \ // 2, T_mult=1, eta_min=1e-6)\ninitial_lrs = [pg['lr'] for pg in optimizer.param_groups]\n\
    \n# CRITICAL: Label smoothing for small datasets\ncriterion = nn.CrossEntropyLoss(label_smoothing=0.1)\n\
    scaler = GradScaler()\n\nfor epoch in range(num_epochs):\n    model.train()\n\
    \    for batch_idx, batch in enumerate(train_loader):\n        input_ids = batch['input_ids'].to(device)\n\
    \        attention_mask = batch['attention_mask'].to(device)\n        labels =\
    \ batch['labels'].to(device)\n        features = batch.get('features', None)\n\
    \        if features is not None:\n            features = features.to(device)\n\
    \        optimizer.zero_grad()\n        with autocast():\n            logits =\
    \ model(input_ids, attention_mask, features)\n            loss = criterion(logits,\
    \ labels)\n        scaler.scale(loss).backward()\n        scaler.unscale_(optimizer)\n\
    \        torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\n  \
    \      scaler.step(optimizer)\n        scaler.update()\n        # Warmup + Cosine\
    \ scheduling\n        current_step = epoch * len(train_loader) + batch_idx\n \
    \       if current_step < warmup_steps:\n            for pg in optimizer.param_groups:\n\
    \                pg['lr'] = initial_lrs[0] * (current_step / max(1, warmup_steps))\n\
    \        else:\n            scheduler.step(epoch + current_step / len(train_loader))\n\
    \n    # Validation with probability clipping + normalization\n    model.eval()\n\
    \    val_probs = []\n    with torch.no_grad():\n        for batch in val_loader:\n\
    \            input_ids = batch['input_ids'].to(device)\n            attention_mask\
    \ = batch['attention_mask'].to(device)\n            features = batch.get('features',\
    \ None)\n            if features is not None:\n                features = features.to(device)\n\
    \            with autocast():\n                logits = model(input_ids, attention_mask,\
    \ features)\n                probs = torch.softmax(logits, dim=1)\n          \
    \  val_probs.append(probs.cpu().numpy())\n    val_probs = np.concatenate(val_probs)\n\
    \    val_probs = np.clip(val_probs, 1e-15, 1 - 1e-15)\n    val_probs = val_probs\
    \ / val_probs.sum(axis=1, keepdims=True)\n\n# 5-fold StratifiedKFold for variance\
    \ reduction (Priority 2)\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n\
    all_test_probs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(X,\
    \ y)):\n    # train model on this fold, save best checkpoint\n    all_test_probs.append(fold_test_probs)\n\
    final_test_probs = np.mean(all_test_probs, axis=0)  # arithmetic average\n\n#\
    \ Heterogeneous ensemble (Priority 3): DeBERTa + XGBoost + LightGBM\n# Grid search\
    \ for optimal weights (step=0.05)\nfor w1 in np.arange(0.1, 0.9, 0.05):\n    for\
    \ w2 in np.arange(0.1, 0.9, 0.05):\n        w3 = 1.0 - w1 - w2\n        if w3\
    \ < 0.05: continue\n        ensemble = w1 * deberta_probs + w2 * xgb_probs + w3\
    \ * lgb_probs\n        score = log_loss(val_labels, ensemble)\n```"
