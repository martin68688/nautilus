apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-layered-recipe-stager-v3
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-recipe-layered-v3
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  terminationGracePeriodSeconds: 30
  containers:
  - name: stager
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 1800
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 4Gi
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: haoming-storage
