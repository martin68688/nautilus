apiVersion: batch/v1
kind: Job
metadata:
  name: runforest-online-a6000x4
  namespace: ecepxie
  labels:
    app: runforest-online-memory
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: runforest-online-memory
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-RTX-A6000"]
      containers:
      - name: runforest-online
        image: haomingwang22/mlevolve:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          export OPENAI_COMPAT_TIMEOUT="${OPENAI_COMPAT_TIMEOUT:-1200}"

          BRANCH="${RUNFOREST_BRANCH:-codex/hyperbolic-structural-memory}"
          RUN_TAG="${RUNFOREST_ONLINE_TAG:-runforest_online_$(date +%Y%m%d_%H%M%S)}"
          SRC_BASE="/workspace/nautilus"
          WORKDIR="/workspace/nautilus_runforest_online_${RUN_TAG}"
          RUNS_DIR="/workspace/nautilus/mlevolve/runs"
          MATRIX_LOG_DIR="${RUNS_DIR}/${RUN_TAG}_job_logs"
          mkdir -p "${MATRIX_LOG_DIR}"
          exec > >(tee -a "${MATRIX_LOG_DIR}/job.log") 2>&1

          echo "=== Run-Forest online memory job ==="
          echo "date=$(date)"
          echo "branch=${BRANCH}"
          echo "run_tag=${RUN_TAG}"
          echo "workdir=${WORKDIR}"
          echo "runs_dir=${RUNS_DIR}"
          echo "resources=4x RTX A6000, 12 CPU, 64Gi"

          test -d "${SRC_BASE}/.git" || { echo "ERROR: missing source repo at ${SRC_BASE}"; exit 2; }
          REMOTE="$(git -C "${SRC_BASE}" remote get-url origin)"
          rm -rf "${WORKDIR}"
          git clone --depth=1 --branch "${BRANCH}" "${REMOTE}" "${WORKDIR}"
          cd "${WORKDIR}"
          echo "checked_out_commit=$(git rev-parse HEAD)"
          ln -sf "${SRC_BASE}/mlevolve/.env" "${WORKDIR}/mlevolve/.env"

          cd "${WORKDIR}/mlevolve"
          set -a
          . ./.env
          set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL
          export RUNFOREST_ONLINE_TAG="${RUN_TAG}"
          export RUNFOREST_NUM_GPUS=4
          export RUNFOREST_CPU_NUMBER=12
          export RUNFOREST_RUNS_DIR="${RUNS_DIR}"

          echo "=== Preflight ==="
          python -m py_compile \
            agents/memory/external_skill_memory.py \
            engine/coldstart/knowledge.py \
            engine/agent_search.py \
            agents/draft_agent.py
          pytest -q tests/test_run_forest_memory.py

          echo "=== Running multi-task memory matrix ==="
          python ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            --tag "${RUN_TAG}" \
            --num-gpus 4 \
            --cpu-number 12 \
            --runs-dir "${RUNS_DIR}"

          echo "=== Summarizing matrix ==="
          python ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            --runs-dir "${RUNS_DIR}" \
            --manifest "${RUNS_DIR}/${RUN_TAG}_matrix/runforest_online_manifest.jsonl"
          echo "=== Job complete ==="
        env:
        - name: RUNFOREST_BRANCH
          value: "codex/hyperbolic-structural-memory"
        resources:
          requests:
            cpu: "12"
            memory: "64Gi"
            nvidia.com/rtxa6000: "4"
          limits:
            cpu: "12"
            memory: "64Gi"
            nvidia.com/rtxa6000: "4"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: haoming-storage
