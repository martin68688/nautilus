apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-leaf-replay-gpt56sol-a100-dev-v132
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v132
    mlevolve.ai/workload: leaf-replay-gpt56sol-v132
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: leaf-replay-research-official-gpt56sol-16-step-online-smoke
    mlevolve.ai/source-git-head: 48f307eec466b3f4ca4b9812d2b343f3eb79c212
    mlevolve.ai/runtime-source-lock-sha256: d12d2c7695bc743f8c32ff0f0238573ff8f827a5d51c4775c0dccdc6dbc9df67
    mlevolve.ai/base-runtime-transport-sha256: a062cb1c914b4e8ad6eb33dff5f5da711200d7bc49265e827a855437a7f8fa00
    mlevolve.ai/replay-targets-sha256: 69019b0b3c62d8fa890a74614635c46373dd80a112543a358746eb4da822b3d4
    mlevolve.ai/transition-capsule-sha256: ae8a06a6a4ef896e09516ad2d953462a601c1ea5871bf9707fdd20ff7dea8559
    mlevolve.ai/credential-secret: mlevolve-openai-gpt56sol-v1
spec:
  activeDeadlineSeconds: 21600
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - node-1-3.sdsc.optiputer.net
                  - node-2-3.sdsc.optiputer.net
  initContainers:
    - name: assemble-v122-base-runtime
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - |
          set -euo pipefail
          archive=/tmp/leaf-v122-runtime-transport.tar.gz
          find /transport -type f -name 'chunk-*' -print0 | sort -z | xargs -0 cat > "${archive}"
          echo 'a062cb1c914b4e8ad6eb33dff5f5da711200d7bc49265e827a855437a7f8fa00  /tmp/leaf-v122-runtime-transport.tar.gz' | sha256sum -c -
          tar -xzf "${archive}" -C /runtime
          echo '69019b0b3c62d8fa890a74614635c46373dd80a112543a358746eb4da822b3d4  /runtime/experiments/end2end_memory_systems_20260804/manifests_v122/leaf_official_replay_targets.json' | sha256sum -c -
          echo 'ae8a06a6a4ef896e09516ad2d953462a601c1ea5871bf9707fdd20ff7dea8559  /runtime/experiments/end2end_memory_systems_20260804/transition_evidence_v122/transition_evidence_capsules.json' | sha256sum -c -
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: runtime
          mountPath: /runtime
        - name: transport-chunks
          mountPath: /transport
          readOnly: true
  containers:
    - name: leaf-replay-gpt56sol
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      envFrom:
        - secretRef:
            name: mlevolve-openai-gpt56sol-v1
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: runtime
          mountPath: /tmp/nautilus-exp-end2end-agent-v132-runtime
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: runtime
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: transport-chunks
