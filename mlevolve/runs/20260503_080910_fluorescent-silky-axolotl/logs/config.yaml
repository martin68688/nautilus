coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: CRITICAL_LOG_TRANSFORMATION\n\nDescription:CRITICAL: All\
    \ targets EXCEPT LogD must be log10-transformed before training. MA-RAE MUST be\
    \ calculated in ORIGINAL space by inverse-transforming BOTH predictions AND targets\
    \ (10**x) before calling compute_ma_rae(). If you calculate MA-RAE in log space,\
    \ it will be ~0.005 (WRONG, 100x too small). Correct MA-RAE in original space\
    \ should be ~0.5-0.6.\n\nCode template (MUST copy exactly — do NOT change model\
    \ variant names or file paths):\n```python\n# CRITICAL: Log transformation for\
    \ ADMET targets\nimport numpy as np\ntarget_cols = ['LogD', 'KSOL', 'HLM CLint',\
    \ 'MLM CLint', 'Caco-2 Permeability Papp A>B', 'Caco-2 Permeability Efflux', 'MPPB',\
    \ 'MBPB', 'MGMB']\nlog_transform_cols = [col for col in target_cols if col !=\
    \ 'LogD']\ntrain_targets_original = train_targets.copy()\n# Forward: log10 transform\n\
    for col in log_transform_cols:\n    mask = ~train_targets[col].isna()\n    if\
    \ mask.sum() > 0:\n        train_targets.loc[mask, col] = np.log10(train_targets.loc[mask,\
    \ col])\n# CRITICAL: Validation MA-RAE must be calculated in ORIGINAL space\n\
    # Inverse transform BOTH predictions and targets before computing MA-RAE\nval_preds_orig\
    \ = val_predictions.copy()\nval_targets_orig = val_targets.copy()\nfor i_col,\
    \ col in enumerate(target_cols):\n    if col != 'LogD':\n        val_preds_orig[:,\
    \ i_col] = 10 ** val_predictions[:, i_col]\n        val_targets_orig[:, i_col]\
    \ = 10 ** val_targets[:, i_col]\nval_ma_rae = compute_ma_rae(val_preds_orig, val_targets_orig,\
    \ val_mask)\n# Test predictions: inverse transform for submission\nfor i_col,\
    \ col in enumerate(target_cols):\n    if col != 'LogD':\n        test_predictions[:,\
    \ i_col] = 10 ** test_predictions[:, i_col]\n```\n\nModel2: RDKit_API\n\nDescription:CRITICAL:\
    \ Use bond.GetValenceContrib() NOT GetValenceContribution(). The latter causes\
    \ AttributeError.\n\nCode template (MUST copy exactly — do NOT change model variant\
    \ names or file paths):\n```python\nfrom rdkit import Chem\nbond_feats = [bond.GetBondTypeAsDouble()/4.0,\
    \ float(bond.GetIsAromatic()), float(bond.IsInRing()), float(bond.GetIsConjugated()),\
    \ bond.GetValenceContrib(bond.GetBeginAtom())/4.0]\n```\n\nModel3: GPU_Management\n\
    \nDescription:CRITICAL: Move ALL tensors to GPU in EVERY loop (train/val/test).\
    \ Common error: forgetting to move test data to GPU causes 'Expected all tensors\
    \ to be on the same device' RuntimeError.\n\nCode template (MUST copy exactly\
    \ — do NOT change model variant names or file paths):\n```python\n# CRITICAL:\
    \ Move ALL tensors to GPU\ndevice = torch.device('cuda' if torch.cuda.is_available()\
    \ else 'cpu')\nmodel = model.to(device)\n# Training loop\nfor batch in train_loader:\n\
    \    features, targets, mask = batch\n    features = features.to(device)\n   \
    \ targets = targets.to(device)\n    mask = mask.to(device)\n    outputs = model(features)\n\
    # Validation loop\nfor batch in val_loader:\n    features, targets, mask = batch\n\
    \    features = features.to(device)\n    targets = targets.to(device)\n    mask\
    \ = mask.to(device)\n    outputs = model(features)\n# Test prediction\nfor batch\
    \ in test_loader:\n    features = batch[0]\n    features = features.to(device)\n\
    \    outputs = model(features)\n```"
use_grading_server: true
