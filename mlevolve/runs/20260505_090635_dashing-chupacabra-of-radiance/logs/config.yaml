    \ |\n| 4 | Error-type prompting significantly improves mathematical reasoning\
    \ correction accuracy | 2024findings-acl673, 2024findings-acl922 | HIGH | references/error-type-prompting-improves-correction.md\
    \ |\n\n#### Layer Normalization stabilizes transformer training by breaking Lipschitz\
    \ assumptions\n---\ntitle: Layer Normalization stabilizes transformer training\
    \ by breaking Lipschitz assumptions\nconfidence: HIGH\npapers: [2024acl-long800,\
    \ 2024findings-acl695]\n---\n\n# Layer Normalization stabilizes transformer training\
    \ by breaking Lipschitz assumptions\n\nLayer normalization (LayerNorm) is a critical\
    \ component in transformer architectures that stabilizes training by normalizing\
    \ activations. It enables transformers to express sensitive functions like PARITY\
    \ by breaking the Lipschitz assumption used in theoretical proofs. BranchNorm\
    \ extends this by dynamically rescaling non-residual branches based on training\
    \ period.\n\n## Papers & Evidence\n- `2024acl-long800` (Why are Sensitive Functions\
    \ Hard for Transformers?): \"Layer norm, by breaking the Lipschitz assumption\
    \ used in Hahn (2020)'s Theorem 2, allows expressing PARITY in principle.\"\n\
    - `2024findings-acl695` (BranchNorm: Robustly Scaling Extremely Deep Transformers):\
    \ \"BranchNorm progressively degenerates into a vanilla Post-LayerNorm to promote\
    \ better convergence.\"\n\n## Actionable Guidance\nUse LayerNorm in transformer\
    \ architectures when training on tasks requiring sensitivity to input changes.\
    \ For deep architectures (>100 layers), consider BranchNorm's dynamic rescaling\
    \ approach.\n\n**Condition**: Training transformers on sensitive functions or\
    \ deep architectures\n**Confidence**: HIGH - Supported by theoretical proofs and\
    \ empirical results across multiple papers\n\n#### Dynamic rescaling techniques\
    \ like BranchNorm improve convergence in deep transformers\n---\ntitle: Dynamic\
    \ rescaling techniques like BranchNorm improve convergence in deep transformers\n\
    confidence: HIGH\npapers: [2024findings-acl695, 2024findings-acl922]\n---\n\n\
    # Dynamic rescaling techniques like BranchNorm improve convergence in deep transformers\n\
    \nDynamic rescaling methods adapt normalization strategies based on training progress.\
    \ BranchNorm dynamically rescales non-residual branches in transformers, smoothing\
    \ gradient norms early and promoting better convergence later. This approach outperforms\
    \ DeepNorm, especially in extremely deep architectures (>100 layers).\n\n## Papers\
    \ & Evidence\n- `2024findings-acl695` (BranchNorm: Robustly Scaling Extremely\
    \ Deep Transformers): \"BranchNorm not only theoretically stabilizes the training\
    \ with smooth gradient norms at the early stage, but also encourages better convergence\
    \ in the subsequent training stage.\"\n- `2024findings-acl922` (A Meta-Learning\
    \ Perspective on Transformers for Causal Language Modeling): \"The approximate\
    \ inner optimization loss shows a decreasing trend in larger models, mirroring\
    \ an optimization process.\"\n\n## Actionable Guidance\nUse BranchNorm for training\
    \ extremely deep transformers (>100 layers). Implement dynamic alpha growth with\
    \ a linear strategy for robust performance across training stages.\n\n**Condition**:\
    \ Training extremely deep transformer architectures\n**Confidence**: HIGH - Supported\
    \ by empirical results and theoretical analysis across multiple papers\n\n####\
    \ Error-type prompting significantly improves mathematical reasoning correction\
    \ accuracy\n---\ntitle: Error-type prompting significantly improves mathematical\
    \ reasoning correction accuracy\nconfidence: HIGH\npapers: [2024findings-acl673,\
    \ 2024findings-acl922]\n---\n\n# Error-type prompting significantly improves mathematical\
    \ reasoning correction accuracy\n\nProviding error type information in prompts\
    \ significantly improves transformer models' ability to identify and correct mathematical\
    \ reasoning errors. GPT-4 demonstrates outstanding performance in error-presence\
    \ identification (EP), error-step identification (ES), error-type identification\
    \ (ET), and error correction (EC). The meta-learning perspective on transformers\
    \ supports this by showing decreasing trends in approximate inner optimization\
    \ loss.\n\n## Papers & Evidence\n- `2024findings-acl673` (Evaluating Mathematical\
    \ Reasoning of Large Language Models: A Focus on Error Identification and Correction):\
    \ \"Prompting LLMs with the error types can improve the average correction accuracy\
    \ by 47.9%.\"\n- `2024findings-acl922` (A Meta-Learning Perspective on Transformers\
    \ for Causal Language Modeling): \"The approximate inner optimization loss shows\
    \ a decreasing trend in larger models, mirroring an optimization process.\"\n\n\
    ## Actionable Guidance\nUse error-type prompting for mathematical reasoning tasks.\
    \ Include specific error types (e.g., calculation errors) in prompts to improve\
    \ correction accuracy.\n\n**Condition**: Mathematical reasoning tasks with transformer\
    \ models\n**Confidence**: HIGH - Supported by significant accuracy improvements\
    \ and theoretical analysis"
