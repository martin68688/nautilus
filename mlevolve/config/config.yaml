# ============================================================
#  Data & paths
# ============================================================
data_dir: "./data"
dataset_dir: "./data"  # path to mle-bench dataset root
desc_file: "data/spooky-author-identification/prepared/public/description.md"
goal: null
eval: null
exp_name: null
exp_id: "spooky-author-identification"

log_dir: ./runs
log_level: INFO
workspace_dir: ./runs
preprocess_data: True
copy_data: False

# Optional external, label-isolated final evaluation. The train manifest is
# generated by `python -m fixed_holdout.prepare`. When enabled, the old
# protocol/leakage certification must be disabled and final scores are produced
# only after the search by `python -m fixed_holdout.score_run`.
fixed_holdout:
  enabled: False
  evaluation_mode: terminal_only
  train_manifest_path: ""
  bypass_protocol_gates: False
  # Integrity scan of the already-published public train view.  Formal release
  # profiles keep this on.  Fast effectiveness experiments may disable it and
  # rely on the frozen path plus terminal evaluator instead.
  preflight_validate_train_view: True
  internal_metric_disposition: search_only

# Optional native official-test mode.  The task release supplies the complete
# public train/test files plus a frozen sample_submission.csv.  Every candidate
# must generate its official-test predictions during its original execution;
# the Host validates and hashes them, then freezes only the internally selected
# candidate for a separate post-search scorer.  External scores never enter the
# search process.  This mode is mutually exclusive with fixed_holdout because
# the two modes give `submission_<node>.csv` different test-ID contracts.
official_submission:
  enabled: False
  provider: kaggle
  competition: ""
  metric: ""
  maximize: False
  sample_submission_path: ""
  id_column: ""
  prediction_kind: auto
  probability_row_sum_tolerance: 0.0001
  submission_subdir: submission

# Resource
start_cpu_id: 0
cpu_number: 16

# Model paths
torch_hub_dir: ""       # path to torch hub cache, e.g. /data/pretrain_models/torch_models
pretrain_model_dir: ""  # path to pretrained model weights, e.g. /data/pretrain_models
methodology_kb_path: "../paper-skills/experience_kb"  # path to methodology knowledge base
# methodology_kb_path: ""
methodology_dynamic: True   # True=LLM dynamic search, False=static methodology_map.json
# Stop scheduling/limit candidates early enough to persist terminal or partial
# evidence before the enclosing Kubernetes deadline.
finalize_reserve_seconds: 900

# ============================================================
#  Code execution
# ============================================================
exec:
  timeout: 21600
  agent_file_name: runfile.py

# ============================================================
#  Agent config
# ============================================================
agent:

  # --- Basic run params ---
  steps: 80
  time_limit: 21600          # 6h
  initial_drafts: 3
  seed: 42
  data_preview: True

  # --- LLM models ---
  code:
    model: "${oc.env:DEEPSEEK_MODEL, deepseek-v4-flash}"
    temp: 1
    base_url: "${oc.env:DEEPSEEK_BASE_URL, https://api.deepseek.com}"
    api_key: "${oc.env:DEEPSEEK_API_KEY}"
  feedback:
    model: "${oc.env:DEEPSEEK_MODEL, deepseek-v4-flash}"
    temp: 1
    base_url: "${oc.env:DEEPSEEK_BASE_URL, https://api.deepseek.com}"
    api_key: "${oc.env:DEEPSEEK_API_KEY}"

  # --- Submission check ---
  check_data_leakage: True

  # --- Code gen mode ---
  use_diff_mode: True                # SEARCH/REPLACE patch

  # Optional explicit roles for initial draft branches. RunForest enables this
  # in its overlay; the default agent keeps its ordinary draft behavior.
  draft_role_policy:
    enabled: False
    roles: []
    extra_role: novel_exploration
    replay_targets_path: ""
    replay_runs_root: ""

  # Optional host-enforced feasibility boundary for paired online experiments.
  # It is inert by default and must be identical across paired conditions.
  candidate_execution_contract:
    enabled: False
    contract_id: ""
    max_execution_seconds: 0
    max_epochs: 0
    max_cv_folds: 0
    max_trainable_models: 0
    allowed_import_roots: []
    allow_remote_assets: True
    allow_unverified_local_assets: True
    allow_dataset_wide_per_sample_precompute: True
    allow_source_score_inheritance: False

  # Protocol-biased solutions need a staged evaluation-protocol migration,
  # not repeated free-form debugging.  Each stage keeps the frozen model
  # design and is blocked from GPU execution until the final gate.
  protocol_repair:
    enabled: True
    per_stage_attempt_limit: 2
    stage_generation_attempt_limit: 2
    stage_attempt_limits:
      data_scope: 3
      validation_provenance: 3
      cross_fit: 7
      selection_freeze: 6
      final_holdout: 10
    stage_generation_attempt_limits:
      data_scope: 3
      validation_provenance: 3
      cross_fit: 7
      selection_freeze: 6
      final_holdout: 10
    final_runtime_attempt_limit: 6
    stage_generation_timeout_seconds: 300
    stage_generation_backend_retries: 2
    require_runtime_provenance: True

  # Host Protocol preflight is opt-in.  Keep the complete schema in the base
  # config so ordinary/shadow runs can load without a missing-key error; host
  # enforce overlays replace these values with their frozen binding.
  protocol_preflight:
    enabled: False
    repair_enabled: False
    max_repair_attempts: 1
    binding_path: ""
    legacy_ast_mode: shadow
    report_root: ""
    expected_contract_hash: ""
    contract_path: ""
    data_view_manifest_path: ""
    image_digest: ""
    sdk_hash: ""
    collector_private_key_path: ""
    candidate_uid: 65534
    consume_collector_private_key: False

  # --- Branch strategy ---
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2

  # --- Global memory ---
  use_global_memory: True
  memory_similarity_threshold: 0.7
  memory_embedding_device: cuda
  memory_embedding_model_path: "BAAI/bge-base-en-v1.5"  # HuggingFace model name or local path

  # --------------------------------------------------------
  #  Search tree params
  # --------------------------------------------------------
  search:
    # Parallel & resources
    parallel_search_num: 6
    num_gpus: 3
  

  

    # Node expansion limits
    num_drafts: 5
    # When every existing branch is permanently non-expandable, reserve a
    # bounded number of fresh root hypotheses instead of ending the run early.
    replacement_drafts_enabled: True
    max_replacement_drafts: 5
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10

    # Debug depth
    max_debug_depth: 20
    back_debug_depth: 3
    debug_prob: 1

    # Improvement criteria
    metric_improvement_threshold: 0.0001
    max_improve_failure: 3

    # Stagnation detection
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20

    # Explore-exploit soft switch
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2

    # Top-K node selection
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2

    # Force backprop
    force_backprop_late_threshold: 0.80
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4

    # Multi-branch fusion conditions
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2

  # --------------------------------------------------------
  #  Exploration constant decay
  # --------------------------------------------------------
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios: [0.3, 0.7]

# ============================================================
#  Cold-start knowledge
# ============================================================
# Protocol-scoped authority initially observes decisions without changing the
# established leakage gates. Switch to enforce after shadow parity is checked.
evaluation_authority:
  mode: shadow
  protocol_registry: config/protocols
  active_protocol_id: mlevolve-default
  active_protocol_version: "1"
  policy_version: authority_v1
  collector_version: "1"
  rollout_id: authority-shadow-v1
  # Pin these to CURRENT before any online canary that uses a Base Bundle.
  # Empty means that this run is explicitly bundle-free (bundle_id=none).
  expected_bundle_id: ""
  expected_bundle_manifest_sha256: ""
  require_bound_bundle: false
  # These scopes are inert in shadow mode.  The canary profile below fills
  # them so enforce never silently expands to every operation/stage.
  enforce_operations: []
  enforce_generation_stages: []
  enforce_governance_stages: []
  canary_minimum_decisions: 20
  canary_max_unauthorized_authority_allows: 0
  canary_max_false_denial_rate: 0.05
  fail_closed_high_risk: true
  allow_invalid_debug: true
  emit_snapshot: true
  enable_causal_actuation: false
  # Host-injected call tracing binds executed split/fit/prediction/evaluator
  # events to the immutable code snapshot. It is active only in shadow/enforce.
  runtime_protocol_observer_enabled: true
  # legacy_ast | host_sdk_shadow | host_sdk_enforce. Historical/default runs
  # remain legacy until an additive rollout profile is selected explicitly.
  protocol_runtime_mode: legacy_ast
  protocol_runtime_artifact_root: ""

coldstart:
  use_coldstart: True
  task_json_path: "engine/coldstart/competition_tag_classified.json"
  model_json_path: "engine/coldstart/models_guidance_classified.json"
  description: ""

# ============================================================
#  Adoption tracking
# ============================================================
adoption_tracking:
  enable: False
  enable_analysis: True
  judge_mode: keyword    # keyword | llm | llm-all | hybrid
  analysis_timeout_seconds: 300

# General, task-independent memory-adoption verifier. In shadow mode it emits
# plans/verdicts without replacing the legacy adoption gate. ``enforce`` makes
# its code evidence + executed probes authoritative for adoption publication.
adoption_verifier:
  enabled: false
  mode: shadow            # shadow | enforce
  model: ""                # empty -> agent.feedback.model
  temperature: 0.0
  max_tokens: 4096
  max_contracts_per_call: 8
  max_code_chars: 120000
  require_signed_trace: false

# Prospective dual-observer prevalence audit. Disabled for ordinary runs.
prospective_audit:
  enabled: false
  # Online smoke may allow pending paired counterfactuals. Formal Experiment A
  # keeps this false and the packet gate rejects incomplete counterfactuals.
  allow_pending_counterfactual: false
  counterfactual_timeout_seconds: 300
  counterfactual_generation_attempts: 2
  counterfactual_memory_max_chars: 12000

# ============================================================
#  External persistent skill memory
# ============================================================
external_skill_memory:
  enable: False
  # When bundle_root is set, runtime resolves CURRENT.json into a hash-verified
  # immutable Base Bundle and writes only to the run-scoped Session Overlay.
  bundle_root: ""
  current_pointer_path: "CURRENT.json"
  verify_bundle_artifacts: true
  session_overlay_path: ""
  graph_path: "../paper-skills/distillation/graph_build/graph_optimized_skillgraph.json"
  index_path: ""
  text_model_path: ""
  source_name: "skillgraph"   # e.g. skillgraph | hyperbolic_agentic_memory | flat_twin_agentic_memory | euclidean_agentic_memory
  mode: "skillgraph"          # skillgraph | agentic_hyperbolic | flat_twin_agentic | agentic_euclidean
  scoring_mode: "lexical"     # lexical | poincare | flat_twin | euclidean
  geometry_distance_weight: 0.30
  geometry_semantic_weight: 0.20
  geometry_constraint_weight: 0.05
  geometry_condition_weight: 0.18
  geometry_failure_weight: 0.14
  geometry_evidence_weight: 0.08
  geometry_reliability_weight: 0.08
  geometry_conflict_weight: 0.10
  geometry_distance_norm: "none"  # none | minmax | zscore
  geometry_query_radius_quantile: 0.5
  geometry_query_radius_mode: "predicted_distribution"  # quantile | predicted_distribution
  geometry_query_radius_bands: ["core", "middle", "edge"]
  geometry_query_radius_top_bands: 2
  geometry_radius_fusion: "weighted_max"  # weighted_max | weighted_mean
  enable_agentic: False
  navigator_max_steps: 3
  navigator_reference_budget: 1200
  selector_max_tokens: 1800
  top_k: 8
  depth: 2
  beam_width: 3
  general_cap: 2
  task_seed_limit: 6
  max_chars: 5000
  include_draft: True
  include_improve: True
  include_evolution: True
  include_debug: True
  include_fusion: True
  visibility_token_budget: 4096
  # Task-level synthesis is opt-in. Shadow mode records evidence only. Active
  # mode fail-closed replaces the legacy Improve/Debug generator with Strategy
  # -> Atomic Planner -> bounded Coder for the configured stages.
  memory_strategy_shadow_enabled: false
  memory_strategy_shadow_stages: ["improve"]
  memory_strategy_debug_trigger: "causal_gap_or_repeated_failure"
  memory_strategy_debug_failure_threshold: 2
  memory_strategy_active_enabled: false
  memory_strategy_active_stages: ["improve", "debug"]
  memory_strategy_active_required: true
  # One shared Strategy attention budget: three current role frontiers, one
  # causal failure, then same-task diverse historical evidence.
  memory_strategy_evidence_limit: 8
  memory_strategy_current_frontier_slots: 3
  memory_strategy_causal_failure_slots: 1
  memory_strategy_candidate_pool_limit: 48
  # Deprecated v1 compatibility aliases.
  memory_strategy_max_cards: 24
  memory_strategy_card_max_chars: 6000
  memory_strategy_max_input_chars: 0
  memory_strategy_max_output_tokens: 12000
  memory_strategy_max_retries: 2
  memory_strategy_contract_retries: 4
  memory_strategy_min_candidate_compositions: 3
  memory_strategy_temperature: 0.0
  memory_strategy_model: "deepseek-v4-pro"
  memory_strategy_thinking_enabled: true
  memory_strategy_json_normalization_enabled: true
  memory_strategy_json_normalization_model: ""
  memory_strategy_json_normalization_max_tokens: 12000
  memory_strategy_json_normalization_max_retries: 2
  memory_strategy_history_limit: 16
  memory_strategy_atomic_max_modules: 2
  memory_strategy_atomic_max_changes: 3
  memory_strategy_atomic_max_patches: 6
  memory_strategy_atomic_debug_max_modules: 1
  memory_strategy_atomic_debug_max_changes: 2
  memory_strategy_atomic_debug_targeted_repair_only: true
  memory_strategy_atomic_planner_contract_retries: 2
  memory_strategy_atomic_coder_contract_retries: 1

# ============================================================
#  Persisted run identity (baseline vs memory-system experiments)
# ============================================================
run_identity:
  schema: mlevolve_run_identity_v1
  experiment_group: baseline_no_external_memory
  baseline_reference_group: ""
  memory_enabled: false
  memory_system: none
  memory_version: none
  memory_snapshot_sha256: ""
  memory_index_sha256: ""
  memory_source_count: 0
  memory_source_runs: []
  code_revision: ""
  code_worktree_sha256: ""
  identity_source: declared_at_runtime
