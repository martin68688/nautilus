apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-uci100-v147-3h-clip-r1-dev
  namespace: ecepxie
  annotations:
    mlevolve.ai/purpose: v147-fixed-topk-three-hour-cliproxy-rerun
    mlevolve.ai/source-task: leaf-classification
    mlevolve.ai/target-task: uci-one-hundred-leaves
    mlevolve.ai/llm-endpoint: private-cluster-local-cliproxyapi
  labels:
    app: mlevolve-end2end-dev
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-uci100-v147-3h-clip-r1
    mlevolve.ai/release-mode: three-hour-rerun
    mlevolve.ai/system: fixed-topk-cross-task-transfer
spec:
  activeDeadlineSeconds: 14400
  restartPolicy: Never
  terminationGracePeriodSeconds: 180
  containers:
    - name: dev
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - exec sleep infinity
      envFrom:
        - secretRef:
            name: cliproxyapi-haoming-client
      env:
        - name: OPENAI_MODEL
          value: gpt-5.6-sol
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONPATH
          value: /workspace/nautilus-exp-end2end-agent-v147-transfer-3h-clip-r1/mlevolve:/workspace/nautilus-exp-end2end-agent-v147-transfer-3h-clip-r1
      resources:
        limits:
          cpu: "16"
          ephemeral-storage: 64Gi
          memory: 32Gi
          nvidia.com/a100: "1"
        requests:
          cpu: "16"
          ephemeral-storage: 64Gi
          memory: 32Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
