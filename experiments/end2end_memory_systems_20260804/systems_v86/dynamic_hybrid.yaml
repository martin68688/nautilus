# v84/v85 observed Authority decisions in shadow mode. The external-memory
# gateway above now enforces only the pre-ranking Debug-retrieval boundary;
# global Authority stays shadow so unrelated protocol-bound Experiment-R
# candidate-pool attestation is not accidentally enabled.
