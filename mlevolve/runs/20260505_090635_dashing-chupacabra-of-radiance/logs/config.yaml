    \ |\n\n#### Taboo words increase lexical diversity in LLM-based paraphrasing\n\
    ---\ntitle: Taboo words increase lexical diversity in LLM-based paraphrasing\n\
    confidence: HIGH\npapers: [2024acl-long710, 2024findings-acl188]\n---\n\n# Taboo\
    \ words increase lexical diversity in LLM-based paraphrasing\n\nInstructing LLMs\
    \ to avoid specific words (taboo words) during paraphrasing significantly increases\
    \ lexical diversity. This method is particularly effective when the goal is to\
    \ enhance lexical variation in generated texts.\n\n## Papers & Evidence\n- `2024acl-long710`\
    \ (Effects of diversity incentives): \"the taboo method yielded a higher-than-baseline\
    \ number of unique words and 3-grams\" — Demonstrates that avoiding specific words\
    \ increases lexical diversity.\n- `2024findings-acl188` (GENDEX): \"We filter\
    \ short texts containing person names from D and obtain NER-filtered texts\" —\
    \ Shows that targeted filtering (akin to taboo words) improves data quality.\n\
    \n## Actionable Guidance\n**Model**: GPT-3.5 or similar LLMs\n**Condition**: When\
    \ aiming to increase lexical diversity in paraphrased texts\n**Configuration**:\
    \ Define a list of taboo words based on previous paraphrases or domain-specific\
    \ requirements.\n\n**Confidence**: HIGH — Both papers provide direct evidence\
    \ of lexical diversity improvements through targeted word avoidance.\n\n#### Two-stage\
    \ noise-tolerant training improves model performance on synthetic data\n---\n\
