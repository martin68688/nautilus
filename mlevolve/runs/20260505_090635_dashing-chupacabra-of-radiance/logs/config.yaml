    \ text classification): \"Hierarchical cross-check annotation ensures high-quality\
    \ annotations and renders traditional IAA metrics less meaningful.\"\n\n## Actionable\
    \ Guidance\nFor low-resource language datasets, implement multi-stage hierarchical\
    \ annotation with expert review to ensure quality.\n\n**Condition**: Expert-driven\
    \ annotation tasks requiring specialized knowledge\n**Confidence**: HIGH - Proven\
    \ effective across multiple dataset creation efforts\n\n#### Contrastive learning\
    \ enhances idiomatic expression representation\n---\ntitle: Contrastive learning\
    \ enhances idiomatic expression representation\nconfidence: HIGH\npapers: [2024findings-acl741,\
    \ 2024acl-long857]\n---\n\n# Contrastive learning enhances idiomatic expression\
    \ representation\n\nAdaptive contrastive triplet loss methods significantly improve\
    \ representation of idiomatic expressions by distinguishing between literal and\
    \ figurative meanings through carefully constructed positive-anchor-negative triplets.\n\
    \n## Papers & Evidence\n- `2024findings-acl741` (Enhanced Idiomatic Representation):\
    \ \"Our proposed method outperforms previous alternatives significantly in many\
    \ metrics.\"\n- `2024acl-long857` (NounAtlas): \"The quality assessment showed\
    \ 77.11% of role spans remained unchanged after propagation.\"\n\n## Actionable\
    \ Guidance\nUse contrastive triplet loss with carefully mined examples to improve\
    \ representation of idiomatic expressions across languages.\n\n**Condition**:\
    \ When training language models for idiomatic expression representation\n**Confidence**:\
    \ HIGH - Demonstrates substantial improvements across evaluation metrics\n\n---\n\
