apiVersion: v1
kind: Pod
metadata:
  name: devpod-prevalence-release-stager-cpu-r5
  namespace: ecepxie
  labels:
    app: mlevolve-prevalence-release-stager
    execution-kind: devpod
    experiment-gate: r4-freeze
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: [rci-nautilus01.msu.montana.edu]
  activeDeadlineSeconds: 86400
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  securityContext: {runAsUser: 0, runAsGroup: 0}
  containers:
  - name: stager
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc"]
    args: ["set -euo pipefail; exec sleep infinity"]
    env:
    - {name: PYTHONUNBUFFERED, value: "1"}
    - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
    resources:
      requests: {cpu: "8", memory: 32Gi}
      limits: {cpu: "8", memory: 32Gi}
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
    - {name: collector-key-source, mountPath: /run/host-key-source, readOnly: true}
  volumes:
  - {name: workspace, persistentVolumeClaim: {claimName: haoming-storage}}
  - {name: collector-key-source, secret: {secretName: prevalence-audit-collector-r1, defaultMode: 256}}
