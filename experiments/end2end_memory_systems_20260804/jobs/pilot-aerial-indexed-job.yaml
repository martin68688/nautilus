apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-e2e-agent-pilot-aerial-v3
  namespace: ecepxie
  labels: &id001
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-agent-v3
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
  annotations:
    mlevolve.ai/launch-gate: explicit-user-authorization-required
    mlevolve.ai/generated-not-submitted: 'true'
    mlevolve.ai/gpu-contract: nvidia.com/a100-family-unpinned
    mlevolve.ai/preserve-failed-index-artifacts: 'true'
    mlevolve.ai/per-index-deadline-seconds: '25200'
    mlevolve.ai/global-deadline-seconds: '252000'
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 1
  backoffLimitPerIndex: 0
  maxFailedIndexes: 10
  activeDeadlineSeconds: 252000
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      containers:
      - name: end2end-runner
        image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/python
        - -u
        args:
        - /workspace/nautilus-exp-end2end/experiments/end2end_memory_systems_20260804/run_assignment.py
        - --manifest
        - /workspace/nautilus-exp-end2end/experiments/end2end_memory_systems_20260804/manifests/pilot_manifest.json
        - --output-root
        - /workspace/experiment-end2end-agent-runs-v3
        - --smoke-gate
        - /workspace/experiment-end2end-agent-runs-v3/SMOKE_GATE.json
        - --task
        - aerial-cactus-identification
        envFrom:
        - secretRef:
            name: prevalence-audit-deepseek-r1
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: KUBERNETES_JOB_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-name']
        - name: KUBERNETES_JOB_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONPATH
          value: /workspace/nautilus-exp-end2end/mlevolve
        - name: MLEVOLVE_CONTAINER_IMAGE_REFERENCE
          value: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
        - name: MLEVOLVE_SOLVER_BINDING_ID
          value: deepseek-production-solver
        - name: MLEVOLVE_SOLVER_MODEL_REVISION
          value: sha256:6c72890187efc83ef04ac6527c8f22f823708d99c83b7f7b3393dfe27fe4efc6
        resources:
          requests:
            cpu: '16'
            memory: 64Gi
            ephemeral-storage: 64Gi
            nvidia.com/a100: '1'
          limits:
            cpu: '16'
            memory: 64Gi
            ephemeral-storage: 64Gi
            nvidia.com/a100: '1'
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: collector-key-source
          mountPath: /run/host-key-source
          readOnly: true
        - name: collector-key-runtime
          mountPath: /run/host-key
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: haoming-storage
      - name: collector-key-source
        secret:
          secretName: prevalence-audit-collector-r1
          defaultMode: 256
      - name: collector-key-runtime
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
