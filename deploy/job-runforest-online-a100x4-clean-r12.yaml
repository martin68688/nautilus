apiVersion: batch/v1
kind: Job
metadata:
  name: runforest-online-a100x4-clean-r12
  namespace: ecepxie
  labels:
    app: runforest-online-memory
    memory-system: run-forest-clean
    gpu-profile: a100x4
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: runforest-online-memory
        memory-system: run-forest-clean
        gpu-profile: a100x4
    spec:
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-80GB-PCIe
      containers:
      - name: runforest-online-clean
        image: haomingwang22/mlevolve:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          export OPENAI_COMPAT_TIMEOUT="${OPENAI_COMPAT_TIMEOUT:-1200}"

          BRANCH="${RUNFOREST_BRANCH:-codex/dual-time-procedural-memory}"
          RUN_TAG="${RUNFOREST_ONLINE_TAG:-runforest_online_a100x4_clean_r12_$(date +%Y%m%d_%H%M%S)}"
          SRC_BASE="/workspace/nautilus"
          WORKDIR="/workspace/nautilus_runforest_online_${RUN_TAG}"
          RUNS_DIR="${SRC_BASE}/mlevolve/runs"
          MATRIX_LOG_DIR="${RUNS_DIR}/${RUN_TAG}_job_logs"
          mkdir -p "${MATRIX_LOG_DIR}"
          exec > >(tee -a "${MATRIX_LOG_DIR}/job.log") 2>&1

          echo "=== Run-Forest latest clean-source online memory job ==="
          echo "date=$(date)"
          echo "branch=${BRANCH}"
          echo "run_tag=${RUN_TAG}"
          echo "resources=4x A100, 16 CPU, 64Gi, default priority"

          test -d "${SRC_BASE}/.git" || { echo "ERROR: missing source repo"; exit 2; }
          rm -f "${SRC_BASE}/.git/shallow.lock"
          git -C "${SRC_BASE}" fetch --depth=1 origin "${BRANCH}"
          SOURCE_COMMIT="$(git -C "${SRC_BASE}" rev-parse FETCH_HEAD)"
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          git -C "${SRC_BASE}" archive --format=tar "${SOURCE_COMMIT}" -- . \
            ':(exclude)mlevolve/runs' \
            ':(exclude)mlevolve/data' \
            ':(exclude)paper-skills/node_modules' \
            | tar -x -C "${WORKDIR}"
          printf '%s\n' "${SOURCE_COMMIT}" > "${WORKDIR}/.source_commit"
          echo "checked_out_commit=${SOURCE_COMMIT}"
          cd "${WORKDIR}"

          echo "=== Cold-start template provenance check ==="
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = "5ecbdc00023227e75840f59104c9f5be58ae9efd403beb3d6c5cff894d49b0ff"
          path = Path("mlevolve/engine/coldstart/models_guidance_classified.json")
          raw = path.read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          models = json.loads(raw)
          nlp_keys = list(models.get("NLP", {}).keys())
          assert actual == expected, (actual, expected)
          assert nlp_keys == ["ModernBERT", "DeBERTa-v3-large"], nlp_keys
          assert b"20260509_185008" not in raw
          assert b"Weighted Ensemble. Achieved Log Loss ~0.2013" not in raw
          print("coldstart_template_ok", actual, nlp_keys)
          PY

          rm -rf "${WORKDIR}/mlevolve/data" "${WORKDIR}/mlevolve/runs"
          ln -s "${SRC_BASE}/mlevolve/data" "${WORKDIR}/mlevolve/data"
          ln -s "${RUNS_DIR}" "${WORKDIR}/mlevolve/runs"
          ln -sf "${SRC_BASE}/mlevolve/.env" "${WORKDIR}/mlevolve/.env"

          cd "${WORKDIR}/mlevolve"
          set -a
          . ./.env
          set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL
          export RUNFOREST_ONLINE_TAG="${RUN_TAG}"
          export RUNFOREST_NUM_GPUS=4
          export RUNFOREST_CPU_NUMBER=16
          export RUNFOREST_RUNS_DIR="${RUNS_DIR}"

          echo "=== Preflight compile and audit tests ==="
          python -m py_compile \
            ../paper-skills/hyper_memory/build_run_forest_memory.py \
            ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            agents/leakage_audit.py \
            agents/memory/external_skill_memory.py \
            agents/memory/run_forest_replay.py \
            agents/draft_agent.py \
            agents/debug_agent.py \
            agents/improve_agent.py \
            agents/result_parse_agent.py \
            agents/triggers.py \
            engine/agent_search.py
          pytest -q ../tests/test_leakage_audit.py ../tests/test_run_forest_memory.py

          echo "=== Build clean Run-Forest graph from allowlist ==="
          python ../paper-skills/hyper_memory/build_run_forest_memory.py \
            --runs-dir "${RUNS_DIR}" \
            --sop-graph "${WORKDIR}/paper-skills/hyper_memory/hyper_graph.json" \
            --out-dir "${WORKDIR}/paper-skills/hyper_memory" \
            --allowlist "${WORKDIR}/paper-skills/eval_skill_memory/clean_run_allowlist.json" \
            --require-clean-provenance

          echo "=== Clean graph and audit-status preflight ==="
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd().parents[0]
          graph = json.loads((root / "paper-skills/hyper_memory/run_forest_graph.json").read_text())
          allowlist = json.loads((root / "paper-skills/eval_skill_memory/clean_run_allowlist.json").read_text())
          report = json.loads((root / "paper-skills/hyper_memory/run_forest_builder_report.json").read_text())
          allowed = {entry["run_id"] for entry in allowlist["entries"] if entry.get("allowed")}
          source_runs = set(graph["meta"].get("source_runs", []))
          assert graph["meta"].get("leak_verified") is True
          assert graph["meta"].get("paper_grade") is True
          expected_status = "source_allowlisted_and_code_audited"
          assert graph["meta"].get("provenance_status") == expected_status
          assert report.get("provenance_status") == expected_status
          assert source_runs == allowed, sorted(source_runs ^ allowed)
          assert not any(run.startswith("20260512") for run in source_runs)
          assert report.get("audited_code_node_count", 0) > 0
          print("clean_graph_ok", len(source_runs), len(graph.get("nodes", [])), report.get("audit_status_counts"))
          PY

          echo "=== Evaluate clean Run-Forest artifacts ==="
          python ../paper-skills/hyper_memory/evaluate_run_forest_memory.py \
            --graph "${WORKDIR}/paper-skills/hyper_memory/run_forest_graph.json" \
            --index "${WORKDIR}/paper-skills/hyper_memory/run_forest_index.npz" \
            --output "${WORKDIR}/paper-skills/eval_skill_memory/reports/run_forest_memory_evaluation.json" \
            --report "${WORKDIR}/coordination/run_forest_memory_experiment_report.md"

          echo "=== Running four-task latest-code matrix ==="
          python ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            --tag "${RUN_TAG}" \
            --num-gpus 4 \
            --cpu-number 16 \
            --runs-dir "${RUNS_DIR}"

          echo "=== Summarizing matrix ==="
          python ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            --runs-dir "${RUNS_DIR}" \
            --manifest "${RUNS_DIR}/${RUN_TAG}_matrix/runforest_online_manifest.jsonl"
          echo "=== Job complete ==="
        env:
        - name: RUNFOREST_BRANCH
          value: "codex/dual-time-procedural-memory"
        resources:
          requests:
            cpu: "16"
            memory: "64Gi"
            nvidia.com/a100: "4"
          limits:
            cpu: "16"
            memory: "64Gi"
            nvidia.com/a100: "4"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: haoming-storage
