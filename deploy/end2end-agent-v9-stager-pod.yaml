apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-agent-v9-stager
  namespace: ecepxie
  labels:
    app: mlevolve-end2end-stager
    experiment: experiment-end2end-memory-agent-v9
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
spec:
  restartPolicy: Never
  containers:
    - name: stager
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-lc", "exec sleep infinity"]
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 8Gi
        limits:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 8Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
