apiVersion: v1
kind: Pod
metadata:
  name: devpod-prevalence-counterfactual-a40x1-r1
  namespace: ecepxie
  labels:
    app: mlevolve-prevalence-counterfactual
    execution-kind: devpod
    experiment-gate: counterfactual-recovery
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: [rci-nautilus01.msu.montana.edu]
  activeDeadlineSeconds: 21600
  restartPolicy: Never
  terminationGracePeriodSeconds: 90
  securityContext: {runAsUser: 0, runAsGroup: 0}
  containers:
  - name: smoke
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc"]
    args:
    - >-
      set -euo pipefail;
      mkdir -p /run/host-key;
      install -m 0400 /run/host-key-source/collector.ed25519 /run/host-key/collector.ed25519;
      exec sleep infinity
    env:
    - {name: TASK_ID, value: new-york-city-taxi-fare-prediction}
    - {name: MLEVOLVE_RUNTIME_IMAGE_DIGEST, value: "sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc"}
    - {name: MLEVOLVE_HOST_COLLECTOR_KEY_FILE, value: /run/host-key/collector.ed25519}
    - {name: PYTHONUNBUFFERED, value: "1"}
    - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
    envFrom:
    - secretRef: {name: prevalence-audit-deepseek-r1}
    resources:
      requests: {cpu: "8", memory: 16Gi, nvidia.com/a40: "1"}
      limits: {cpu: "8", memory: 16Gi, nvidia.com/a40: "1"}
    volumeMounts:
    - {name: workspace, mountPath: /release, subPath: prevalence-audit-20260729-r3, readOnly: true}
    - {name: workspace, mountPath: /task/public, subPathExpr: prevalence-audit-20260729-r3/data/$(TASK_ID)/public, readOnly: true}
    - {name: collector-key-source, mountPath: /run/host-key-source, readOnly: true}
    - {name: host-key-runtime, mountPath: /run/host-key}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - {name: workspace, persistentVolumeClaim: {claimName: haoming-storage}}
  - {name: collector-key-source, secret: {secretName: prevalence-audit-collector-r1, defaultMode: 256}}
  - {name: host-key-runtime, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
