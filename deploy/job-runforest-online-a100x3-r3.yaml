apiVersion: batch/v1
kind: Job
metadata:
  name: runforest-online-a100x3-r3
  namespace: ecepxie
  labels:
    app: runforest-online-memory
    memory-system: run-forest
    gpu-profile: a100x3
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: runforest-online-memory
        memory-system: run-forest
        gpu-profile: a100x3
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-80GB-PCIe
      containers:
      - name: runforest-online
        image: haomingwang22/mlevolve:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          export OPENAI_COMPAT_TIMEOUT="${OPENAI_COMPAT_TIMEOUT:-1200}"

          BRANCH="${RUNFOREST_BRANCH:-codex/hyperbolic-structural-memory}"
          RUN_TAG="${RUNFOREST_ONLINE_TAG:-runforest_online_a100x3_r3_$(date +%Y%m%d_%H%M%S)}"
          SRC_BASE="/workspace/nautilus"
          WORKDIR="/workspace/nautilus_runforest_online_${RUN_TAG}"
          RUNS_DIR="/workspace/nautilus/mlevolve/runs"
          MATRIX_LOG_DIR="${RUNS_DIR}/${RUN_TAG}_job_logs"
          mkdir -p "${MATRIX_LOG_DIR}"
          exec > >(tee -a "${MATRIX_LOG_DIR}/job.log") 2>&1

          checkout_from_seed() {
            local seed
            for seed in /workspace/nautilus_runforest_online_runforest_online_a100x3_r2_* "${SRC_BASE}"; do
              if [ ! -d "${seed}/.git" ]; then
                continue
              fi
              echo "checkout_mode=local_seed seed=${seed}"
              rm -rf "${WORKDIR}"
              git clone --shared "${seed}" "${WORKDIR}"
              git -C "${WORKDIR}" remote set-url origin "${REMOTE}"
              git -C "${WORKDIR}" fetch --depth=1 origin "${BRANCH}"
              git -C "${WORKDIR}" checkout -B "${BRANCH}" FETCH_HEAD
              return 0
            done
            return 1
          }

          checkout_from_remote() {
            local attempt
            for attempt in 1 2 3; do
              echo "clone_attempt=${attempt} mode=remote_shallow"
              rm -rf "${WORKDIR}"
              if git -c http.version=HTTP/1.1 \
                clone --depth=1 --single-branch --branch "${BRANCH}" "${REMOTE}" "${WORKDIR}"; then
                return 0
              fi
              echo "remote shallow clone failed on attempt ${attempt}"
              sleep $((attempt * 20))
            done
            return 1
          }

          echo "=== Run-Forest online memory job ==="
          echo "date=$(date)"
          echo "branch=${BRANCH}"
          echo "run_tag=${RUN_TAG}"
          echo "workdir=${WORKDIR}"
          echo "runs_dir=${RUNS_DIR}"
          echo "resources=3x A100, 6 CPU, 64Gi"

          test -d "${SRC_BASE}/.git" || { echo "ERROR: missing source repo at ${SRC_BASE}"; exit 2; }
          REMOTE="$(git -C "${SRC_BASE}" remote get-url origin)"
          checkout_from_seed || checkout_from_remote
          cd "${WORKDIR}"
          git config --global --add safe.directory "${WORKDIR}" || true
          echo "checked_out_commit=$(git rev-parse HEAD)"
          ln -sf "${SRC_BASE}/mlevolve/.env" "${WORKDIR}/mlevolve/.env"

          cd "${WORKDIR}/mlevolve"
          set -a
          . ./.env
          set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL
          export RUNFOREST_ONLINE_TAG="${RUN_TAG}"
          export RUNFOREST_NUM_GPUS=3
          export RUNFOREST_CPU_NUMBER=6
          export RUNFOREST_RUNS_DIR="${RUNS_DIR}"

          echo "=== Preflight ==="
          python -m py_compile \
            agents/memory/external_skill_memory.py \
            engine/coldstart/knowledge.py \
            engine/agent_search.py \
            agents/draft_agent.py
          pytest -q ../tests/test_run_forest_memory.py

          echo "=== Running multi-task memory matrix ==="
          python ../paper-skills/hyper_memory/run_runforest_online_matrix.py \
            --tag "${RUN_TAG}" \
            --num-gpus 3 \
            --cpu-number 6 \
            --runs-dir "${RUNS_DIR}"

          echo "=== Summarizing matrix ==="
          python ../paper-skills/hyper_memory/summarize_runforest_online_matrix.py \
            --runs-dir "${RUNS_DIR}" \
            --manifest "${RUNS_DIR}/${RUN_TAG}_matrix/runforest_online_manifest.jsonl"
          echo "=== Job complete ==="
        env:
        - name: RUNFOREST_BRANCH
          value: "codex/hyperbolic-structural-memory"
        resources:
          requests:
            cpu: "6"
            memory: "64Gi"
            nvidia.com/a100: "3"
          limits:
            cpu: "6"
            memory: "64Gi"
            nvidia.com/a100: "3"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: haoming-storage
