  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: microsoft/deberta-v3-large+ Stylometric/Readability/POS/N-gram\
    \ features + XGBoost + Logistic Regression + Weighted Ensemble\n\nDescription:DeBERTa-v3-large\
    \ fine-tuning + Stylometric/Readability/POS/N-gram features + XGBoost + Logistic\
    \ Regression + Weighted Ensemble. Achieved Log Loss ~0.2013 on Spooky Author Identification.\
    \ Key strategies: (1) DeBERTa-v3-large fine-tuning with label_smoothing=0.1, AMP,\
    \ gradient clipping, early stopping. (2) Rich handcrafted features: 30 stylometric\
    \ features (char/word/sentence stats, punctuation ratios, archaic/emotional/Lovecraft\
    \ word ratios, function words), 4 readability features (Flesch Reading Ease, ARI,\
    \ avg syllables, complex word ratio), 5 POS approximation features (noun/verb/adj/adv\
    \ suffix ratios), char n-grams (2-4, 4-6, 5-7) + word n-grams (1-3) + punctuation\
    \ sequences. (3) XGBoost on DeBERTa embeddings + handcrafted dense features. (4)\
    \ Logistic Regression on sparse n-gram features. (5) Grid-search optimized ensemble\
    \ weights across 3 models. CRITICAL: Probability clip(1e-15, 1-1e-15) then row-normalize\
    \ before scoring. Do NOT use ModernBERT (0.34-0.35), DeBERTa-small/base (0.37),\
    \ or full freezing (0.38).\n\nCode template (MUST copy exactly — do NOT change\
    \ model variant names or file paths):\n```python\n\"\"\"\nRun 20260509_185008\
    \ Train+Inference Script\nLogLoss: ~0.2013 (真实 log_loss, 无 INDEX_BUG)\n模型: DeBERTa-v3-large\
    \ fine-tuning + XGBoost + Logistic Regression + 集成\n\n用法: python infer_0509_185008_0201.py\n\
    \"\"\"\n\nimport pandas as pd\nimport numpy as np\nimport os\nimport re\nimport\
    \ warnings\nimport gc\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data\
    \ import DataLoader, TensorDataset\nfrom torch.cuda.amp import autocast, GradScaler\n\
    from transformers import (\n    AutoTokenizer,\n    AutoModelForSequenceClassification,\n\
    \    get_linear_schedule_with_warmup,\n)\nfrom torch.optim import AdamW\nfrom\
    \ sklearn.model_selection import train_test_split\nfrom sklearn.feature_extraction.text\
    \ import TfidfVectorizer, CountVectorizer\nfrom sklearn.preprocessing import StandardScaler,\
    \ LabelEncoder\nfrom sklearn.feature_selection import VarianceThreshold\nfrom\
    \ sklearn.linear_model import LogisticRegression\nfrom scipy.sparse import hstack\n\
    import string\nimport xgboost as xgb\n\nwarnings.filterwarnings(\"ignore\")\n\n\
    # ============================================================\n# 路径配置\n# ============================================================\n\
    INFERENCE_DIR = \"./input\"\nDATA_DIR = \"./input\"\nTRAIN_CSV = \"./input/train.csv\"\
    \nTEST_CSV = \"./input/test.csv\"\nOUTPUT_CSV = \"./submission/submission.csv\"\
    \nWORKING_DIR = \"./working\"\n\nos.makedirs(WORKING_DIR, exist_ok=True)\nos.makedirs(\"\
    ./submission\", exist_ok=True)\n\n# ============================================================\n\
    # CONFIGURATION\n# ============================================================\n\
    RANDOM_STATE = 42\nNUM_AUTHORS = 3\nMODEL_NAME = \"microsoft/deberta-v3-large\"\
    \nMAX_LENGTH = 512\nBATCH_SIZE = 16\nLEARNING_RATE = 2e-5\nWEIGHT_DECAY = 0.01\n\
    NUM_EPOCHS = 40\nWARMUP_RATIO = 0.1\nPATIENCE = 5\nDROPOUT = 0.2\n\nnp.random.seed(RANDOM_STATE)\n\
    torch.manual_seed(RANDOM_STATE)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed_all(RANDOM_STATE)\n\
    \ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\
    print(f\"Using device: {device}\")\n\n# ============================================================\n\
    # DATA LOADING\n# ============================================================\n\
    print(\"=\" * 60)\nprint(\"LOADING DATA\")\nprint(\"=\" * 60)\n\ntrain_df = pd.read_csv(TRAIN_CSV)\n\
    test_df = pd.read_csv(TEST_CSV)\nprint(f\"Train shape: {train_df.shape}, Test\
    \ shape: {test_df.shape}\")\n\nlabel_encoder = LabelEncoder()\ny_train_full =\
    \ label_encoder.fit_transform(train_df[\"author\"])\nprint(f\"Label encoding:\
    \ {dict(zip(label_encoder.classes_, range(len(label_encoder.classes_))))}\")\n\
    \n# ============================================================\n# STRATIFIED\
    \ SPLIT\n# ============================================================\nX_train_texts,\
    \ X_val_texts, y_train_labels, y_val_labels = train_test_split(\n    train_df[\"\
    text\"].values, y_train_full, test_size=0.1,\n    random_state=RANDOM_STATE, stratify=y_train_full,\n\
    )\nprint(f\"Training samples: {len(X_train_texts)}, Validation samples: {len(X_val_texts)},\
    \ Test samples: {len(test_df)}\")\n\n\n\n# ============================================================\n\
    # HANDCRAFTED FEATURES (implement functions to produce these variables)\n# ===========================================================\n\
    # [IMPORTANT] Implement the following 3 feature extraction functions.\n# Each\
    \ takes a list/array of text strings and returns np.array of shape (n_samples,\
    \ n_features).\n# Feature details:\n#   - extract_stylometric_features(texts)\
    \ -> (n, 30): text_len, word_count, sent_count,\n#     avg_word_len, avg_sent_len,\
    \ char ratios (upper/lower/digit/whitespace), 12 punctuation ratios,\n#     char_diversity,\
    \ long_words, capitalized, all_caps, sent_len_std, sent_len_var,\n#     function_word_ratio,\
    \ archaic_ratio, emotional_ratio, lovecraft_ratio, sub_conj_ratio\n#   - create_readability_features(texts)\
    \ -> (n, 4): flesch_reading_ease, ARI, avg_syllables, complex_word_ratio\n#  \
    \ - create_pos_tag_approximation(texts) -> (n, 5): noun/verb/adj/adv suffix ratios,\
    \ content_word_ratio\n\ntrain_stylo = extract_stylometric_features(X_train_texts)\n\
    val_stylo = extract_stylometric_features(X_val_texts)\ntest_stylo = extract_stylometric_features(test_df['text'].values)\n\
    \nstylo_scaler = StandardScaler()\ntrain_stylo_scaled = stylo_scaler.fit_transform(train_stylo)\n\
    val_stylo_scaled = stylo_scaler.transform(val_stylo)\ntest_stylo_scaled = stylo_scaler.transform(test_stylo)\n\
    \nvariance_selector = VarianceThreshold(threshold=0.001)\ntrain_stylo_filtered\
    \ = variance_selector.fit_transform(train_stylo_scaled)\nval_stylo_filtered =\
    \ variance_selector.transform(val_stylo_scaled)\ntest_stylo_filtered = variance_selector.transform(test_stylo_scaled)\n\
    \ntrain_read = create_readability_features(X_train_texts)\nval_read = create_readability_features(X_val_texts)\n\
    test_read = create_readability_features(test_df['text'].values)\n\nread_scaler\
    \ = StandardScaler()\ntrain_read_scaled = read_scaler.fit_transform(train_read)\n\
    val_read_scaled = read_scaler.transform(val_read)\ntest_read_scaled = read_scaler.transform(test_read)\n\
    \ntrain_pos = create_pos_tag_approximation(X_train_texts)\nval_pos = create_pos_tag_approximation(X_val_texts)\n\
    test_pos = create_pos_tag_approximation(test_df['text'].values)\n\npos_scaler\
    \ = StandardScaler()\ntrain_pos_scaled = pos_scaler.fit_transform(train_pos)\n\
    val_pos_scaled = pos_scaler.transform(val_pos)\ntest_pos_scaled = pos_scaler.transform(test_pos)\n\
    \n\n# ============================================================\n# CHARACTER\
    \ & WORD N-GRAM + PUNCTUATION FEATURES\n# ============================================================\n\
    print(\"Extracting n-gram features...\")\nchar_vectorizer_short = TfidfVectorizer(analyzer=\"\
    char\", ngram_range=(2, 4), max_features=3000, sublinear_tf=True, norm=\"l2\"\
    , use_idf=True)\ntrain_char_short = char_vectorizer_short.fit_transform(X_train_texts)\n\
    val_char_short = char_vectorizer_short.transform(X_val_texts)\ntest_char_short\
    \ = char_vectorizer_short.transform(test_df[\"text\"].values)\n\nchar_vectorizer_med\
    \ = TfidfVectorizer(analyzer=\"char\", ngram_range=(4, 6), max_features=3000,\
    \ sublinear_tf=True, norm=\"l2\", use_idf=True)\ntrain_char_med = char_vectorizer_med.fit_transform(X_train_texts)\n\
    val_char_med = char_vectorizer_med.transform(X_val_texts)\ntest_char_med = char_vectorizer_med.transform(test_df[\"\
    text\"].values)\n\nchar_vectorizer_long = TfidfVectorizer(analyzer=\"char\", ngram_range=(5,\
    \ 7), max_features=2000, sublinear_tf=True, norm=\"l2\", use_idf=True)\ntrain_char_long\
    \ = char_vectorizer_long.fit_transform(X_train_texts)\nval_char_long = char_vectorizer_long.transform(X_val_texts)\n\
    test_char_long = char_vectorizer_long.transform(test_df[\"text\"].values)\n\n\
    word_vectorizer = TfidfVectorizer(analyzer=\"word\", ngram_range=(1, 3), max_features=5000,\
    \ sublinear_tf=True, norm=\"l2\", use_idf=True, min_df=3, max_df=0.85)\ntrain_word\
    \ = word_vectorizer.fit_transform(X_train_texts)\nval_word = word_vectorizer.transform(X_val_texts)\n\
    test_word = word_vectorizer.transform(test_df[\"text\"].values)\n\ndef extract_punctuation_sequence(text):\n\
    \    return \"\".join([c for c in text if c in string.punctuation]) if text else\
    \ \"\"\n\nall_texts_for_punct = np.concatenate([X_train_texts, X_val_texts, test_df[\"\
    text\"].values])\npunct_sequences = [extract_punctuation_sequence(str(t)) for\
    \ t in all_texts_for_punct]\npunct_vectorizer = CountVectorizer(analyzer=\"char\"\
    , ngram_range=(2, 4), max_features=500, min_df=2)\npunct_features_all = punct_vectorizer.fit_transform(punct_sequences)\n\
    \nn_train = len(X_train_texts)\nn_val = len(X_val_texts)\ntrain_punct = punct_features_all[:n_train]\n\
    val_punct = punct_features_all[n_train:n_train + n_val]\ntest_punct = punct_features_all[n_train\
    \ + n_val:]\n\ntrain_sparse = hstack([train_char_short, train_char_med, train_char_long,\
    \ train_word, train_punct]).tocsr()\nval_sparse = hstack([val_char_short, val_char_med,\
    \ val_char_long, val_word, val_punct]).tocsr()\ntest_sparse = hstack([test_char_short,\
    \ test_char_med, test_char_long, test_word, test_punct]).tocsr()\nprint(f\"Sparse\
    \ train shape: {train_sparse.shape}\")\n\n# ============================================================\n\
    # DEBERTA FINE-TUNING\n# ============================================================\n\
    print(\"\\n\" + \"=\" * 60)\nprint(\"FINE-TUNING DEBERTA-V3-LARGE\")\nprint(\"\
    =\" * 60)\n\ntokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)\nmodel = AutoModelForSequenceClassification.from_pretrained(\n\
    \    MODEL_NAME, num_labels=NUM_AUTHORS,\n    hidden_dropout_prob=DROPOUT, attention_probs_dropout_prob=DROPOUT,\n\
    )\nmodel.to(device)\n\ntrain_encodings = tokenizer(list(X_train_texts), truncation=True,\
    \ padding=True, max_length=MAX_LENGTH, return_tensors=\"pt\")\nval_encodings =\
    \ tokenizer(list(X_val_texts), truncation=True, padding=True, max_length=MAX_LENGTH,\
    \ return_tensors=\"pt\")\ntest_encodings = tokenizer(list(test_df[\"text\"].values),\
    \ truncation=True, padding=True, max_length=MAX_LENGTH, return_tensors=\"pt\"\
    )\n\ntrain_dataset = TensorDataset(train_encodings[\"input_ids\"], train_encodings[\"\
    attention_mask\"], torch.tensor(y_train_labels, dtype=torch.long))\nval_dataset\
    \ = TensorDataset(val_encodings[\"input_ids\"], val_encodings[\"attention_mask\"\
    ], torch.tensor(y_val_labels, dtype=torch.long))\ntest_dataset = TensorDataset(test_encodings[\"\
    input_ids\"], test_encodings[\"attention_mask\"])\n\ntrain_loader = DataLoader(train_dataset,\
    \ batch_size=BATCH_SIZE, shuffle=True, num_workers=2, pin_memory=True)\nval_loader\
    \ = DataLoader(val_dataset, batch_size=BATCH_SIZE * 2, shuffle=False, num_workers=2,\
    \ pin_memory=True)\ntest_loader = DataLoader(test_dataset, batch_size=BATCH_SIZE\
    \ * 2, shuffle=False, num_workers=2, pin_memory=True)\n\ntotal_steps = len(train_loader)\
    \ * NUM_EPOCHS\nno_decay = [\"bias\", \"LayerNorm.weight\"]\noptimizer_grouped_parameters\
    \ = [\n    {\"params\": [p for n, p in model.named_parameters() if not any(nd\
    \ in n for nd in no_decay)], \"weight_decay\": WEIGHT_DECAY},\n    {\"params\"\
    : [p for n, p in model.named_parameters() if any(nd in n for nd in no_decay)],\
    \ \"weight_decay\": 0.0},\n]\noptimizer = AdamW(optimizer_grouped_parameters,\
    \ lr=LEARNING_RATE, eps=1e-8)\nscheduler = get_linear_schedule_with_warmup(optimizer,\
    \ num_warmup_steps=int(WARMUP_RATIO * total_steps), num_training_steps=total_steps)\n\
    \ncriterion = nn.CrossEntropyLoss(label_smoothing=0.1)\nscaler = GradScaler()\
    \ if torch.cuda.is_available() else None\n\n\ndef compute_log_loss(y_true, y_pred_proba):\n\
    \    eps = 1e-15\n    y_pred_proba = np.clip(y_pred_proba, eps, 1 - eps)\n   \
    \ row_sums = y_pred_proba.sum(axis=1, keepdims=True)\n    y_pred_proba = y_pred_proba\
    \ / row_sums\n    y_pred_proba = np.clip(y_pred_proba, eps, 1 - eps)\n    n =\
    \ y_true.shape[0]\n    loss = 0.0\n    for i in range(n):\n        for j in range(NUM_AUTHORS):\n\
    \            if y_true[i] == j:\n                loss -= np.log(y_pred_proba[i,\
    \ j])\n    return loss / n\n\n\ndef evaluate_deberta(model, loader):\n    model.eval()\n\
    \    all_preds = []\n    all_labels = []\n    with torch.no_grad():\n        for\
    \ batch in loader:\n            input_ids = batch[0].to(device)\n            attention_mask\
    \ = batch[1].to(device)\n            labels = batch[2].to(device)\n          \
    \  with autocast():\n                outputs = model(input_ids=input_ids, attention_mask=attention_mask)\n\
    \                probs = torch.softmax(outputs.logits, dim=1)\n            all_preds.append(probs.cpu().numpy())\n\
    \            all_labels.append(labels.cpu().numpy())\n    all_preds = np.vstack(all_preds)\n\
    \    all_labels = np.concatenate(all_labels)\n    logloss = compute_log_loss(all_labels,\
    \ all_preds)\n    acc = np.mean(np.argmax(all_preds, axis=1) == all_labels)\n\
    \    return logloss, acc, all_preds\n\n\nbest_val_loss = float(\"inf\")\nbest_epoch\
    \ = 0\npatience_counter = 0\n\nfor epoch in range(NUM_EPOCHS):\n    model.train()\n\
    \    total_loss = 0.0\n    num_batches = 0\n    for batch in train_loader:\n \
    \       input_ids = batch[0].to(device)\n        attention_mask = batch[1].to(device)\n\
    \        labels = batch[2].to(device)\n        optimizer.zero_grad()\n       \
    \ with autocast():\n            outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ labels=labels)\n            loss = outputs.loss\n        if scaler is not None:\n\
    \            scaler.scale(loss).backward()\n            scaler.unscale_(optimizer)\n\
    \            torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\n\
    \            scaler.step(optimizer)\n            scaler.update()\n        else:\n\
    \            loss.backward()\n            torch.nn.utils.clip_grad_norm_(model.parameters(),\
    \ max_norm=1.0)\n            optimizer.step()\n        scheduler.step()\n    \
    \    total_loss += loss.item()\n        num_batches += 1\n    avg_train_loss =\
    \ total_loss / num_batches\n    val_loss, val_acc, _ = evaluate_deberta(model,\
    \ val_loader)\n    print(f\"Epoch {epoch+1:2d}/{NUM_EPOCHS} | Train Loss: {avg_train_loss:.4f}\
    \ | Val Loss: {val_loss:.4f} | Val Acc: {val_acc:.4f}\")\n    if val_loss < best_val_loss:\n\
    \        best_val_loss = val_loss\n        best_epoch = epoch + 1\n        patience_counter\
    \ = 0\n        torch.save(model.state_dict(), f\"{WORKING_DIR}/best_deberta_model.pt\"\
    )\n    else:\n        patience_counter += 1\n        if patience_counter >= PATIENCE:\n\
    \            print(f\"Early stopping at epoch {epoch+1}. Best epoch: {best_epoch},\
    \ Best val loss: {best_val_loss:.4f}\")\n            break\n\nprint(f\"\\nBest\
    \ DeBERTa model: epoch {best_epoch}, val loss: {best_val_loss:.4f}\")\nmodel.load_state_dict(torch.load(f\"\
    {WORKING_DIR}/best_deberta_model.pt\", map_location=device))\n\n# ============================================================\n\
    # EXTRACT DEBERTA EMBEDDINGS\n# ============================================================\n\
    print(\"\\nExtracting DeBERTa embeddings...\")\n\n\ndef extract_embeddings(model,\
    \ loader):\n    model.eval()\n    all_embeddings = []\n    with torch.no_grad():\n\
    \        for batch in loader:\n            input_ids = batch[0].to(device)\n \
    \           attention_mask = batch[1].to(device)\n            with autocast():\n\
    \                outputs = model(input_ids=input_ids, attention_mask=attention_mask,\
    \ output_hidden_states=True)\n                hidden_states = outputs.hidden_states[-1]\n\
    \                cls_embeddings = hidden_states[:, 0, :].cpu().numpy()\n     \
    \       all_embeddings.append(cls_embeddings)\n    return np.vstack(all_embeddings)\n\
    \n\ntrain_loader_no_labels = DataLoader(TensorDataset(train_encodings[\"input_ids\"\
    ], train_encodings[\"attention_mask\"]), batch_size=BATCH_SIZE * 2, shuffle=False,\
    \ num_workers=2, pin_memory=True)\nval_loader_no_labels = DataLoader(TensorDataset(val_encodings[\"\
    input_ids\"], val_encodings[\"attention_mask\"]), batch_size=BATCH_SIZE * 2, shuffle=False,\
    \ num_workers=2, pin_memory=True)\ntest_loader_no_labels = DataLoader(TensorDataset(test_encodings[\"\
    input_ids\"], test_encodings[\"attention_mask\"]), batch_size=BATCH_SIZE * 2,\
    \ shuffle=False, num_workers=2, pin_memory=True)\n\ntrain_embeddings = extract_embeddings(model,\
    \ train_loader_no_labels)\nval_embeddings = extract_embeddings(model, val_loader_no_labels)\n\
    test_embeddings = extract_embeddings(model, test_loader_no_labels)\nprint(f\"\
    Train embeddings: {train_embeddings.shape}, Val: {val_embeddings.shape}, Test:\
    \ {test_embeddings.shape}\")\n\n# ============================================================\n\
    # XGBOOST\n# ============================================================\nprint(\"\
    \\nTraining XGBoost classifier...\")\nxgb_train_features = np.hstack([train_stylo_filtered,\
    \ train_read_scaled, train_pos_scaled, train_embeddings])\nxgb_val_features =\
    \ np.hstack([val_stylo_filtered, val_read_scaled, val_pos_scaled, val_embeddings])\n\
    xgb_test_features = np.hstack([test_stylo_filtered, test_read_scaled, test_pos_scaled,\
    \ test_embeddings])\nprint(f\"XGBoost train features: {xgb_train_features.shape}\"\
    )\n\nxgb_model = xgb.XGBClassifier(\n    n_estimators=500, max_depth=8, learning_rate=0.05,\
    \ subsample=0.8,\n    colsample_bytree=0.8, min_child_weight=3, gamma=0.1, reg_alpha=0.1,\n\
    \    reg_lambda=0.1, objective=\"multi:softprob\", num_class=NUM_AUTHORS,\n  \
    \  eval_metric=\"mlogloss\", early_stopping_rounds=30, random_state=RANDOM_STATE,\n\
    \    n_jobs=-1, verbosity=0,\n)\nxgb_model.fit(xgb_train_features, y_train_labels,\
    \ eval_set=[(xgb_val_features, y_val_labels)], verbose=False)\n\nxgb_val_probs\
    \ = xgb_model.predict_proba(xgb_val_features)\nxgb_test_probs = xgb_model.predict_proba(xgb_test_features)\n\
    print(f\"XGBoost validation log loss: {compute_log_loss(y_val_labels, xgb_val_probs):.4f}\"\
    )\n\n# ============================================================\n# LOGISTIC\
    \ REGRESSION\n# ============================================================\n\
    print(\"\\nTraining Logistic Regression...\")\nlr_model = LogisticRegression(C=1.0,\
    \ penalty=\"l2\", solver=\"saga\", max_iter=1000, multi_class=\"multinomial\"\
    , n_jobs=-1, random_state=RANDOM_STATE, verbose=0)\nlr_model.fit(train_sparse,\
    \ y_train_labels)\n\nlr_val_probs = lr_model.predict_proba(val_sparse)\nlr_test_probs\
    \ = lr_model.predict_proba(test_sparse)\nprint(f\"Logistic Regression validation\
    \ log loss: {compute_log_loss(y_val_labels, lr_val_probs):.4f}\")\n\n# ============================================================\n\
    # DEBERTA VALIDATION & TEST PROBS\n# ============================================================\n\
    print(\"\\nGetting DeBERTa probabilities...\")\nval_loader_eval = DataLoader(TensorDataset(val_encodings[\"\
    input_ids\"], val_encodings[\"attention_mask\"], torch.tensor(y_val_labels, dtype=torch.long)),\
    \ batch_size=BATCH_SIZE * 2, shuffle=False, num_workers=2, pin_memory=True)\n\
    _, deberta_val_loss, deberta_val_probs = evaluate_deberta(model, val_loader_eval)\n\
    print(f\"DeBERTa validation log loss: {deberta_val_loss:.4f}\")\n\ntest_loader_eval\
    \ = DataLoader(TensorDataset(test_encodings[\"input_ids\"], test_encodings[\"\
    attention_mask\"]), batch_size=BATCH_SIZE * 2, shuffle=False, num_workers=2, pin_memory=True)\n\
    model.eval()\nall_test_probs = []\nwith torch.no_grad():\n    for batch in test_loader_eval:\n\
    \        input_ids = batch[0].to(device)\n        attention_mask = batch[1].to(device)\n\
    \        with autocast():\n            outputs = model(input_ids=input_ids, attention_mask=attention_mask)\n\
    \            probs = torch.softmax(outputs.logits, dim=1)\n        all_test_probs.append(probs.cpu().numpy())\n\
    deberta_test_probs = np.vstack(all_test_probs)\n\n# ============================================================\n\
    # ENSEMBLE WEIGHT OPTIMIZATION\n# ============================================================\n\
    print(\"\\nOptimizing ensemble weights...\")\nval_probas = {\"deberta\": deberta_val_probs,\
    \ \"xgboost\": xgb_val_probs, \"lr\": lr_val_probs}\n\nbest_ll = float(\"inf\"\
    )\nbest_weights = None\nfor w1 in np.arange(0.1, 0.9, 0.05):\n    for w2 in np.arange(0.1,\
    \ 0.9, 0.05):\n        w3 = 1.0 - w1 - w2\n        if w3 < 0.05 or w3 > 0.9:\n\
    \            continue\n        ensemble_proba = w1 * val_probas[\"deberta\"] +\
    \ w2 * val_probas[\"xgboost\"] + w3 * val_probas[\"lr\"]\n        ll = compute_log_loss(y_val_labels,\
    \ ensemble_proba)\n        if ll < best_ll:\n            best_ll = ll\n      \
    \      best_weights = {\"deberta\": w1, \"xgboost\": w2, \"lr\": w3}\n\nprint(f\"\
    Optimized ensemble weights: {best_weights}\")\nprint(f\"Ensemble validation log\
    \ loss: {best_ll:.4f}\")\n\n# ============================================================\n\
    # GENERATE SUBMISSION\n# ============================================================\n\
    test_probas = {\"deberta\": deberta_test_probs, \"xgboost\": xgb_test_probs, \"\
    lr\": lr_test_probs}\nensemble_test_probs = (\n    best_weights[\"deberta\"] *\
    \ test_probas[\"deberta\"]\n    + best_weights[\"xgboost\"] * test_probas[\"xgboost\"\
    ]\n    + best_weights[\"lr\"] * test_probas[\"lr\"]\n)\n\neps = 1e-15\nensemble_test_probs\
    \ = np.clip(ensemble_test_probs, eps, 1 - eps)\nrow_sums = ensemble_test_probs.sum(axis=1,\
    \ keepdims=True)\nensemble_test_probs = ensemble_test_probs / row_sums\nensemble_test_probs\
    \ = np.clip(ensemble_test_probs, eps, 1 - eps)\n\nsubmission_df = pd.DataFrame({\n\
    \    \"id\": test_df[\"id\"].values,\n    \"EAP\": ensemble_test_probs[:, 0],\n\
    \    \"HPL\": ensemble_test_probs[:, 1],\n    \"MWS\": ensemble_test_probs[:,\
    \ 2],\n})\n\nsubmission_df.to_csv(OUTPUT_CSV, index=False)\nprint(f\"\\nSubmission\
    \ saved to {OUTPUT_CSV}\")\nprint(f\"Submission shape: {submission_df.shape}\"\
    )\nprint(submission_df.head())\nprint(f\"\\nFinal Validation Score: {best_ll:.6f}\"\
    )\n\ngc.collect()\nif torch.cuda.is_available():\n    torch.cuda.empty_cache()\n\
    \n```\n\n---\n## Methodology Insights from Literature\nThe following detailed\
    \ techniques from recent papers are relevant to this task:\n\n### [manual-2024/bert-authorship-attribution]\n\
    \n# Fine-tuning BERT with a Classification Head Outperforms Traditional ML for\
    \ Authorship Attribution\n\nAcross five independent studies spanning literary,\
    \ email, blog, social media, and learner corpora in both English and Japanese,\
    \ fine-tuning a pre-trained BERT model with a task-specific classification head\
    \ (dense layer + softmax or MLP) consistently achieves state-of-the-art or near-SOTA\
    \ results for authorship attribution, substantially outperforming traditional\
    \ machine learning baselines (SVM, Random Forest, Logistic Regression, TF-IDF,\
    \ stylometric features).\n\n**Specific architectures and results:**\n- **BertAA**\
    \ (Fabien et al.): Fine-tuned `bert-base-cased` with a dense layer + softmax.\
    \ Achieved up to 5.3% relative accuracy improvement over prior SOTA. On Blog Authorship:\
    \ 65.4% (10 authors), 59.7% (50 authors). On IMDb62: 93.0% accuracy at 10 epochs.\
    \ Outperformed TF-IDF baseline by 14.3% relative accuracy on average.\n- **Japanese\
    \ BERT** (cl-tohoku/bert-large-japanese-v2): Fine-tuned with a classification\
    \ layer. Achieved 84% accuracy for 5 authors, 82% for 80 authors, and 97% for\
    \ binary Japanese-speaker classification.\n- **S-BERT + MLP** (IEEE ICACT 2025):\
    \ Fine-tuned Sentence-BERT with a lightweight MLP classifier (60 epochs, Adam,\
    \ LR=2e-5, batch size=1024, dropout=0.1). Achieved 90% accuracy and 0.84 F1 on\
    \ a 15,000-sample corpus (Gutenberg + Twitter + Stack Overflow). Traditional ML\
    \ baselines (SVM, Decision Trees, Random Forest, Logistic Regression) maxed out\
    \ at 64% accuracy.\n- **Frontiers** (Japanese literary): Fine-tuned multiple BERT\
    \ variants (AozoraBERT, TohokuBERT, DeBERTa) with a classification head. AozoraWikiBERT\
    \ achieved F1=0.970 on Corpus A. DeBERTa achieved F1=0.823 on Corpus B.\n- **ACL2023**\
    \ (GAN-BERT): Fine-tuned BERT within a GAN framework with N+1 class discriminator.\
    \ Achieved >0.88 accuracy and F1 on 19th-century novels.\n\n**Traditional ML baselines\
    \ consistently underperform:**\n- Stylometric features: as low as 0.14 accuracy\
    \ on IMDB20 (ACL2023)\n- Character n-grams: 0.69 accuracy on IMDB20 (ACL2023)\n\
    - Word-level TF-IDF: 0.97 on IMDB20 but only 0.47 on Blog20 (ACL2023)\n- SVM,\
    \ Decision Trees, Random Forest, Logistic Regression: max 64% accuracy (sbert_ieee2025)\n\
    \n\n## Actionable Guidance\nUse a pre-trained BERT model (bert-base-cased for\
    \ English, cl-tohoku/bert-large-japanese-v2 for Japanese, or domain-specific variants)\
    \ fine-tuned with a dense layer + softmax (or MLP) classifier. Train for extended\
    \ epochs (10-60) with early stopping. This approach consistently outperforms traditional\
    \ ML (SVM, RF, TF-IDF, stylometric features) by substantial margins (14-26+ percentage\
    \ points).\n\n**Condition**: When labeled training data is available (at least\
    \ ~5 texts per author, preferably more) and texts are of moderate length (up to\
    \ 512 tokens for BERT-based models).\n**Confidence**: HIGH — Supported by 5 independent\
    \ studies across English and Japanese, literary and non-literary domains, with\
    \ consistent results.\n\n---\n\n# Stratified Data Splitting is Essential for Reliable\
    \ AA Evaluation\n\nFour independent studies independently adopted stratified data\
    \ splitting to maintain proportional author representation across training, validation,\
    \ and test sets. This is particularly critical for authorship attribution where\
    \ class imbalance is common (authors have varying numbers of texts) and where\
    \ small sample sizes amplify the risk of biased splits.\n\n**Specific splitting\
    \ strategies used:**\n- **ACL2023** (GAN-BERT): 80% train, 10% test, 10% validation,\
    \ stratified by author IDs. \"The stratified split in the train-test-validation\
    \ ensured a uniform distribution of novels per author, and the test data are distinct\
    \ from the training data.\"\n- **BertAA** (Fabien et al.): 80% train, 20% test,\
    \ stratified to maintain equal class proportions. \"kept 20% of test data using\
    \ a stratified approach, meaning that the proportions of each class are kept equal\
    \ in the training and testing set.\"\n- **Frontiers** (Japanese literary): Stratified\
    \ 5-fold cross-validation due to small sample size (200 works, 20 per author).\
    \ \"Owing to the small sample size of our data, random division may bias the balance\
    \ of class labels. Therefore, in this experiment, we used a stratified sampling\
    \ method to divide the dataset into five folds.\"\n- **sbert_ieee2025** (S-BERT):\
    \ 60% train, 20% validation, 20% test, stratified. \"The complete dataset was\
    \ stratified and partitioned into training (60%), validation (20%), and testing\
    \ (20%) subsets, maintaining proportional author representation.\"\n\n**Why stratification\
    \ matters for AA:**\nAuthorship attribution datasets frequently have imbalanced\
    \ author representation (e.g., Japanese BERT dataset: mean ~16 texts/author, max\
    \ 68, min 5). Without stratification, a random split could accidentally place\
    \ all texts from a minority author into the test set, making evaluation unreliable.\
    \ The ACL2023 study explicitly notes that manual author selection introduces bias,\
    \ and random sampling of author combinations (50-100 samples per n-author case)\
    \ was used to mitigate this.\n\n\n## Actionable Guidance\nAlways use stratified\
    \ splitting (by author ID) when partitioning AA datasets. For standard-sized datasets,\
    \ use 80:10:10 or 80:20 train-test splits. For small datasets (<500 texts total),\
    \ use stratified k-fold cross-validation (k=5). This prevents evaluation bias\
    \ from imbalanced author representation.\n\n**Condition**: All AA experiments\
    \ with multiple authors where text counts per author vary.\n**Confidence**: HIGH\
    \ — 4 papers independently adopt this practice with explicit motivation.\n\n---\n\
    \n# Domain-Specific Pre-training Significantly Improves AA Performance\n\nUsing\
    \ BERT models pre-trained on domain-relevant corpora (rather than general Wikipedia/BookCorpus)\
    \ substantially improves authorship attribution accuracy, especially when the\
    \ target texts share the same domain, language, or text type as the pre-training\
    \ data.\n\n**Specific evidence from three studies:**\n\n**Frontiers (Japanese\
    \ literary AA):** Directly compared BERT models pre-trained on different corpora:\n\
    - **AozoraBERT** (pre-trained on Japanese literary works from Aozora Bunko): F1=0.969\
    \ on Corpus A (literary works overlapping with pre-training data)\n- **TohokuBERT**\
    \ (pre-trained only on Japanese Wikipedia): F1=0.642 on Corpus A — **32.7 points\
    \ lower**\n- **AozoraWikiBERT** (pre-trained on both Wikipedia + Aozora Bunko):\
    \ F1=0.970 on Corpus A — highest individual score\n- **StockMarkBERT** (pre-trained\
    \ on Japanese news articles): F1=0.600 on Corpus A — lowest individual score\n\
    - \"The F1 scores of both models [AozoraBERT, AozoraWikiBERT] were more than 30\
    \ points higher than that of Model T, which was trained using only Wikipedia.\"\
    \n- However, on Corpus B (not in any pre-training data), DeBERTa achieved the\
    \ highest F1 (0.823), suggesting that when domain match is absent, architecture\
    \ matters more.\n\n**Japanese BERT (Learner corpus AA):** Used `cl-tohoku/bert-large-japanese-v2`,\
    \ a Japanese-specific BERT model pre-trained on Japanese Wikipedia and CC-100,\
    \ rather than a multilingual BERT. This enabled effective fine-tuning for Japanese\
    \ text, achieving 84% accuracy for 5 authors and 97% for binary native-speaker\
    \ classification.\n\n**sbert_ieee2025 (Multi-domain AA):** Used Sentence-BERT\
    \ (SBERT), which is pre-trained on a diverse corpus of sentence pairs, and further\
    \ fine-tuned it on a multi-domain corpus (Gutenberg + Twitter + Stack Overflow).\
    \ The inclusion of contemporary digital texts (Twitter, Stack Overflow) alongside\
    \ classical literature improved generalizability: \"This inclusion enabled the\
    \ model to capture informal, conversational, and modern digital language patterns,\
    \ thereby improving its generalizability.\"\n\n\n## Actionable Guidance\nSelect\
    \ a BERT model pre-trained on data matching your target domain. For literary AA,\
    \ use a model pre-trained on literary corpora (e.g., AozoraBERT for Japanese literature).\
    \ For language-specific AA, use a monolingual BERT (e.g., cl-tohoku/bert-large-japanese-v2\
    \ for Japanese). For multi-domain AA, augment training data with diverse text\
    \ types. Expect 20-30+ point F1 improvements from domain-matched pre-training\
    \ when the target domain is well-covered.\n\n**Condition**: When the target text\
    \ domain is specific (literary, news, social media) and a domain-matched pre-trained\
    \ BERT is available.\n**Confidence**: HIGH — Frontiers provides direct head-to-head\
    \ comparisons with 30+ point deltas; Japanese BERT and sbert_ieee2025 provide\
    \ supporting evidence.\n\n---\n\n# BERT Alone (Without Handcrafted Features) is\
    \ Often Sufficient or Superior for AA\n\nThree studies independently found that\
    \ using BERT with only raw text input (no handcrafted stylometric features) achieves\
    \ strong or superior performance for authorship attribution. Adding handcrafted\
    \ features can actually degrade performance, particularly when features are concatenated\
    \ into the BERT architecture rather than combined at the decision level.\n\n**Specific\
    \ evidence:**\n\n**BertAA** (Fabien et al.): The core BertAA model uses only fine-tuned\
    \ BERT with a dense layer + softmax, without any stylometric or hybrid features.\
    \ This BERT-only approach \"outperforms the TF-IDF and LR benchmark on all experiments,\
    \ with an average relative accuracy gain of 14.3%.\" The stylometric and hybrid\
    \ features were added only as an optional ensemble extension (not integrated into\
    \ BERT itself).\n\n**Japanese BERT** (Learner corpus): Directly compared BERT-only\
    \ (text input) vs. BERT with concatenated stylometric features (content word rates,\
    \ POS bigrams, particle bigrams, comma placement). Results:\n- BERT-only: 84%\
    \ accuracy for 5 authors\n- BERT + stylometric features: 53% accuracy for 25 authors\
    \ — **drastic degradation**\n- The paper states: \"Directly fine-tuning BERT with\
    \ stylometric features might have been one reason for the low accuracy... extremely\
    \ low accuracy was consistently observed across all patterns.\"\n\n**sbert_ieee2025**\
    \ (S-BERT + MLP): Used only Sentence-BERT embeddings fed into an MLP classifier,\
    \ with no handcrafted features. Achieved 90% accuracy. The paper explicitly notes:\
    \ \"Unlike traditional text classification tasks, we did not remove stopwords\
    \ or infrequent tokens, as these elements may contain stylistic information important\
    \ for identifying an author.\" — The BERT model itself captures stylistic information\
    \ from raw text.\n\n**Contrast with successful feature integration:** BertAA and\
    \ Frontiers both successfully combined BERT with handcrafted features, but crucially\
    \ at the *decision level* (ensembling probability outputs), not by concatenating\
    \ features into the BERT architecture. The Japanese BERT study's failure suggests\
    \ that feature concatenation disrupts BERT's learned representations.\n\n\n##\
    \ Actionable Guidance\nStart with a BERT-only approach (fine-tuned BERT + classification\
    \ head) before attempting to add handcrafted features. If features are needed,\
    \ combine them at the decision level (ensemble of probability outputs) rather\
    \ than concatenating them into the BERT architecture. Feature concatenation into\
    \ BERT's representation layer is likely to degrade performance.\n\n**Condition**:\
    \ When sufficient training data is available (at least ~10 texts per author) and\
    \ texts are of moderate length (up to 512 tokens).\n**Confidence**: HIGH — Supported\
    \ by 3 papers with Japanese BERT providing direct A/B comparison showing degradation\
    \ from feature concatenation.\n\n---\n\n# Extended Training Epochs Improve AA\
    \ Accuracy Beyond Standard 2-4 Epochs\n\nThree studies found that training BERT-based\
    \ models for substantially more epochs than the typical 2-4 (common for standard\
    \ BERT fine-tuning) yields significant accuracy improvements for authorship attribution,\
    \ especially when the number of authors is large or training data per author is\
    \ limited.\n\n**Specific epoch counts and results:**\n\n**BertAA** (Fabien et\
    \ al.): Systematically varied training epochs from 1 to 10 on IMDb62 (62 authors,\
    \ 1,000 texts/author):\n- 1 epoch: 88.7% accuracy\n- 5 epochs: 92.3% accuracy\n\
    - 10 epochs: 93.0% accuracy\n- Delta: **+4.3 percentage points** from 1 to 10\
    \ epochs\nThe paper notes: \"We then increased the number of training epochs and\
    \ reached 92.3% at 5 epochs, and up to 93.0% at 10 epochs.\"\n\n**Frontiers**\
    \ (Japanese literary AA): Trained all BERT models for 40 epochs with fixed hyperparameters\
    \ (batch size=16, LR=2e-5, AdamW). \"While extensive hyperparameter tuning was\
    \ beyond the scope of this study, preliminary experiments confirmed that the chosen\
    \ configuration (batch size = 16, learning rate = 2 × 10−5, epochs = 40) yielded\
    \ consistent results across all models.\" The 40-epoch training enabled models\
    \ to converge despite small dataset size (200 works).\n\n**sbert_ieee2025** (S-BERT\
    \ + MLP): Trained for 60 epochs with early stopping based on validation accuracy.\
    \ \"We used cross-entropy loss for optimization and employed early stopping based\
    \ on validation accuracy.\" The combination of extended training (60 epochs) with\
    \ early stopping prevented overfitting while allowing full convergence.\n\n**Common\
    \ pattern:** All three studies used early stopping or validation-based monitoring\
    \ alongside extended training, suggesting that the key is allowing sufficient\
    \ training for convergence while preventing overfitting. The optimal epoch count\
    \ varies by dataset size and complexity (10-60 epochs observed).\n\n\n## Actionable\
    \ Guidance\nTrain BERT-based AA models for more epochs than standard BERT fine-tuning\
    \ (10-60 epochs depending on dataset size). Always pair extended training with\
    \ early stopping based on validation accuracy to prevent overfitting. For datasets\
    \ with many authors (50+) and limited data per author, longer training (10+ epochs)\
    \ is particularly beneficial. Monitor validation performance and stop when it\
    \ plateaus.\n\n**Condition**: When fine-tuning BERT for AA with moderate to large\
    \ numbers of authors (10-62+) and sufficient training data.\n**Confidence**: HIGH\
    \ — 3 papers with consistent findings; BertAA provides direct epoch ablation data."
