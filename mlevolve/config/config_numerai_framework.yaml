extends: config_numerai_fixed_holdout.yaml

# Numerai v6 search with the framework-level fixes (no modelling hints):
# - host_selection: a Host-held, label-hidden selection set ranks candidates
#   (multi-window score) instead of the candidate's self-reported metric.
# - component_health: component-level failures inside passing nodes are
#   detected and get one targeted repair child, judged by component health.
# - family_quota: method families missing from the top-k stay expandable.
# - global memory: cross-branch memory, allowed because selection scores are
#   Host-trusted and never touch the lockbox.
# Launch additionally with:
#   host_selection.manifest_path=<split>/selection_view/fixed_holdout_manifest.json
exec:
  nan_metric_stop_after: 3

host_selection:
  enabled: True
  manifest_path: ""
  windows: 4
  objective: mean
  # Rank by 0.5 * CORR + 2 * BMC per era; the agent is not told this.
  score_metric: corr_bmc
  # A node replaces another only if it beats it by more than this many standard
  # errors of the paired per-era difference, resampled in 13-era blocks.
  noise_band_z: 2.0
  noise_band_block: 13
  noise_band_samples: 2000
  # Predictions this close to the benchmark's are closed as copies.
  copy_threshold: 0.999
  # What the agent learns from the Host: "score" shows Host numbers in prompts;
  # "verdict" shows only better / tied / worse than the parent (noise band
  # above) and scrubs any Host number left in a prompt.
  feedback: score
  block_duplicate_code: true

component_health:
  enabled: True
  trivial_score: 0.0
  max_repairs_per_run: 6
  max_repairs_per_branch: 2

family_quota:
  enabled: True
  families: [neural_net, gbdt]
  probability: 0.3

agent:
  use_global_memory: True
  search:
    parallel_search_num: 3
    # A failed improvement is not extended; the branch best is improved again.
    retry_improve_from_local_best: True
    # Two memory kills in a row end a debug chain (each kill costs a full run).
    max_consecutive_memory_errors: 2
    # Each improvement tests one stated hypothesis in a direction scheduled by
    # a UCB bandit over earlier outcomes; the ledger is shown to later attempts.
    research_loop: True
    research_ucb_c: 1.0
    research_ledger_shown: 10

# Public knowledge harvested before the split's last training era, each entry
# with its training-period check. Off by default; enable with the set's path:
#   knowledge.enabled=True knowledge.path=<dir>/knowledge_verified.json
knowledge:
  enabled: False
  path: ""
  stages: [draft, improve]
  max_entries: 4
