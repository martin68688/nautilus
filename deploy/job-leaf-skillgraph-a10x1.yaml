# NRP batch Job — leaf-classification, standard SkillGraph external memory.
# Resources: 1x A10, 4 CPU, 8Gi memory.
#
# A10 nodes expose generic nvidia.com/gpu; pin exact product by node affinity.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-leaf-skillgraph-a10x1
  namespace: ecepxie
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
      containers:
      - name: mlevolve
        image: haomingwang22/mlevolve:v1
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/anaconda3/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          RUN_REPO=/workspace/nautilus-skillgraph-a10x1
          if [ ! -d "$RUN_REPO/.git" ]; then
            if [ -d /workspace/nautilus/.git ]; then
              git clone --no-hardlinks /workspace/nautilus "$RUN_REPO"
            else
              git clone --branch beta2-skillgraph --depth=1 git@github.com:martin68688/nautilus.git "$RUN_REPO"
            fi
          fi

          cd "$RUN_REPO"
          git config --global --add safe.directory "$RUN_REPO"
          rm -f .git/shallow.lock .git/index.lock 2>/dev/null || true
          git fetch origin beta2-skillgraph --depth=1
          git checkout -B beta2-skillgraph origin/beta2-skillgraph
          git reset --hard origin/beta2-skillgraph

          if [ -f /workspace/nautilus/mlevolve/.env ]; then
            cp /workspace/nautilus/mlevolve/.env "$RUN_REPO/mlevolve/.env"
          elif [ -f /workspace/trace2skill-baseline/mlevolve/.env ]; then
            cp /workspace/trace2skill-baseline/mlevolve/.env "$RUN_REPO/mlevolve/.env"
          fi

          cd "$RUN_REPO/mlevolve"
          set -a; . ./.env; set +a
          export DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL

          python run.py \
            exp_id=leaf-classification \
            exp_name=leaf-skillgraph-a10x1 \
            dataset_dir=./data \
            data_dir=/workspace/nautilus/mlevolve/data/leaf-classification/prepared/public \
            desc_file=/workspace/nautilus/mlevolve/data/leaf-classification/prepared/public/description.md \
            agent.use_global_memory=True \
            agent.search.num_gpus=1 \
            agent.search.parallel_search_num=1 \
            cpu_number=4 \
            external_skill_memory.enable=True \
            external_skill_memory.source_name=skillgraph \
            external_skill_memory.graph_path="../paper-skills/distillation/graph_build/graph_optimized_skillgraph.json" \
            adoption_tracking.enable=True \
            adoption_tracking.enable_analysis=True \
            adoption_tracking.judge_mode=keyword
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "8Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: my-storage
          mountPath: /workspace
      volumes:
      - name: my-storage
        persistentVolumeClaim:
          claimName: haoming-storage
