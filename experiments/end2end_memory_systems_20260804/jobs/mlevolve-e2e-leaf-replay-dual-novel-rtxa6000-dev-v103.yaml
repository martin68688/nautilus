apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-replay-dual-novel-rtxa6000-dev-v103
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v103
    mlevolve.ai/workload: mlevolve-e2e-leaf-replay-dual-novel-rtxa6000-dev-v103
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: leaf-replay-plus-two-free-novel-full-online-smoke
    mlevolve.ai/source-git-head: 81cc03e0
spec:
  activeDeadlineSeconds: 21600
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  containers:
    - name: leaf-replay-dual-novel
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      envFrom:
        - secretRef:
            name: prevalence-audit-deepseek-r1
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/rtxa6000: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/rtxa6000: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
