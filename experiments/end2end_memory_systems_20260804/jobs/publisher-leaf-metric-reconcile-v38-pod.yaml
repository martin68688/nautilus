apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-metric-reconcile-publisher-v38
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-agent-v38
    mlevolve.ai/workload: mlevolve-e2e-leaf-metric-reconcile-publisher-v38
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
  annotations:
    mlevolve.ai/purpose: immutable-source-publication-and-test
spec:
  restartPolicy: Never
  containers:
    - name: publisher
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -lc
        - sleep infinity
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
