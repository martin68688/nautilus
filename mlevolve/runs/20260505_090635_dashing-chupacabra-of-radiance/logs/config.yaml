    \ |\n| 7 | Generalization to Unseen Tasks | 2024acl-long796 | MEDIUM | references/unseen-tasks-generalization.md\
    \ |\n| 8 | Generalization to Unseen Languages | 2024acl-long796 | LOW | references/unseen-languages-generalization.md\
