  description: "\nModel1: ModernBERT\n\nDescription:ModernBERT is a modernized bidirectional\
    \ encoder-only Transformer model pre-trained on 2 trillion tokens of English and\
    \ code data. It significantly improves upon the original BERT with extended context\
    \ length to 8k tokens (compared to just 512 for most encoders), making it faster\
    \ and more accurate. The model features architectural innovations including improved\
    \ efficiency enhancements and hardware-aware design. Unlike earlier BERT models,\
    \ ModernBERT does not use token type IDs, simplifying its usage while maintaining\
    \ compatibility as a drop-in replacement for BERT-like models. It excels at various\
    \ NLP tasks including classification, token classification, question answering,\
    \ and masked language modeling.\n\nCode template (MUST copy exactly — do NOT change\
    \ model variant names or file paths):\n```python\nfrom transformers import AutoTokenizer,\
    \ ModernBertForSequenceClassification, ModernBertForMaskedLM, ModernBertForTokenClassification,\
    \ ModernBertForQuestionAnswering, ModernBertForMultipleChoice\nfrom torch.optim\
    \ import AdamW\n\nmodel_id = \"answerdotai/ModernBERT-large\"\ntokenizer = AutoTokenizer.from_pretrained(model_id)\n\
    # Choose one model class according to your task:\n# model = ModernBertForSequenceClassification.from_pretrained(model_id)\
    \  # for classification\n# model = ModernBertForMaskedLM.from_pretrained(model_id)\
    \  # for masked language modeling\n# model = ModernBertForTokenClassification.from_pretrained(model_id)\
    \  # for token classification/NER\n# model = ModernBertForQuestionAnswering.from_pretrained(model_id)\
    \  # for question answering\n# model = ModernBertForMultipleChoice.from_pretrained(model_id)\
    \  # for multiple choice tasks\n\ntext = \"Your input text here\"\nencoded_input\
    \ = tokenizer(text, return_tensors='pt')\n# Note: ModernBERT does not use token_type_ids\
    \ parameter\noutput = model(**encoded_input)\n# Extract features: output.last_hidden_state\
    \ for token-level features, output.pooler_output for sentence-level features\n\
    ```\n\nModel2: DeBERTa-v3-large\n\nDescription:DeBERTa-v3-large is a large-scale\
    \ pretrained language model developed by Microsoft for natural language processing\
    \ tasks. Domain: natural language text. It is designed to handle a wide range\
    \ of language understanding applications, including text classification, sentiment\
    \ analysis, natural language inference, question answering, and sequence labeling.\
    \ The architecture is based on the Transformer encoder with 24 layers, hidden\
    \ size of 1024, 40 attention heads, and approximately 435 million parameters.\
    \ Compared to earlier BERT and RoBERTa models, DeBERTa introduces disentangled\
    \ attention mechanisms, improved mask decoders, and enhanced training efficiency.\
    \ Input: tokenized text sequences of shape (batch_size, seq_len). Output: contextual\
    \ embeddings of shape (batch_size, seq_len, hidden_dim) or classification logits\
    \ when a task-specific head is attached. The model is typically fine-tuned by\
    \ adding a linear classification or regression head on top of the [CLS] embedding\
    \ or pooled features.\n\nCode template (MUST copy exactly — do NOT change model\
    \ variant names or file paths):\n```python\nimport torch\nfrom transformers import\
    \ AutoTokenizer, AutoModelForSequenceClassification\n\n\"\"\"\nDeBERTa-v3-large\
    \ Usage Example\nBase model: microsoft/deberta-v3-large (~435M parameters)\nDomain:\
    \ Natural Language Processing (text classification, NLI, QA, etc.)\nInput: Tokenized\
    \ text sequences\nOutput: Classification logits or hidden embeddings\n\nReference:\
    \ https://huggingface.co/microsoft/deberta-v3-large\n\"\"\"\n\n# Load tokenizer\
    \ and model\ntokenizer = AutoTokenizer.from_pretrained(\"microsoft/deberta-v3-large\"\
    )\nmodel = AutoModelForSequenceClassification.from_pretrained(\"microsoft/deberta-v3-large\"\
    , num_labels=2)\n\n# Prepare input text\ninputs = tokenizer(\"Hello, my dog is\
    \ cute\", return_tensors=\"pt\")\n\n# Inference without gradient computation\n\
    with torch.no_grad():\n    logits = model(**inputs).logits\n\n# Get predicted\
    \ class\npredicted_class_id = logits.argmax().item()\nprint(model.config.id2label[predicted_class_id])\n\
    \n# To train on `num_labels` classes, set num_labels when loading the model\n\
    num_labels = len(model.config.id2label)\nmodel = AutoModelForSequenceClassification.from_pretrained(\"\
    microsoft/deberta-v3-large\", num_labels=num_labels)\n\n# Prepare labels for training\n\
    labels = torch.tensor([1])\n\n# Calculate training loss\nloss = model(**inputs,\
    \ labels=labels).loss\nprint(round(loss.item(), 2))\n\n```"
