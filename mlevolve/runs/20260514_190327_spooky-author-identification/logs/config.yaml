coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: microsoft/deberta-v3-large\n\nDescription:DeBERTa-v3-large\
    \ (435M params) with partial unfreezing (last 8 of 24 layers) + simple Linear\
    \ head + CosineAnnealingWarmRestarts scheduler + label_smoothing=0.1. Proven best\
    \ strategy: Log Loss 0.0725 on Spooky Author Identification (~19K samples). CRITICAL\
    \ RULES: (1) Partial unfreeze last 6-8 layers, NOT full finetuning (full finetuning\
    \ hits ceiling at ~0.26). (2) Use simple Linear head, NOT complex attention/MLP\
    \ heads (complex heads cause gradient noise and overfitting). (3) Use CosineAnnealingWarmRestarts\
    \ + 10% Linear Warmup, NOT no scheduler or simple linear decay. (4) Differentiated\
    \ LR: backbone 2e-5, head 5e-5. (5) Label smoothing 0.1 for small datasets. (6)\
    \ Do NOT use ModernBERT (0.34-0.35), DeBERTa-small/base (0.37), or full freezing\
    \ (0.38). (7) For features: use small feature_proj (150->64), NOT large projection\
    \ layers. (8) For ensemble: use heterogeneous (DeBERTa+XGBoost+LightGBM), NOT\
    \ homogeneous (multiple Transformers). (9) Gradient clipping max_norm=1.0 + AMP\
    \ mixed precision. (10) Probability clip(1e-15,1-1e-15) then row-normalize before\
    \ scoring.\n\nCode template (MUST copy exactly — do NOT change model variant names\
    \ or file paths):\n```python\nimport pandas as pd\nimport numpy as np\nimport\
    \ re\nimport os\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.preprocessing\
    \ import LabelEncoder\nfrom sklearn.metrics import log_loss\nfrom transformers\
    \ import AutoTokenizer, AutoModelForSequenceClassification\nfrom torch import\
    \ nn\nimport torch.nn.functional as F\nimport torch\nfrom torch.utils.data import\
    \ DataLoader, Dataset\nfrom torch.cuda.amp import autocast, GradScaler\nfrom torch.optim\
    \ import AdamW\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# ============================================================\n\
    # DATA LOADING\n# ============================================================\n\
    train_df = pd.read_csv(\"./input/train.csv\")\ntest_df = pd.read_csv(\"./input/test.csv\"\
    )\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\n\nprint(f\"Train\
    \ shape: {train_df.shape}\")\nprint(f\"Test shape: {test_df.shape}\")\n\n\n# Train/Validation\
    \ split (StratifiedKFold, same split as original)\nskf = StratifiedKFold(n_splits=5,\
    \ shuffle=True, random_state=42)\ntrain_idx, val_idx = next(skf.split(train_df,\
    \ train_df[\"author\"]))\n\ntrain_set = train_df.iloc[train_idx].reset_index(drop=True)\n\
    val_set = train_df.iloc[val_idx].reset_index(drop=True)\n\nle = LabelEncoder()\n\
    train_set[\"author\"] = le.fit_transform(train_set[\"author\"])\nval_set[\"author\"\
    ] = le.transform(val_set[\"author\"])\n\nos.makedirs(\"./working\", exist_ok=True)\n\
    \n# ============================================================\n# MODEL DESIGN\
    \ - DeBERTa-v3-large\n# ============================================================\n\
    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\ntokenizer\
    \ = AutoTokenizer.from_pretrained(\"microsoft/deberta-v3-large\")\n\n\nclass SpookyAuthorClassifier(nn.Module):\n\
    \    def __init__(self, num_authors=3, dropout_rate=0.3):\n        super().__init__()\n\
    \        self.backbone = AutoModelForSequenceClassification.from_pretrained(\n\
    \            \"microsoft/deberta-v3-large\",\n            num_labels=num_authors,\n\
    \            output_hidden_states=True,\n            output_attentions=False,\n\
    \            hidden_dropout_prob=dropout_rate,\n            attention_probs_dropout_prob=dropout_rate,\n\
    \        )\n        for param in self.backbone.deberta.parameters():\n       \
    \     param.requires_grad = False\n        for layer in self.backbone.deberta.encoder.layer[-8:]:\n\
    \            for param in layer.parameters():\n                param.requires_grad\
    \ = True\n        hidden_size = self.backbone.config.hidden_size\n        self.head\
    \ = nn.Linear(hidden_size, num_authors)\n\n    def forward(self, input_ids, attention_mask):\n\
    \        outputs = self.backbone.deberta(\n            input_ids=input_ids,\n\
    \            attention_mask=attention_mask,\n            output_hidden_states=True,\n\
    \        )\n        hidden_states = outputs.last_hidden_state\n        cls_pool\
    \ = hidden_states[:, 0, :]\n        logits = self.head(cls_pool)\n        return\
    \ logits\n\n\nmodel = SpookyAuthorClassifier(num_authors=3, dropout_rate=0.3)\n\
    model.to(device)\n\ncriterion = nn.CrossEntropyLoss(label_smoothing=0.1)\n# Collect\
    \ backbone unfrozen params (last 8 layers)\nbackbone_unfrozen_params = []\nfor\
    \ layer in model.backbone.deberta.encoder.layer[-8:]:\n    for name, param in\
    \ layer.named_parameters():\n        if 'bias' not in name and 'LayerNorm' not\
    \ in name:\n            backbone_unfrozen_params.append(param)\n\n# Collect head\
    \ params (only the new single linear layer)\nhead_params = list(model.head.parameters())\n\
    \noptimizer = AdamW(\n    [\n        {\"params\": backbone_unfrozen_params, \"\
    lr\": 2e-5, \"weight_decay\": 0.01, \"betas\": (0.9, 0.999)},\n        {\"params\"\
    : head_params, \"lr\": 5e-5, \"weight_decay\": 0.01, \"betas\": (0.9, 0.98)},\n\
    \    ],\n    weight_decay=0.01,\n    betas=(0.9, 0.999),\n)\n\n# Ensure optimizer\
    \ param groups are correctly ordered\n# Group 0: backbone unfrozen layers (lr=2e-5)\n\
    # Group 1: head (lr=5e-5)\n\nprint(f\"Backbone unfrozen params: {sum(p.numel()\
    \ for p in backbone_unfrozen_params):,}\")\nprint(f\"Head params: {sum(p.numel()\
    \ for p in head_params):,}\")\n\nprint(f\"Model parameters: {sum(p.numel() for\
    \ p in model.parameters()):,}\")\n\n\n# ============================================================\n\
    # DATASET AND DATALOADER\n# ============================================================\n\
    class SpookyDataset(Dataset):\n    def __init__(self, texts, labels=None, tokenizer=None,\
    \ max_length=512):\n        self.texts = texts\n        self.labels = labels\n\
    \        self.tokenizer = tokenizer\n        self.max_length = max_length\n\n\
    \    def __len__(self):\n        return len(self.texts)\n\n    def __getitem__(self,\
    \ idx):\n        text = str(self.texts[idx])\n        encodings = self.tokenizer(\n\
    \            text,\n            truncation=True,\n            padding=\"max_length\"\
    ,\n            max_length=self.max_length,\n            return_tensors=None,\n\
    \        )\n        item = {\n            \"input_ids\": torch.tensor(encodings[\"\
    input_ids\"], dtype=torch.long),\n            \"attention_mask\": torch.tensor(\n\
    \                encodings[\"attention_mask\"], dtype=torch.long\n           \
    \ ),\n        }\n        if self.labels is not None:\n            item[\"labels\"\
    ] = torch.tensor(self.labels[idx], dtype=torch.long)\n        return item\n\n\n\
    # Get original texts for training\nauthor_map = {\"EAP\": 0, \"HPL\": 1, \"MWS\"\
    : 2}\ntrain_texts_orig = train_df[\"text\"].values\ntrain_labels_orig = np.array([author_map[a]\
    \ for a in train_df[\"author\"].values])\ntest_texts = test_df[\"text\"].values\n\
    test_ids = test_df[\"id\"].values\n\n# Use previously computed indices for train/validation\
    \ split\ntrain_indices = train_set.index.tolist()\nval_indices = val_set.index.tolist()\n\
    \ntrain_texts_final = train_texts_orig[train_indices]\ntrain_labels_final = train_labels_orig[train_indices]\n\
    val_texts_final = train_texts_orig[val_indices]\nval_labels_final = train_labels_orig[val_indices]\n\
    \nbatch_size = 16\nmax_length = 512\n\ntrain_dataset = SpookyDataset(\n    train_texts_final,\
    \ train_labels_final, tokenizer, max_length\n)\nval_dataset = SpookyDataset(val_texts_final,\
    \ val_labels_final, tokenizer, max_length)\ntest_dataset = SpookyDataset(test_texts,\
    \ None, tokenizer, max_length)\n\ntrain_loader = DataLoader(\n    train_dataset,\
    \ batch_size=batch_size, shuffle=True, num_workers=4, pin_memory=True\n)\nval_loader\
    \ = DataLoader(\n    val_dataset, batch_size=batch_size, shuffle=False, num_workers=4,\
    \ pin_memory=True\n)\ntest_loader = DataLoader(\n    test_dataset, batch_size=batch_size,\
    \ shuffle=False, num_workers=4, pin_memory=True\n)\n\n# ============================================================\n\
    # TRAINING LOOP\n# ============================================================\n\
    num_epochs = 30\npatience = 5\nbest_val_score = float(\"inf\")\nepochs_no_improve\
    \ = 0\nscaler_grad = GradScaler()\nos.makedirs(\"./submission\", exist_ok=True)\n\
    \nfrom torch.optim.lr_scheduler import CosineAnnealingWarmRestarts\nimport math\n\
    \n# Linear warmup, then cosine annealing\ntotal_steps = len(train_loader) * num_epochs\n\
    warmup_steps = int(0.1 * total_steps)\n\n# Initialize scheduler\nscheduler = CosineAnnealingWarmRestarts(\n\
    \    optimizer,\n    T_0=total_steps // 2,\n    T_mult=1,\n    eta_min=1e-6\n\
    )\n\n# Save initial LR for warmup scaling\ninitial_lrs = [param_group['lr'] for\
    \ param_group in optimizer.param_groups]\n\nfor epoch in range(num_epochs):\n\
    \    model.train()\n    total_train_loss = 0\n    num_train_batches = 0\n\n  \
    \  for batch_idx, batch in enumerate(train_loader):\n        input_ids = batch[\"\
    input_ids\"].to(device)\n        attention_mask = batch[\"attention_mask\"].to(device)\n\
    \        labels = batch[\"labels\"].to(device)\n\n        optimizer.zero_grad()\n\
    \        with autocast():\n            logits = model(input_ids, attention_mask)\n\
    \            loss = criterion(logits, labels)\n\n        scaler_grad.scale(loss).backward()\n\
    \        scaler_grad.unscale_(optimizer)\n        torch.nn.utils.clip_grad_norm_(model.parameters(),\
    \ max_norm=1.0)\n        scaler_grad.step(optimizer)\n        scaler_grad.update()\n\
    \n        # Apply scheduler step per batch\n        current_step = epoch * len(train_loader)\
    \ + batch_idx\n        if current_step < warmup_steps:\n            warmup_factor\
    \ = current_step / max(1, warmup_steps)\n            for param_group in optimizer.param_groups:\n\
    \                param_group['lr'] = initial_lrs[0] * warmup_factor\n        else:\n\
    \            scheduler.step(epoch + current_step / len(train_loader))\n\n    \
    \    total_train_loss += loss.item()\n        num_train_batches += 1\n\n    avg_train_loss\
    \ = total_train_loss / num_train_batches\n\n    model.eval()\n    total_val_loss\
    \ = 0\n    num_val_batches = 0\n    all_val_probs = []\n    all_val_labels = []\n\
    \n    with torch.no_grad():\n        for batch in val_loader:\n            input_ids\
    \ = batch[\"input_ids\"].to(device)\n            attention_mask = batch[\"attention_mask\"\
    ].to(device)\n            labels = batch[\"labels\"].to(device)\n\n          \
    \  with autocast():\n                logits = model(input_ids, attention_mask)\n\
    \                loss = criterion(logits, labels)\n                probs = torch.softmax(logits,\
    \ dim=1)\n\n            total_val_loss += loss.item()\n            num_val_batches\
    \ += 1\n            all_val_probs.append(probs.cpu().numpy())\n            all_val_labels.append(labels.cpu().numpy())\n\
    \n    avg_val_loss = total_val_loss / num_val_batches\n\n    val_probs = np.concatenate(all_val_probs,\
    \ axis=0)\n    val_true = np.concatenate(all_val_labels, axis=0)\n\n    val_probs_clipped\
    \ = np.clip(val_probs, 1e-15, 1 - 1e-15)\n    val_probs_clipped = val_probs_clipped\
    \ / val_probs_clipped.sum(axis=1, keepdims=True)\n\n    val_score = log_loss(val_true,\
    \ val_probs_clipped)\n\n    current_lr = optimizer.param_groups[0][\"lr\"]\n \
    \   print(\n        f\"Epoch {epoch+1:2d}/{num_epochs} | Train Loss: {avg_train_loss:.4f}\
    \ | Val Loss: {avg_val_loss:.4f} | Val LogLoss: {val_score:.4f} | LR: {current_lr:.2e}\"\
    \n    )\n\n    if val_score < best_val_score:\n        best_val_score = val_score\n\
    \        epochs_no_improve = 0\n        torch.save(model.state_dict(), \"./working/best_model.pt\"\
    )\n    else:\n        epochs_no_improve += 1\n        if epochs_no_improve >=\
    \ patience:\n            print(f\"Early stopping triggered after {epoch+1} epochs\"\
    )\n            break\n\n# ============================================================\n\
    # LOAD BEST MODEL AND EVALUATE\n# ============================================================\n\
    model.load_state_dict(torch.load(\"./working/best_model.pt\"))\nmodel.eval()\n\
    \nall_val_probs = []\nall_val_labels = []\n\nwith torch.no_grad():\n    for batch\
    \ in val_loader:\n        input_ids = batch[\"input_ids\"].to(device)\n      \
    \  attention_mask = batch[\"attention_mask\"].to(device)\n        labels = batch[\"\
    labels\"].to(device)\n        with autocast():\n            logits = model(input_ids,\
    \ attention_mask)\n            probs = torch.softmax(logits, dim=1)\n        all_val_probs.append(probs.cpu().numpy())\n\
    \        all_val_labels.append(labels.cpu().numpy())\n\nval_probs = np.concatenate(all_val_probs,\
    \ axis=0)\nval_true = np.concatenate(all_val_labels, axis=0)\nval_probs_clipped\
    \ = np.clip(val_probs, 1e-15, 1 - 1e-15)\nval_probs_clipped = val_probs_clipped\
    \ / val_probs_clipped.sum(axis=1, keepdims=True)\nfinal_val_score = log_loss(val_true,\
    \ val_probs_clipped)\n\n# ============================================================\n\
    # TEST INFERENCE\n# ============================================================\n\
    all_test_probs = []\nwith torch.no_grad():\n    for batch in test_loader:\n  \
    \      input_ids = batch[\"input_ids\"].to(device)\n        attention_mask = batch[\"\
    attention_mask\"].to(device)\n        with autocast():\n            logits = model(input_ids,\
    \ attention_mask)\n            probs = torch.softmax(logits, dim=1)\n        all_test_probs.append(probs.cpu().numpy())\n\
    \ntest_probs = np.concatenate(all_test_probs, axis=0)\n\n# ============================================================\n\
    # GENERATE SUBMISSION\n# ============================================================\n\
    submission = pd.DataFrame(\n    {\n        \"id\": test_ids,\n        \"EAP\"\
    : test_probs[:, 0],\n        \"HPL\": test_probs[:, 1],\n        \"MWS\": test_probs[:,\
    \ 2],\n    }\n)\n\nepsilon = 1e-15\nfor col in [\"EAP\", \"HPL\", \"MWS\"]:\n\
    \    submission[col] = np.clip(submission[col], epsilon, 1 - epsilon)\n\nrow_sums\
    \ = submission[[\"EAP\", \"HPL\", \"MWS\"]].sum(axis=1)\nsubmission[\"EAP\"] =\
    \ submission[\"EAP\"] / row_sums\nsubmission[\"HPL\"] = submission[\"HPL\"] /\
    \ row_sums\nsubmission[\"MWS\"] = submission[\"MWS\"] / row_sums\n\nsubmission.to_csv(\"\
    ./submission/submission.csv\", index=False)\nprint(f\"Submission saved: {submission.shape}\"\
    )\n\nprint(f\"Final Validation Score: {final_val_score}\")\n```"
