apiVersion: v1
kind: Pod
metadata:
  name: runforest-protocol-retry-a40x1-r66
  namespace: ecepxie
  labels:
    app: runforest-protocol-retry-r66
spec:
  restartPolicy: Never
  containers:
  - name: dev
    image: haomingwang22/mlevolve:v1
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc", "exec sleep infinity"]
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/a40: "1"
      limits:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/a40: "1"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: haoming-storage
