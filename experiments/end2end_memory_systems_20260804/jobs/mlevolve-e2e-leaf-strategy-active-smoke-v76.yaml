  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v76
    mlevolve.ai/workload: mlevolve-e2e-leaf-strategy-active-smoke-v76
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: six-hour-online-strategy-contract-reconcile-smoke
    mlevolve.ai/actuation: required-strategy-decomposed-alternate-reconcile-improve-debug
    mlevolve.ai/manifest-sha256: 7bb1108825c1f02891cfd53b7ba772f071f2921c3c0ca6cf6c5e70c61a2e497d
    mlevolve.ai/source-manifest-sha256: c923196b30d187417e59f06949f816e8d4160fca311e92cb152133e6585c00d1
    mlevolve.ai/source-lock-manifest-sha256: 5bb82aa6928dbebb94c2ee671968b81d2730642401e5be5640efc0b2ae45f9cc
    mlevolve.ai/systems-manifest-sha256: 860c67c5a62b4c43e2fea2320883fef595b66c7a1a43a8110825b8bb6ef1a6d2
    mlevolve.ai/source-git-head: 5dee9871
    mlevolve.ai/per-index-search-budget-seconds: "21600"
