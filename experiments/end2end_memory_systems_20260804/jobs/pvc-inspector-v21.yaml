apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-pvc-inspector-v21
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-agent-v21
    mlevolve.ai/workload: mlevolve-e2e-pvc-inspector-v21
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
spec:
  restartPolicy: Never
  containers:
  - name: inspector
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    command: ["/usr/local/bin/python", "-m", "http.server", "8086", "--directory", "/workspace"]
    resources:
      requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
      limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
  volumes:
  - name: workspace
    persistentVolumeClaim: {claimName: haoming-storage}
