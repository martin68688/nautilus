coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: "\nModel1: microsoft/deberta-v3-large\n\nDescription:DeBERTa-v3-large\
    \ (435M parameters) is a large-scale pretrained language model with disentangled\
    \ attention mechanisms. Superior to BERT for authorship attribution. Use for better\
    \ performance than BERT, especially with longer texts. Train for 20-40 epochs.\
    \ No preprocessing needed. Architecture: 24 layers, hidden size 1024, 40 attention\
    \ heads. Best for: text classification, authorship attribution, sentiment analysis,\
    \ NLI. Outperforms BERT and RoBERTa on most benchmarks.\n\nCode template (MUST\
    \ copy exactly — do NOT change model variant names or file paths):\n```python\n\
    from transformers import AutoTokenizer, AutoModelForSequenceClassification, AdamW\n\
    import torch\n\n# Load DeBERTa-v3-large for authorship attribution\nmodel_name\
    \ = 'microsoft/deberta-v3-large'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
    model = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=num_authors)\n\
    \ndevice = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel.to(device)\n\
    \n# Tokenize (DeBERTa handles longer sequences well)\ntrain_encodings = tokenizer(train_texts,\
    \ truncation=True, padding=True, max_length=512, return_tensors='pt')\n\n# Training\
    \ configuration\noptimizer = AdamW(model.parameters(), lr=2e-5, weight_decay=0.01)\n\
    \n# Train for 20-40 epochs for authorship attribution\nfor epoch in range(20):\n\
    \    model.train()\n    for batch in train_loader:\n        input_ids, attention_mask,\
    \ labels = [b.to(device) for b in batch]\n        outputs = model(input_ids=input_ids,\
    \ attention_mask=attention_mask, labels=labels)\n        loss = outputs.loss\n\
    \        loss.backward()\n        optimizer.step()\n        optimizer.zero_grad()\n\
    \n# Prediction\nmodel.eval()\nwith torch.no_grad():\n    test_encodings = tokenizer(test_texts,\
    \ truncation=True, padding=True, max_length=512, return_tensors='pt')\n    outputs\
    \ = model(**test_encodings.to(device))\n    probs = torch.softmax(outputs.logits,\
    \ dim=1).cpu().numpy()\n```"
