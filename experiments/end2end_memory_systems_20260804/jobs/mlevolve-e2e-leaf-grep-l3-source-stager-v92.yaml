apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-grep-l3-source-stager-v92
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-memory-agent-v92
    mlevolve.ai/workload: mlevolve-e2e-leaf-grep-l3-source-stager-v92
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: leaf-v92-immutable-source-staging-after-a100-failure
spec:
  activeDeadlineSeconds: 3600
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
    - name: source-stager
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
