apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-implementation-smoke-v30
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    experiment: experiment-end2end-memory-agent-v20
    mlevolve.ai/workload: mlevolve-e2e-leaf-implementation-smoke-v30
    ecepxie.nrp/owner: haoming
    app.kubernetes.io/managed-by: codex-nrp-training
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
  containers:
  - name: dev-container
    image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
    imagePullPolicy: IfNotPresent
    command:
    - /bin/bash
    - -lc
    - exec /usr/local/bin/python -m http.server 8086 --directory /workspace
    resources:
      requests:
        cpu: "16"
        memory: 32Gi
        ephemeral-storage: 64Gi
        nvidia.com/a100: "1"
      limits:
        cpu: "16"
        memory: 32Gi
        ephemeral-storage: 64Gi
        nvidia.com/a100: "1"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: haoming-storage
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
