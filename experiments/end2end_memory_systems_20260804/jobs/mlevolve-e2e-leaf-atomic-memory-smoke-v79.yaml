              cpu: "16"
              memory: 64Gi
              ephemeral-storage: 64Gi
              nvidia.com/a100: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: shm
              mountPath: /dev/shm
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: haoming-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
