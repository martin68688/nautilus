apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-e2e-leaf-official-top10-a100-dev-v124
  namespace: ecepxie
  labels:
    app: mlevolve-end2end
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: experiment-end2end-leaf-official-top10-v124
    mlevolve.ai/workload: leaf-official-top10-v124
    task: leaf-classification
  annotations:
    mlevolve.ai/purpose: continue-indices-2-through-6-after-v123-ceph-folio-stall
    mlevolve.ai/source-git-head: 08824db13c248dd9546b14cefd488886d2e5e6b2
    mlevolve.ai/source-branch: codex/leaf-official-top10-v124
    mlevolve.ai/output-root: /workspace/experiment-end2end-leaf-official-top10-v124
    mlevolve.ai/credential-boundary: kaggle-credentials-remain-local
    mlevolve.ai/predecessor-pod-uid: 5a2e3b12-1504-4709-835c-6b51f0797da9
    mlevolve.ai/predecessor-blocker: ceph-folio-wait-loading-siglip2
spec:
  activeDeadlineSeconds: 21600
  restartPolicy: Never
  terminationGracePeriodSeconds: 120
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - ren-gp-argo-01.madren.org
                  - node-1-3.sdsc.optiputer.net
                  - node-2-3.sdsc.optiputer.net
  initContainers:
    - name: stage-model-cache
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - |
          set -euo pipefail
          src=/workspace/huggingface
          dst=/model-cache/huggingface
          model=models--google--siglip2-so400m-patch16-256
          blob=810ddc85ac019e6b2738b9130ae3602e41eb093a848a297a0ad296ca1f39dc67
          mkdir -p "$dst/hub"
          cp -a --reflink=never "$src/hub/$model" "$dst/hub/$model"
          cp -a --reflink=never "$src/torch" "$dst/torch"
          echo "$blob  $dst/hub/$model/blobs/$blob" | sha256sum -c -
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 8Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
        - name: model-cache
          mountPath: /model-cache
  containers:
    - name: official-top10-dev
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: HF_HOME
          value: /model-cache/huggingface
        - name: HUGGINGFACE_HUB_CACHE
          value: /model-cache/huggingface/hub
        - name: TRANSFORMERS_CACHE
          value: /model-cache/huggingface/hub
        - name: TORCH_HOME
          value: /model-cache/huggingface/torch
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: model-cache
      emptyDir:
        sizeLimit: 12Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
