    ---\ntitle: Fine-tuning LLMs with LoRA improves performance in cross-lingual tasks\n\
    confidence: HIGH\npapers: [2024acl-long622, 2024findings-acl393]\n---\n\n# Fine-tuning\
    \ LLMs with LoRA improves performance in cross-lingual tasks\n\nLLMs fine-tuned\
    \ using Low-Rank Adaptation (LoRA) demonstrate superior performance in cross-lingual\
    \ tasks compared to standard fine-tuning methods. LoRA reduces computational overhead\
    \ while maintaining or improving accuracy, particularly in low-resource language\
    \ settings.\n\n## Papers & Evidence\n- `2024acl-long622` (Split and Rephrase with\
    \ Large Language Models): \"LoRA adaptation with our hand-crafted simple prompt\
    \ achieved the best results overall.\"\n- `2024findings-acl393` (Multi-level multi-label\
    \ text classification): \"Llama-2-7b fine-tuned with LoRA outperformed other models\
    \ in Russian datasets.\"\n\n## Actionable Guidance\nUse LoRA for efficient fine-tuning\
    \ of LLMs in cross-lingual tasks, especially when computational resources are\
    \ limited.\n\n**Condition**: When training datasets of sufficient size are available\n\
    **Confidence**: HIGH - Supported by multiple papers demonstrating consistent performance\
    \ improvements\n\n#### Batch-ICL enhances in-context learning efficiency and order-agnostic\
    \ performance\n---\ntitle: Batch-ICL enhances in-context learning efficiency and\
    \ order-agnostic performance\nconfidence: HIGH\npapers: [2024findings-acl638,\
    \ 2024findings-acl690]\n---\n\n# Batch-ICL enhances in-context learning efficiency\
    \ and order-agnostic performance\n\nBatch-ICL processes in-context learning examples\
    \ in batches, aggregating their meta-gradients for more efficient and order-agnostic\
    \ performance. This method reduces computational overhead while maintaining or\
    \ improving accuracy compared to standard ICL approaches.\n\n## Papers & Evidence\n\
    - `2024findings-acl638` (Batch-ICL): \"Batch-ICL consistently exhibits improved\
    \ accuracy compared to the average accuracy achieved through all permutations\
    \ of ICL examples.\"\n- `2024findings-acl690` (Poor-Supervised Evaluation): \"\
    The EM-based optimization achieves perfect alignment with true labels (0.971 rp\
    \ and 0.989 rs).\"\n\n## Actionable Guidance\nImplement Batch-ICL for order-agnostic\
    \ and computationally efficient in-context learning, particularly when dealing\
    \ with multiple demonstration examples.\n\n**Condition**: Across various tasks\
    \ and model sizes\n**Confidence**: HIGH - Demonstrated effectiveness in multiple\
    \ evaluation scenarios\n\n#### Cross-lingual alignment benefits from large vocabulary\
    \ models\n---\ntitle: Cross-lingual alignment benefits from large vocabulary models\n\
    confidence: HIGH\npapers: [2024acl-long44, 2024findings-acl393]\n---\n\n# Cross-lingual\
    \ alignment benefits from large vocabulary models\n\nModels with large vocabulary\
    \ sizes (e.g., XLM-V with 900k tokens) significantly outperform smaller vocabulary\
    \ models in cross-lingual alignment tasks, particularly for low-resource languages.\n\
    \n## Papers & Evidence\n- `2024acl-long44` (Belebele Benchmark): \"XLM-V has a\
    \ massive 900k-token vocabulary that allocates capacity for each individual language.\"\
    \n- `2024findings-acl393` (Multi-level multi-label text classification): \"Large\
    \ vocabulary models handle Ottoman Turkish character encoding challenges better\
    \ than smaller models.\"\n\n## Actionable Guidance\nPrefer models with large,\
    \ language-specific vocabularies for cross-lingual tasks, especially when working\
    \ with low-resource languages.\n\n**Condition**: When evaluating models on diverse\
    \ language families\n**Confidence**: HIGH - Consistent findings across different\
    \ evaluation frameworks\n\n#### Hierarchical annotation improves dataset quality\
    \ for low-resource languages\n---\ntitle: Hierarchical annotation improves dataset\
    \ quality for low-resource languages\nconfidence: HIGH\npapers: [2024acl-long44,\
    \ 2024findings-acl393]\n---\n\n# Hierarchical annotation improves dataset quality\
    \ for low-resource languages\n\nHierarchical annotation processes involving multiple\
    \ review stages significantly improve dataset quality, particularly for low-resource\
