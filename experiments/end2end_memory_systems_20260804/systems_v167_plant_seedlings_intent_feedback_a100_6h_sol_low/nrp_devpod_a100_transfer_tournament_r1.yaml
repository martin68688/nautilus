apiVersion: v1
kind: Pod
metadata:
  name: mlevolve-plant-v167-tournament-a100-r1-dev
  namespace: ecepxie
  annotations:
    mlevolve.ai/purpose: plant-v167-real-four-seat-transfer-tournament
    mlevolve.ai/source-task: leaf-classification
    mlevolve.ai/target-task: plant-seedlings-classification
    mlevolve.ai/llm-endpoint: private-cluster-local-cliproxyapi
    mlevolve.ai/preserves: mlevolve-plant-v167-portfolio-a40-recovery-dev
  labels:
    app: mlevolve-end2end-dev
    app.kubernetes.io/managed-by: codex-nrp-training
    ecepxie.nrp/owner: haoming
    experiment: plant-v167-transfer-tournament-a100-r1
    mlevolve.ai/release-mode: standalone-six-hour-transfer
    mlevolve.ai/system: four-seat-transfer-tournament
spec:
  activeDeadlineSeconds: 50400
  restartPolicy: Never
  terminationGracePeriodSeconds: 300
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
      effect: PreferNoSchedule
  containers:
    - name: mlevolve
      image: docker.io/haomingwang22/mlevolve@sha256:fe0b9c383391d3e62e9f321943b4fdedaa4df54ad7f45b0395c8647a195c20cc
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test "${OPENAI_BASE_URL:-}" = "http://cliproxyapi-haoming.ecepxie.svc.cluster.local:8317/v1"
          test "${OPENAI_MODEL:-}" = "gpt-5.6-sol"
          test -z "${RUNFOREST_DEV_EXECUTION_ROLE:-}"
          exec sleep infinity
      envFrom:
        - secretRef:
            name: cliproxyapi-haoming-client
      env:
        - name: OPENAI_MODEL
          value: gpt-5.6-sol
        - name: OPENAI_REASONING_EFFORT
          value: low
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
        limits:
          cpu: "16"
          memory: 32Gi
          ephemeral-storage: 64Gi
          nvidia.com/a100: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: haoming-storage
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
