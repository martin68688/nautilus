# 临时 pod：只为读 PVC 上 k7bfl 最终 journal，读完即删。无 GPU，最小资源。
apiVersion: v1
kind: Pod
metadata:
  name: tmp-read-pvc
  namespace: ecepxie
spec:
  restartPolicy: Never
  containers:
  - name: r
    image: haomingwang22/mlevolve:v1
    command: ["sleep", "600"]
    resources:
      limits: {cpu: "1", memory: "1Gi"}
      requests: {cpu: "1", memory: "1Gi"}
    volumeMounts:
    - {name: s, mountPath: /workspace}
  volumes:
  - name: s
    persistentVolumeClaim: {claimName: haoming-storage}
